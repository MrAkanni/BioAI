<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BIOLAB AR — Viewer</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071310; --panel:rgba(14,31,25,0.88); --line:rgba(232,255,244,0.14);
    --text:#e8f5ee; --text-dim:#85a396; --teal:#2bd6a8; --amber:#f0b94a; --coral:#ef6461;
  }
  html,body{margin:0; height:100%; background:var(--bg); font-family:'IBM Plex Mono',monospace; overflow:hidden;}
  /* AR.js injects its own video; keep our chrome above it */
  .hud{position:fixed; left:0; right:0; z-index:10; display:flex; justify-content:center; pointer-events:none;}
  .hud > *{pointer-events:auto;}
  .hud-top{top:0; padding:12px;}
  .topbar{
    display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:10px 18px; backdrop-filter:blur(8px); max-width:94vw;
  }
  .logo{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--text); white-space:nowrap;}
  .logo .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px var(--teal); margin-right:7px; vertical-align:middle;}
  .lab-name{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .status-dot{width:9px; height:9px; border-radius:50%; background:var(--coral); flex-shrink:0; transition:background .3s;}
  .status-dot.found{background:var(--teal); box-shadow:0 0 8px var(--teal);}
  .back{
    color:var(--amber); text-decoration:none; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    border:1px solid var(--amber); border-radius:999px; padding:5px 12px; white-space:nowrap;
  }
  .hud-bottom{bottom:0; padding:16px;}
  .hint{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 18px;
    color:var(--text-dim); font-size:12px; text-align:center; max-width:340px; backdrop-filter:blur(8px);
  }
  .hint b{color:var(--text);}
  #errorOverlay{
    position:fixed; inset:0; z-index:50; background:var(--bg); display:none;
    align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  #errorOverlay .box{max-width:420px; color:var(--text-dim); font-size:13px; line-height:1.8;}
  #errorOverlay h2{font-family:'Space Grotesk',sans-serif; color:var(--text); margin:0 0 12px;}
  #errorOverlay a{color:var(--teal);}
  #loading{
    position:fixed; inset:0; z-index:40; background:var(--bg); display:flex;
    align-items:center; justify-content:center; flex-direction:column; gap:16px;
    color:var(--text-dim); font-size:12px; text-transform:uppercase; letter-spacing:0.1em;
    transition:opacity .5s;
  }
  .spinner{width:34px; height:34px; border:2px solid var(--line); border-top-color:var(--teal); border-radius:50%; animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #cam{position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; background:#000;}
  a-scene.markerless{position:fixed !important; inset:0; z-index:1;}
  a-scene.markerless canvas{background:transparent !important;}
  .start-btn{pointer-events:auto; font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.08em; text-transform:uppercase; background:var(--teal); color:#04100c; border:none; border-radius:999px; padding:14px 30px; cursor:pointer; font-weight:600;}
  .loading-note{max-width:300px; text-align:center; line-height:1.6; text-transform:none; letter-spacing:0; font-size:12px;}
  .tools{display:flex; gap:8px; margin-top:10px; justify-content:center; flex-wrap:wrap;}
  .tools button, .tools a{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; background:var(--panel); color:var(--amber); border:1px solid var(--amber); border-radius:999px; padding:8px 14px; cursor:pointer; text-decoration:none; backdrop-filter:blur(8px);}
</style>
</head>
<body>

<div id="loading"><div class="spinner" id="spin"></div><span id="loadMsg">Loading 3D engine…</span>
  <div class="loading-note" id="loadNote"></div>
  <button class="start-btn" id="startBtn" style="display:none">Start AR</button>
</div>

<div id="errorOverlay">
  <div class="box">
    <h2>Camera unavailable</h2>
    <p>BIOLAB AR needs camera access over HTTPS.<br><br>
    Check that you allowed the camera permission when prompted, that no other app is using the camera, and that you opened this page via its <b>https://</b> link.<br><br>
    <a href="biolab.html">← Back to BIOLAB</a></p>
  </div>
</div>

<div class="hud hud-top">
  <div class="topbar">
    <span class="logo"><span class="dot"></span>BIOLAB AR</span>
    <span class="status-dot" id="statusDot"></span>
    <span class="lab-name" id="labName">—</span>
    <a class="back" href="biolab.html">Exit</a>
  </div>
</div>

<div class="hud hud-bottom" style="flex-direction:column; align-items:center;">
  <div class="hint" id="hint">&nbsp;</div>
  <div class="tools" id="tools"></div>
</div>

<!-- scene is created by the script below (markerless by default) -->

<script>
/* ---------- lab registry ---------- */
const LAB_TITLES = {
  membrane:      'Cell Membrane Transport',
  enzyme:        'Enzyme Activity',
  punnett:       'Punnett Square',
  dna:           'DNA Replication',
  photosynthesis:'Photosynthesis',
  respiration:   'Cellular Respiration',
  circulatory:   'Circulatory System',
  respiratory:   'Respiratory System',
  water:         'Water in 3D',
  dna3d:         'DNA Helix in 3D',
  cell3d:        'Animal Cell in 3D',
  ph:            'pH & Buffers',
  cellsize:      'Cell Size & SA:V',
  mitosis:       'Mitosis',
  nephron:       'The Nephron',
  dihybrid:      'Dihybrid Cross',
  chemiosmosis:  'Chemiosmosis & ATP Synthase',
};

function el(tag, attrs, parent){
  const e = document.createElement(tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || root).appendChild(e);
  return e;
}

let root; // #modelRoot

function addLabel(text){
  el('a-text', { value: text, align:'center', color:'#2bd6a8',
    position:'0 1.6 0', scale:'0.6 0.6 0.6' });
}

function spin(entity, dur){
  entity.setAttribute('animation__spin', `property: rotation; to: 0 360 0; loop: true; dur: ${dur||9000}; easing: linear`);
}

/* ---------- model builders (A-Frame primitives) ---------- */
const BUILDERS = {

  membrane(){
    const g = el('a-entity', { position:'0 0.8 0' });
    el('a-sphere', { radius:'0.8', color:'#2bd6a8', opacity:'0.22', segmentsWidth:'24', segmentsHeight:'18' }, g);
    el('a-sphere', { radius:'0.78', color:'#2bd6a8', opacity:'0.1', wireframe:'true' }, g);
    el('a-sphere', { radius:'0.24', color:'#f0b94a', position:'0 0 0' }, g); // nucleus-ish solute core
    const orbit = el('a-entity', {}, g);
    for(let i=0;i<8;i++){
      const a = i/8*Math.PI*2;
      el('a-sphere', { radius:'0.07', color: i%2? '#5eb8ff':'#f0b94a',
        position: `${Math.cos(a)*1.1} ${Math.sin(a*2)*0.25} ${Math.sin(a)*1.1}` }, orbit);
    }
    spin(orbit, 6000);
    spin(g, 16000);
    addLabel('CELL MEMBRANE');
  },

  enzyme(){
    const g = el('a-entity', { position:'0 0.8 0' });
    el('a-torus', { radius:'0.55', 'radius-tubular':'0.14', color:'#f0b94a', rotation:'90 0 0' }, g);
    const sub = el('a-sphere', { radius:'0.2', color:'#2bd6a8', position:'0 1.2 0' }, g);
    sub.setAttribute('animation__dock', 'property: position; from: 0 1.2 0; to: 0 0.05 0; dir: alternate; loop: true; dur: 1800; easing: easeInOutQuad');
    spin(g, 10000);
    addLabel('ENZYME + SUBSTRATE');
  },

  punnett(){
    const g = el('a-entity', { position:'0 0.7 0' });
    const cells = [ ['Aa','#2bd6a8'], ['Aa','#2bd6a8'], ['Aa','#2bd6a8'], ['aa','#ef6461'] ];
    cells.forEach((c,i) => {
      const x = (i%2 ? 0.42 : -0.42), y = (i<2 ? 0.42 : -0.42);
      const box = el('a-box', { width:'0.7', height:'0.7', depth:'0.12', color:'#0e1f19',
        position:`${x} ${y} 0` }, g);
      el('a-text', { value:c[0], align:'center', color:c[1], position:'0 0 0.09', scale:'1.4 1.4 1.4' }, box);
      el('a-box', { width:'0.72', height:'0.72', depth:'0.1', color:c[1], opacity:'0.25', position:'0 0 -0.02' }, box);
    });
    spin(g, 14000);
    addLabel('Aa x Aa CROSS');
  },

  dna(){
    const g = el('a-entity', { position:'0 0.35 0' });
    const pairs = [['#2bd6a8','#5eb8ff'],['#f0b94a','#9c8ff2']];
    const N = 12, step = 0.16, twist = 0.62;
    for(let i=0;i<N;i++){
      const a = i*twist, y = i*step;
      const x1 = Math.cos(a)*0.45, z1 = Math.sin(a)*0.45;
      const x2 = -x1, z2 = -z1;
      const [c1,c2] = pairs[i%2];
      el('a-sphere', { radius:'0.07', color:c1, position:`${x1} ${y} ${z1}` }, g);
      el('a-sphere', { radius:'0.07', color:c2, position:`${x2} ${y} ${z2}` }, g);
      const rung = el('a-entity', { position:`0 ${y} 0` }, g);
      el('a-cylinder', { radius:'0.02', height:'0.9', color:'#e8f5ee', opacity:'0.5',
        rotation:`90 ${-a*180/Math.PI} 0` }, rung);
    }
    spin(g, 8000);
    addLabel('DNA DOUBLE HELIX');
  },

  photosynthesis(){
    const g = el('a-entity', {});
    el('a-cylinder', { radius:'0.3', height:'0.25', color:'#3a2c18', position:'0 0.12 0' }, g); // pot/soil
    el('a-cylinder', { radius:'0.05', height:'0.7', color:'#1e5c40', position:'0 0.55 0' }, g);  // stem
    [[-0.32,0.75,20],[0.32,0.8,-20],[0,1.0,0]].forEach(l => {
      el('a-cone', { 'radius-bottom':'0.18', 'radius-top':'0.01', height:'0.5', color:'#2bd6a8',
        position:`${l[0]} ${l[1]} 0`, rotation:`0 0 ${l[2]+180}` }, g);
    });
    for(let i=0;i<5;i++){
      const b = el('a-sphere', { radius:'0.05', color:'#5eb8ff', opacity:'0.8',
        position:`${(Math.random()-0.5)*0.6} 0.9 ${(Math.random()-0.5)*0.4}` }, g);
      b.setAttribute('animation__rise', `property: position; from: ${(Math.random()-0.5)*0.6} 0.9 0; to: ${(Math.random()-0.5)*0.6} 2.2 0; loop: true; dur: ${2200+i*400}; delay: ${i*350}; easing: linear`);
    }
    spin(g, 15000);
    addLabel('PHOTOSYNTHESIS - O2 RELEASE');
  },

  respiration(){
    const g = el('a-entity', { position:'0 0.8 0' });
    const mito = el('a-sphere', { radius:'0.55', color:'#8a2f2a', scale:'1.5 0.8 0.8', opacity:'0.9' }, g);
    for(let i=-2;i<=2;i++){
      el('a-box', { width:'0.06', height:'0.5', depth:'0.5', color:'#e8a49a', position:`${i*0.25} 0 0` }, mito);
    }
    const orbit = el('a-entity', {}, g);
    for(let i=0;i<6;i++){
      const a = i/6*Math.PI*2;
      el('a-sphere', { radius:'0.08', color:'#f0b94a',
        position:`${Math.cos(a)*1.2} ${Math.sin(a)*0.3} ${Math.sin(a)*1.2}` }, orbit);
    }
    spin(orbit, 5000);
    spin(g, 13000);
    addLabel('MITOCHONDRION - ATP');
  },

  circulatory(){
    const g = el('a-entity', { position:'0 0.85 0' });
    const heart = el('a-entity', {}, g);
    el('a-sphere', { radius:'0.34', color:'#c23a34', position:'-0.2 0.15 0' }, heart);
    el('a-sphere', { radius:'0.34', color:'#c23a34', position:'0.2 0.15 0' }, heart);
    el('a-cone', { 'radius-bottom':'0.5', 'radius-top':'0.01', height:'0.75', color:'#c23a34',
      position:'0 -0.28 0', rotation:'180 0 0' }, heart);
    heart.setAttribute('animation__beat', 'property: scale; from: 1 1 1; to: 1.14 1.14 1.14; dir: alternate; loop: true; dur: 420; easing: easeInOutQuad');
    const flow = el('a-entity', {}, g);
    for(let i=0;i<8;i++){
      const a = i/8*Math.PI*2;
      el('a-sphere', { radius:'0.06', color: i%2? '#ef6461':'#5eb8ff',
        position:`${Math.cos(a)*1.05} ${Math.sin(a)*0.55} 0` }, flow);
    }
    flow.setAttribute('animation__circ', 'property: rotation; to: 0 0 360; loop: true; dur: 4000; easing: linear');
    addLabel('HEART - CIRCULATION');
  },

  water(){
    const g = el('a-entity', { position:'0 0.8 0' });
    const orbit = el('a-entity', {}, g);
    for(let i=0;i<14;i++){
      const a = i/14*Math.PI*2, r = 0.55 + (i%3)*0.18, y = Math.sin(i*1.7)*0.45;
      const m = el('a-entity', { position:`${Math.cos(a)*r} ${y} ${Math.sin(a)*r}` }, orbit);
      el('a-sphere', { radius:'0.1', color:'#ef6461' }, m);
      el('a-sphere', { radius:'0.06', color:'#ffffff', position:'0.12 -0.08 0' }, m);
      el('a-sphere', { radius:'0.06', color:'#ffffff', position:'-0.12 -0.08 0' }, m);
    }
    orbit.setAttribute('animation__pulse', 'property: scale; from: 0.7 0.7 0.7; to: 1.25 1.25 1.25; dir: alternate; loop: true; dur: 2200; easing: easeInOutSine');
    spin(g, 12000);
    addLabel('WATER MOLECULES - EXPAND / COMPRESS');
  },


  ph(){
    const g = el('a-entity', { position:'0 0.8 0' });
    el('a-cylinder', { radius:'0.55', height:'1.3', color:'#3cb44b', opacity:'0.3', 'open-ended':'false' }, g);
    el('a-cylinder', { radius:'0.56', height:'1.32', color:'#e8f5ee', wireframe:'true', opacity:'0.5' }, g);
    const ions = el('a-entity', {}, g);
    for(let i=0;i<22;i++){
      const a = i/22*Math.PI*2*3.1, r = 0.12 + (i%5)*0.08, y = -0.5 + (i*0.047)%1.0;
      el('a-sphere', { radius:'0.055', color: i%2 ? '#ef8a86' : '#7fb6f0', position:`${Math.cos(a)*r} ${y} ${Math.sin(a)*r}` }, ions);
    }
    ions.setAttribute('animation__bob', 'property: position; from: 0 -0.05 0; to: 0 0.05 0; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine');
    el('a-cylinder', { radius:'0.02', height:'1.8', color:'#cfd8d4', position:'0.2 0.5 0' }, g);
    spin(g, 14000);
    addLabel('pH & BUFFERS - H+ (red) OH- (blue)');
  },

  cellsize(){
    const g = el('a-entity', { position:'0 0.8 0' });
    const big = el('a-entity', { position:'-0.6 0 0' }, g);
    el('a-box', { width:'0.9', height:'0.9', depth:'0.9', color:'#5eb8ff', opacity:'0.25' }, big);
    el('a-box', { width:'0.5', height:'0.5', depth:'0.5', color:'#ef6461', opacity:'0.8' }, big);
    const small = el('a-entity', { position:'0.7 0 0' }, g);
    for(let i=0;i<8;i++){
      const o = 0.24;
      const c = el('a-entity', { position:`${i&1?o:-o} ${i&2?o:-o} ${i&4?o:-o}` }, small);
      el('a-box', { width:'0.4', height:'0.4', depth:'0.4', color:'#5eb8ff', opacity:'0.28' }, c);
      el('a-box', { width:'0.14', height:'0.14', depth:'0.14', color:'#ef6461', opacity:'0.8' }, c);
    }
    spin(g, 12000);
    addLabel('1 BIG CELL vs 8 SMALL CELLS');
  },

  mitosis(){
    const g = el('a-entity', { position:'0 0.8 0' });
    el('a-sphere', { radius:'0.85', color:'#5eb8ff', opacity:'0.15' }, g);
    el('a-sphere', { radius:'0.86', color:'#5eb8ff', wireframe:'true', opacity:'0.4' }, g);
    [-1,1].forEach(sg => el('a-sphere', { radius:'0.05', color:'#ffffff', position:`${sg*0.75} 0 0` }, g));
    const cols = ['#8fe3c6','#8fe3c6','#ffd98a','#ffd98a'];
    const L = el('a-entity', {}, g), R = el('a-entity', {}, g);
    cols.forEach((c,i) => {
      const y = [0.3,-0.25,0.05,-0.05][i], z = [0.1,0.25,-0.3,0.35][i];
      [L,R].forEach(side => el('a-cylinder', { radius:'0.025', height:'0.3', color:c, position:`0 ${y} ${z}`, rotation:'0 0 ' + (side===L?'20':'-20') }, side));
    });
    L.setAttribute('animation__a', 'property: position; from: 0 0 0; to: -0.55 0 0; dir: alternate; loop: true; dur: 2800; easing: easeInOutSine; delay: 800');
    R.setAttribute('animation__a', 'property: position; from: 0 0 0; to: 0.55 0 0; dir: alternate; loop: true; dur: 2800; easing: easeInOutSine; delay: 800');
    spin(g, 16000);
    addLabel('MITOSIS - ANAPHASE');
  },

  nephron(){
    const g = el('a-entity', { position:'0 0.9 0', scale:'0.5 0.5 0.5' });
    el('a-sphere', { radius:'0.5', color:'#ff7b7b', opacity:'0.25', position:'-2 0.9 0' }, g);
    [[-1.5,0.9,-0.9,0.9,'#2bd6a8'],[-0.2,0.9,-0.2,-1.2,'#5eb8ff'],[0.5,-1.2,0.5,0.7,'#8f8cff'],[0.6,0.8,1.5,0.8,'#f0b94a'],[1.75,0.7,1.75,-1.7,'#c58cff']].forEach(s => {
      const dx = s[2]-s[0], dy = s[3]-s[1], len = Math.hypot(dx, dy);
      const e = el('a-cylinder', { radius:'0.07', height:String(len), color:s[4], position:`${(s[0]+s[2])/2} ${(s[1]+s[3])/2} 0`, rotation:`0 0 ${-Math.atan2(dx, dy)*180/Math.PI}` }, g);
    });
    el('a-cylinder', { radius:'0.07', height:'0.5', color:'#5eb8ff', position:'0.05 -1.2 0', rotation:'0 0 90' }, g);
    for(let i=0;i<8;i++) el('a-sphere', { radius:'0.06', color:'#ffd24a', position:`-1.3 ${0.8+i*0.02} 0` }, g).setAttribute('animation', `property: position; to: 0.2 -1.0 0; dur:${3500+i*300}; loop:true; easing:linear`);
    spin(g, 20000);
    addLabel('NEPHRON - glomerulus, PCT, loop, DCT, collecting duct');
  },

  dihybrid(){
    const g = el('a-entity', { position:'0 0.6 0' });
    const cols = ['#f6d34a','#7fcf5a','#e0b23a','#5f9a3e'];
    const ph = [[0,0,0,1],[0,1,0,1],[2,3,2,3],[0,1,2,3]];
    const lay = [0,0,1,0, 0,0,1,0, 2,2,3,2, 0,0,1,0];
    for(let i=0;i<4;i++) for(let j=0;j<4;j++){
      const k = [0,0,1,0, 0,0,1,0, 2,2,3,2, 0,0,1,0][i*4+j];
      el('a-box', { width:'0.22', height:'0.03', depth:'0.22', color:'#9fe8c6', opacity:'0.3', position:`${(j-1.5)*0.25} 0 ${(i-1.5)*0.25}` }, g);
      el('a-sphere', { radius: k<2 ? '0.08' : '0.055', color:cols[k], position:`${(j-1.5)*0.25} 0.08 ${(i-1.5)*0.25}` }, g);
    }
    spin(g, 14000);
    addLabel('9 round yellow : 3 round green : 3 wrinkled yellow : 1 wrinkled green');
  },

  chemiosmosis(){
    const g = el('a-entity', { position:'0 0.8 0' });
    el('a-box', { width:'2.2', height:'0.1', depth:'0.8', color:'#f0b94a', opacity:'0.6' }, g);
    [-0.8,-0.4,0].forEach(x => el('a-box', { width:'0.22', height:'0.24', depth:'0.3', color:'#5eb8ff', opacity:'0.8', position:`${x} 0 0` }, g));
    const syn = el('a-entity', { position:'0.8 -0.25 0' }, g);
    el('a-sphere', { radius:'0.13', color:'#ffb347' }, syn);
    el('a-cylinder', { radius:'0.04', height:'0.25', color:'#ffd98a', position:'0 0.2 0' }, syn);
    syn.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 1500; loop: true; easing: linear');
    for(let i=0;i<24;i++) el('a-sphere', { radius:'0.025', color:'#ff7b6b', position:`${Math.random()*2-1} ${0.1+Math.random()*0.6} ${Math.random()*0.6-0.3}` }, g);
    spin(g, 18000);
    addLabel('H+ flows through ATP synthase - ATP made');
  },

  dna3d(){ BUILDERS.dna(); },

  cell3d(){
    const g = el('a-entity', { position:'0 0.8 0' });
    el('a-sphere', { radius:'0.85', color:'#5eb8ff', opacity:'0.18' }, g);
    el('a-sphere', { radius:'0.28', color:'#9c6bff', position:'0 0 0' }, g);
    const orbs = el('a-entity', {}, g);
    [['#c9531e',0.5,0.2,0.3],['#c9531e',-0.4,0.3,-0.35],['#c9531e',0.1,-0.45,0.4],['#b99a12',-0.5,-0.2,0.3],['#2b88b8',0.35,0.45,-0.3]].forEach(o=>{
      el('a-sphere', { radius:'0.1', color:o[0], position:`${o[1]} ${o[2]} ${o[3]}` }, orbs);
    });
    orbs.setAttribute('animation__explode','property: scale; from: 0.8 0.8 0.8; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine');
    spin(g, 14000);
    addLabel('CELL - EXPLODE VIEW');
  },

  respiratory(){
    const g = el('a-entity', { position:'0 0.7 0' });
    el('a-cylinder', { radius:'0.07', height:'0.6', color:'#c9b8a8', position:'0 0.85 0' }, g);
    const l = el('a-sphere', { radius:'0.42', color:'#e8a49a', scale:'0.75 1.15 0.7', position:'-0.4 0.2 0' }, g);
    const r = el('a-sphere', { radius:'0.42', color:'#e8a49a', scale:'0.75 1.15 0.7', position:'0.4 0.2 0' }, g);
    [l,r].forEach(lung => lung.setAttribute('animation__breathe',
      'property: scale; from: 0.75 1.15 0.7; to: 0.9 1.32 0.84; dir: alternate; loop: true; dur: 1900; easing: easeInOutSine'));
    spin(g, 16000);
    addLabel('LUNGS - BREATHING');
  },
};

/* ---------- boot ---------- */
const params = new URLSearchParams(window.location.search);
const labId = (params.get('lab') || 'dna').toLowerCase();
const markerMode = (params.get('mode') || '').toLowerCase() === 'marker';
const builder = BUILDERS[labId] || BUILDERS.dna;
document.getElementById('labName').textContent = LAB_TITLES[labId] || LAB_TITLES.dna;
document.querySelector('a.back').href = 'lab.html?lab=' + encodeURIComponent(labId);

const loading = document.getElementById('loading');
const loadMsg = document.getElementById('loadMsg');
const loadNote = document.getElementById('loadNote');
const startBtn = document.getElementById('startBtn');
const hint = document.getElementById('hint');
const dot = document.getElementById('statusDot');
const tools = document.getElementById('tools');
function hideLoading(){ loading.style.opacity = '0'; setTimeout(() => loading.style.display = 'none', 500); }
function showError(){ loading.style.display = 'none'; document.getElementById('errorOverlay').style.display = 'flex'; }
function addTool(text, fn, href){
  const e = document.createElement(href ? 'a' : 'button'); e.textContent = text;
  if(href) e.href = href; else e.addEventListener('click', fn);
  tools.appendChild(e); return e;
}
function waitFor(cond, ms){ return new Promise(res => { const t0 = Date.now(); (function p(){ if(cond()) return res(true); if(Date.now()-t0 > ms) return res(false); setTimeout(p, 150); })(); }); }

/* ===== MARKERLESS (default): camera feed + phone motion sensors, no printed marker ===== */
async function startMarkerless(){
  // 1. motion permission (iOS needs this inside the tap)
  try{
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      await DeviceOrientationEvent.requestPermission();
    }
  }catch(e){}
  // 2. camera
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
  }catch(e){ return showError(); }
  const video = document.createElement('video');
  video.id = 'cam'; video.setAttribute('playsinline',''); video.muted = true; video.autoplay = true; video.srcObject = stream;
  document.body.insertBefore(video, document.body.firstChild);
  try{ await video.play(); }catch(e){}
  // 3. scene
  document.body.insertAdjacentHTML('beforeend', `
    <a-scene class="markerless" embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true"
             device-orientation-permission-ui="enabled: false" background="color: #000">
      <a-entity light="type: ambient; intensity: 0.9"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
      <a-entity id="rig" position="0 1.6 0">
        <a-entity id="cam3d" camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false; mouseEnabled: ${/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'false' : 'true'}; pointerLockEnabled: false"></a-entity>
      </a-entity>
      <a-entity id="pivot" position="0 0.8 -3"><a-entity id="modelRoot"></a-entity></a-entity>
    </a-scene>`);
  const scene = document.querySelector('a-scene');
  const ready = () => { root = document.getElementById('modelRoot'); builder(); };
  if(scene.hasLoaded) ready(); else scene.addEventListener('loaded', ready);
  await waitFor(() => scene.hasLoaded, 8000);
  scene.renderer && scene.renderer.setClearColor(0x000000, 0);
  scene.object3D.background = null;

  dot.classList.add('found');
  hint.innerHTML = '<b>Look around</b> \u2014 the model floats in front of you. <b>Drag</b> to spin it, <b>pinch</b> to resize, then walk closer or step back.';
  hideLoading();

  /* touch: one finger rotates, two fingers resize */
  const pivot = document.getElementById('pivot');
  let rotY = 0, scale = 1, last = null, pd = null;
  const apply = () => { root.setAttribute('rotation', `0 ${rotY} 0`); root.setAttribute('scale', `${scale} ${scale} ${scale}`); };
  const dist = e => Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  const surface = document.body;
  surface.addEventListener('touchstart', e => {
    if(e.target.closest('.tools,.topbar')) return;
    if(e.touches.length === 1) last = e.touches[0].clientX;
    if(e.touches.length === 2) pd = dist(e);
  }, {passive:true});
  surface.addEventListener('touchmove', e => {
    if(e.target.closest('.tools,.topbar')) return;
    if(e.touches.length === 1 && last !== null){ rotY += (e.touches[0].clientX - last)*0.6; last = e.touches[0].clientX; apply(); }
    if(e.touches.length === 2 && pd){ const d = dist(e); scale = Math.max(0.3, Math.min(3, scale*d/pd)); pd = d; apply(); }
  }, {passive:true});
  surface.addEventListener('touchend', () => { last = null; pd = null; });

  /* place the model where the phone is pointing now */
  function place(){
    const cam = document.getElementById('cam3d').object3D;
    const dir = new THREE.Vector3(0,0,-1).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
    dir.y = 0; if(dir.lengthSq() < 1e-4) dir.set(0,0,-1); dir.normalize();
    pivot.setAttribute('position', `${dir.x*3} 0.8 ${dir.z*3}`);
    scale = 1; apply();
  }
  addTool('Place here', place);
  addTool('Reset size', () => { scale = 1; rotY = 0; apply(); });
  addTool('Use marker', null, 'ar.html?lab=' + encodeURIComponent(labId) + '&mode=marker');
}

/* ===== MARKER MODE (optional, ?mode=marker): Hiro marker via AR.js ===== */
async function startMarker(){
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }).catch(() => {});
  document.body.insertAdjacentHTML('beforeend', `
    <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; precision: medium;"
             arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false;">
      <a-marker preset="hiro" id="marker" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="4">
        <a-entity id="modelRoot"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>`);
  const scene = document.querySelector('a-scene');
  const ready = () => { root = document.getElementById('modelRoot'); builder(); };
  if(scene.hasLoaded) ready(); else scene.addEventListener('loaded', ready);
  hint.innerHTML = 'Point your camera at the printed <b>Hiro marker</b>. Get it from the AR Marker section on the BIOLAB page.';
  const marker = document.getElementById('marker');
  marker.addEventListener('markerFound', () => { dot.classList.add('found'); hint.innerHTML = '<b>Marker locked.</b> Move slowly \u2014 keep the marker flat and fully in view.'; });
  marker.addEventListener('markerLost', () => { dot.classList.remove('found'); hint.innerHTML = 'Marker lost \u2014 point the camera back at the <b>Hiro marker</b>.'; });
  addTool('No marker needed', null, 'ar.html?lab=' + encodeURIComponent(labId));
  let ok = false;
  const poll = setInterval(() => { const v = document.querySelector('video'); if(v && v.readyState >= 2){ ok = true; hideLoading(); clearInterval(poll); } }, 400);
  setTimeout(() => { if(!ok){ clearInterval(poll); showError(); } }, 12000);
}

/* ===== start ===== */
(async function(){
  const ok = await waitFor(() => window.AFRAME && window.THREE, 10000);
  if(!ok){ loadMsg.textContent = 'Could not load the 3D engine'; loadNote.textContent = 'Check your internet connection and reload.'; document.getElementById('spin').style.display = 'none'; return; }
  if(markerMode){ loadMsg.textContent = 'Starting camera\u2026'; startMarker(); return; }
  document.getElementById('spin').style.display = 'none';
  loadMsg.textContent = 'Markerless AR';
  loadNote.textContent = 'No printed marker needed. Allow the camera and motion sensors, then look around to find the model.';
  startBtn.style.display = 'inline-block';
  startBtn.addEventListener('click', () => {
    startBtn.style.display = 'none'; document.getElementById('spin').style.display = 'block';
    loadMsg.textContent = 'Starting camera\u2026'; loadNote.textContent = '';
    startMarkerless();
  });
})();
</script>
