  window.activeView = view;
  let handOn = false, stream = null, hands = null, video = null, stopped = false, lastHand = null, handLoopId = null;
  const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
  const hOf = v => 0.6 + 0.014*v;           // box half-size from volume %
  const SIG = 0.55;

  const mols = [];
  for(let i=0;i<N;i++){
    const gx = i%4, gy = Math.floor(i/4)%4, gz = Math.floor(i/16);
    mols.push({
      p:[(gx-1.5)*0.62, (gy-1.5)*0.62, (gz-1)*0.62],
      v:[Math.random()-.5, Math.random()-.5, Math.random()-.5],
      R:[1,0,0, 0,1,0, 0,0,1],
      ax:[Math.random()-.5, Math.random()-.5, Math.random()-.5],
    });
  }

  const rState   = makeReadout(controls, 'State', 'Liquid');
  const rBonds   = makeReadout(controls, 'Hydrogen bonds', '0');
  const rVol     = makeReadout(controls, 'Container volume', '120 mL');
  const rPress   = makeReadout(controls, 'Gas pressure', '—');
  const tSlider  = makeSlider(controls, {label:'Temperature', min:-30, max:130, step:1, value:25, unit:' °C', onChange:v=>tempC=v});
  const vSlider  = makeSlider(controls, {label:'Container size (volume)', min:35, max:100, step:1, value:60, unit:' %', onChange:v=>{ volPct=v; }});
  makeToggle(controls, ['Show H-bonds','Hide H-bonds'], (o,i)=>{ showHB = (i===0); });
  const hint = document.createElement('div');
  hint.className = 'readout-box'; hint.dataset.role = 'hint';
  hint.innerHTML = '<span class="r-label">Controls</span><span class="r-value" style="font-size:12px;font-weight:400;line-height:1.5">Drag to rotate · scroll or two-finger pinch to expand / compress · or use your hand with the camera.</span>';
  controls.appendChild(hint);
  const handBtn = makeButton(controls, '✋ Enable hand tracking', () => handOn ? stopHands() : startHands());
  handBtn.dataset.role = 'hand';
  const handMsg = document.createElement('div'); handMsg.dataset.role = 'handmsg';
  handMsg.style.cssText = 'font-size:12px;color:var(--text-dim);margin-top:6px;min-height:16px';
  controls.appendChild(handMsg);

  /* ---- pointer / touch / wheel ---- */
  let drag = null, pinch = null;
  canvas.style.touchAction = 'none';
  canvas.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
  canvas.addEventListener('pointermove', e => {
    if(!drag || pinch) return;
    yaw += (e.clientX - drag.x)*0.01; pitch = clamp(pitch + (e.clientY - drag.y)*0.01, -1.2, 1.2);
    drag = {x:e.clientX, y:e.clientY};
  });
  const endDrag = () => { drag = null; };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', e => { e.preventDefault(); setVol(volPct - e.deltaY*0.05); }, {passive:false});
  const td = e => Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  canvas.addEventListener('touchstart', e => { if(e.touches.length===2){ pinch = td(e); drag = null; } }, {passive:true});
  canvas.addEventListener('touchmove', e => { if(e.touches.length===2 && pinch){ const d = td(e); setVol(volPct + (d-pinch)*0.25); pinch = d; } }, {passive:true});
  canvas.addEventListener('touchend', () => { pinch = null; });
  function setVol(v){ volPct = clamp(v, 35, 100); vSlider.value = Math.round(volPct); vSlider.dispatchEvent(new Event('input')); }

  /* ---- hand tracking (MediaPipe Hands, loaded only when asked) ---- */
  function loadScript(src){
    return new Promise((res, rej) => {
      if(document.querySelector('script[src="'+src+'"]')) return res();
      const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
      s.onload = res; s.onerror = () => rej(new Error('Could not load hand-tracking library (check internet).'));
      document.head.appendChild(s);
    });
  }
  async function startHands(){
    handMsg.textContent = 'Starting camera…';
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Camera needs a secure (https) page.');
      await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js');
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:320, height:240}, audio:false});
      if(stopped){ stream.getTracks().forEach(t=>t.stop()); return; }
      video = document.createElement('video');
      video.setAttribute('playsinline',''); video.muted = true; video.srcObject = stream;
      video.style.cssText = 'position:absolute;right:8px;bottom:8px;width:140px;border-radius:8px;border:1px solid var(--teal);transform:scaleX(-1);opacity:.85;pointer-events:none';
      canvasWrap.style.position = 'relative'; canvasWrap.appendChild(video);
      await video.play();
      hands = new window.Hands({locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f});
      hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.5});
      hands.onResults(onHand);
      handOn = true; handBtn.textContent = '✋ Stop hand tracking';
      handMsg.textContent = 'Show one hand. Open your fingers wide = expand · make a fist = compress · move your hand left/right to rotate.';
      const pump = async () => {
        if(stopped || !handOn) return;
        try{ if(video.readyState >= 2) await hands.send({image: video}); }catch(_){}
        handLoopId = requestAnimationFrame(pump);
      };
      pump();
    }catch(err){
      handMsg.textContent = (err && err.name === 'NotAllowedError') ? 'Camera permission was blocked. Allow it in the browser address bar, then try again.' : ('Hand tracking unavailable: ' + (err && err.message || err) + ' — use drag and scroll instead.');
      stopHands(true);
    }
  }
  function stopHands(keepMsg){
    handOn = false; lastHand = null;
    if(handLoopId) cancelAnimationFrame(handLoopId);
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    if(video && video.parentNode) video.parentNode.removeChild(video);
    video = null;
    if(hands){ try{hands.close();}catch(_){} hands = null; }
    handBtn.textContent = '✋ Enable hand tracking';
    if(!keepMsg) handMsg.textContent = '';
  }
  function onHand(res){
    const L = res.multiHandLandmarks && res.multiHandLandmarks[0];
    if(!L){ lastHand = null; return; }
    lastHand = L;
    const d = (a,b) => Math.hypot(L[a].x-L[b].x, L[a].y-L[b].y, (L[a].z-L[b].z)*0.5);
    const palm = d(0,9) || 0.1;
    const open = ([4,8,12,16,20].reduce((s,i)=>s+d(0,i),0)/5) / palm;   // ~1.0 fist … ~2.0 open
    const target = 35 + 65*clamp((open-1.0)/0.9, 0, 1);
    setVol(volPct + (target - volPct)*0.35);
    const cx = 1 - (L[0].x + L[9].x)/2;                                   // mirrored
    yaw += ((cx-0.5)*Math.PI*1.4 - yaw)*0.12;
  }

  /* ---- physics ---- */
  function targetTr(){
    const m = S.meltPoint, b = S.boilPoint;
    if(tempC < m)  return 0.12 + 0.2*clamp((tempC+30)/(m+30),0,1);
    if(tempC < b)  return 0.45 + 0.5*clamp((tempC-m)/(b-m),0,1);
    return 1.3 + 0.5*clamp((tempC-b)/30,0,1);
  }
  function step(h){
    const dt = 0.012;
    const F = mols.map(()=>[0,0,0]);
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      const a = mols[i].p, b = mols[j].p;
      const dx=a[0]-b[0], dy=a[1]-b[1], dz=a[2]-b[2];
      const r2 = dx*dx+dy*dy+dz*dz;
      if(r2 > 2.4*SIG*2.4*SIG || r2 < 1e-6) continue;
      const s2 = SIG*SIG/r2, s6 = s2*s2*s2;
      let f = 24*(2*s6*s6 - s6)/r2;
      f = clamp(f, -30, 30);
      F[i][0]+=f*dx; F[i][1]+=f*dy; F[i][2]+=f*dz;
      F[j][0]-=f*dx; F[j][1]-=f*dy; F[j][2]-=f*dz;
    }
    let ke = 0;
    mols.forEach((m,i) => {
      for(let k=0;k<3;k++){
        m.v[k] += F[i][k]*dt;
        m.v[k] = clamp(m.v[k], -4, 4);
        m.p[k] += m.v[k]*dt*3;
        const lim = h - 0.12;
        if(m.p[k] > lim){ m.p[k] = lim; m.v[k] = -Math.abs(m.v[k]); }
        if(m.p[k] < -lim){ m.p[k] = -lim; m.v[k] = Math.abs(m.v[k]); }
        ke += m.v[k]*m.v[k];
      }
    });
    const cur = ke/(3*N);
    const tr = targetTr();
    const sc = 1 + 0.06*(Math.sqrt(tr/Math.max(cur,1e-4)) - 1);
    mols.forEach(m => { m.v[0]*=sc; m.v[1]*=sc; m.v[2]*=sc; });
  }
  function rotateMol(m, tr){
    // small rotation about m.ax (Rodrigues), speed grows with temperature
    const L = Math.hypot(m.ax[0],m.ax[1],m.ax[2]) || 1;
    const x=m.ax[0]/L, y=m.ax[1]/L, z=m.ax[2]/L;
    const th = 0.02 + 0.09*Math.sqrt(tr), c=Math.cos(th), s=Math.sin(th), t=1-c;
    const Q = [t*x*x+c, t*x*y-s*z, t*x*z+s*y,  t*x*y+s*z, t*y*y+c, t*y*z-s*x,  t*x*z-s*y, t*y*z+s*x, t*z*z+c];
    const R = m.R, o = new Array(9);
    for(let i=0;i<3;i++) for(let j=0;j<3;j++) o[i*3+j] = Q[i*3]*R[j] + Q[i*3+1]*R[3+j] + Q[i*3+2]*R[6+j];
    m.R = o;
  }

  /* ---- rendering ---- */
  const FOC = 5, K0w = Math.min(H*0.17, W*0.14); let K = K0w;
  function proj(p){
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    let x = p[0]*cy + p[2]*sy, z = -p[0]*sy + p[2]*cy, y = p[1];
    const y2 = y*cp - z*sp, z2 = y*sp + z*cp;
    const sc = FOC/(FOC + z2);
    return {x:W/2 + x*sc*K, y:H/2 - y2*sc*K, z:z2, s:sc};
  }
  const HV = [[0.2*Math.sin(0.9111), -0.2*Math.cos(0.9111), 0], [-0.2*Math.sin(0.9111), -0.2*Math.cos(0.9111), 0]];
  function ball(x,y,r,c1,c2){
    const g = ctx.createRadialGradient(x-r*.35, y-r*.35, r*.1, x, y, r);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  function draw(h, bonds){
    ctx.clearRect(0,0,W,H); drawFloor(ctx,view,W,H,K);
    // box
    const cs = [];
    for(let i=0;i<8;i++) cs.push(proj([(i&1?1:-1)*h, (i&2?1:-1)*h, (i&4?1:-1)*h]));
    ctx.strokeStyle = 'rgba(43,214,168,0.45)'; ctx.lineWidth = 1.2;
    [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]].forEach(([a,b])=>{
      ctx.beginPath(); ctx.moveTo(cs[a].x,cs[a].y); ctx.lineTo(cs[b].x,cs[b].y); ctx.stroke();
    });
    // atoms
    const atoms = [];
    mols.forEach(m => {
      const R = m.R;
      atoms.push({w:m.p, o:true});
      HV.forEach(hv => {
        atoms.push({w:[m.p[0]+R[0]*hv[0]+R[1]*hv[1]+R[2]*hv[2], m.p[1]+R[3]*hv[0]+R[4]*hv[1]+R[5]*hv[2], m.p[2]+R[6]*hv[0]+R[7]*hv[1]+R[8]*hv[2]], o:false});
      });
    });
    atoms.forEach(a => a.q = proj(a.w));
    if(showHB){
      ctx.setLineDash([3,4]); ctx.strokeStyle = 'rgba(240,185,74,0.85)'; ctx.lineWidth = 1.4;
      bonds.forEach(([i,j]) => { ctx.beginPath(); ctx.moveTo(atoms[i].q.x,atoms[i].q.y); ctx.lineTo(atoms[j].q.x,atoms[j].q.y); ctx.stroke(); });
      ctx.setLineDash([]);
    }
    // covalent sticks
    ctx.strokeStyle = 'rgba(232,245,238,0.5)'; ctx.lineWidth = 2;
    for(let i=0;i<N;i++){ const o = atoms[i*3].q; for(let k=1;k<=2;k++){ const q = atoms[i*3+k].q; ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(q.x,q.y); ctx.stroke(); } }
    atoms.slice().sort((a,b)=>b.q.z-a.q.z).forEach(a => {
      if(a.o) ball(a.q.x,a.q.y,0.13*K*a.q.s,'#ff9a97','#c93f3c');
      else    ball(a.q.x,a.q.y,0.075*K*a.q.s,'#ffffff','#7fb9d8');
    });
    // hand landmarks (mirrored) for feedback
    if(lastHand){
      ctx.fillStyle = 'rgba(43,214,168,0.9)';
      lastHand.forEach(p => { ctx.beginPath(); ctx.arc((1-p.x)*W, p.y*H, 3, 0, Math.PI*2); ctx.fill(); });
    }
    // legend
    ctx.font = '12px "IBM Plex Mono", monospace'; ctx.fillStyle = 'rgba(232,245,238,0.75)';
    ctx.textAlign='center'; ctx.fillText('● O   ○ H   - - hydrogen bond', W/2, H-128); ctx.textAlign='left';
  }

  function frame(){
    K = K0w*(view.zoom||1);
    const h = hOf(volPct);
    step(h); step(h);
    const tr = targetTr();
    mols.forEach(m => rotateMol(m, tr));
    // hydrogen bonds: O of i near H of j
    const bonds = [];
    const atomW = (i,k) => {
      if(k===0) return mols[i].p;
      const R = mols[i].R, hv = HV[k-1], p = mols[i].p;
      return [p[0]+R[0]*hv[0]+R[1]*hv[1]+R[2]*hv[2], p[1]+R[3]*hv[0]+R[4]*hv[1]+R[5]*hv[2], p[2]+R[6]*hv[0]+R[7]*hv[1]+R[8]*hv[2]];
    };
    for(let i=0;i<N;i++){ const o = mols[i].p;
      for(let j=0;j<N;j++){ if(i===j) continue;
        const q = mols[j].p; if(Math.abs(o[0]-q[0])>0.5||Math.abs(o[1]-q[1])>0.5||Math.abs(o[2]-q[2])>0.5) continue;
        for(let k=1;k<=2;k++){ const w = atomW(j,k); if(Math.hypot(o[0]-w[0],o[1]-w[1],o[2]-w[2]) < 0.4) bonds.push([i*3, j*3+k]); }
      }
    }
    draw(h, bonds);
    const state = tempC < S.meltPoint ? 'Solid (ice)' : tempC < S.boilPoint ? 'Liquid' : 'Gas (vapour)';
    const V = Math.round(volPct*2);
    rState.textContent = state;
    rBonds.textContent = String(bonds.length);
    rVol.textContent = V + ' mL';
    rPress.textContent = state.startsWith('Gas') ? (101.3*((tempC+273.15)/293.15)*(200/V)).toFixed(1) + ' kPa' : '— (not a gas)';
    raf = requestAnimationFrame(frame);
  }
  frame();
  return function(){ stopped = true; cancelAnimationFrame(raf); stopHands(true); };
}

/* ---------- SHARED 3D INPUT: drag-rotate, scroll/pinch, hand tracking ---------- */
function attach3D(canvas, controls, view, slider, hintText, handHelp){
  window.activeView = view;
  const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
  let handOn = false, stream = null, hands = null, video = null, stopped = false, loopId = null;
  function setExpand(v){
    view.expand = clamp(v,0,1);
    const mn = parseFloat(slider.min), mx = parseFloat(slider.max), st = parseFloat(slider.step) || 1;
    let val = mn + view.expand*(mx-mn); val = Math.round(val/st)*st;
    slider.value = String(parseFloat(val.toFixed(4))); slider.dispatchEvent(new Event('input'));
  }
  const hint = document.createElement('div');
  hint.className = 'readout-box'; hint.dataset.role = 'hint';
  hint.innerHTML = '<span class="r-label">Controls</span><span class="r-value" style="font-size:12px;font-weight:400;line-height:1.5">' + hintText + '</span>';
  controls.appendChild(hint);
  const btn = makeButton(controls, '✋ Enable hand tracking', () => handOn ? stopHands() : startHands());
  btn.dataset.role = 'hand';
  const msg = document.createElement('div'); msg.dataset.role = 'handmsg';
  msg.style.cssText = 'font-size:12px;color:var(--text-dim);margin-top:6px;min-height:16px';
  controls.appendChild(msg);

  let drag = null, pinch = null;
  canvas.style.touchAction = 'none';
  canvas.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
  canvas.addEventListener('pointermove', e => {
    if(!drag || pinch) return;
    view.yaw += (e.clientX-drag.x)*0.01; view.pitch = clamp(view.pitch + (e.clientY-drag.y)*0.01, -1.2, 1.2);
    drag = {x:e.clientX, y:e.clientY};
  });
  const endDrag = () => { drag = null; };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', e => { e.preventDefault(); setExpand(view.expand - e.deltaY*0.001); }, {passive:false});
  const td = e => Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  canvas.addEventListener('touchstart', e => { if(e.touches.length===2){ pinch = td(e); drag = null; } }, {passive:true});
  canvas.addEventListener('touchmove', e => { if(e.touches.length===2 && pinch){ const d = td(e); setExpand(view.expand + (d-pinch)*0.004); pinch = d; } }, {passive:true});
  canvas.addEventListener('touchend', () => { pinch = null; });

  function loadScript(src){
    return new Promise((res, rej) => {
      if(document.querySelector('script[src="'+src+'"]')) return res();
      const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
      s.onload = res; s.onerror = () => rej(new Error('Could not load hand-tracking library (check internet).'));
      document.head.appendChild(s);
    });
  }
  async function startHands(){
    msg.textContent = 'Starting camera…';
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Camera needs a secure (https) page.');
      await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js');
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:320, height:240}, audio:false});
      if(stopped){ stream.getTracks().forEach(t=>t.stop()); return; }
      video = document.createElement('video');
      video.setAttribute('playsinline',''); video.muted = true; video.srcObject = stream;
      video.style.cssText = 'position:absolute;right:8px;bottom:8px;width:140px;border-radius:8px;border:1px solid var(--teal);transform:scaleX(-1);opacity:.85;pointer-events:none';
      const wrap = canvas.parentNode; wrap.style.position = 'relative'; wrap.appendChild(video);
      await video.play();
      hands = new window.Hands({locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f});
      hands.setOptions({maxNumHands:2, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.5});
      hands.onResults(onHand);
      handOn = true; btn.textContent = '✋ Stop hand tracking';
      msg.textContent = handHelp + ' TWO hands: move them apart / together to zoom.';
      const pump = async () => {
        if(stopped || !handOn) return;
        try{ if(video.readyState >= 2) await hands.send({image: video}); }catch(_){}
        loopId = requestAnimationFrame(pump);
      };
      pump();
    }catch(err){
      msg.textContent = (err && err.name === 'NotAllowedError') ? 'Camera permission was blocked. Allow it in the browser address bar, then try again.' : ('Hand tracking unavailable: ' + (err && err.message || err) + ' — use drag and scroll instead.');
      stopHands(true);
    }
  }
  function stopHands(keep){
    handOn = false; view.hand = null;
    if(loopId) cancelAnimationFrame(loopId);
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    if(video && video.parentNode) video.parentNode.removeChild(video);
    video = null;
    if(hands){ try{hands.close();}catch(_){} hands = null; }
    btn.textContent = '✋ Enable hand tracking';
    if(!keep) msg.textContent = '';
  }
  function onHand(res){
    const HS = res.multiHandLandmarks || [], L = HS[0];
    if(!L){ view.hand = null; view.hand2 = null; return; }
    view.hand = L; view.hand2 = HS[1] || null;
    if(HS.length >= 2){
      const mid = h => ({x:(h[0].x+h[9].x)/2, y:(h[0].y+h[9].y)/2});
      const A = mid(HS[0]), B = mid(HS[1]), dist = Math.hypot(A.x-B.x, A.y-B.y);
      view.zoom += (clamp(0.45 + dist*3.2, 0.5, 2.2) - (view.zoom||1))*0.25;
      const zs = document.getElementById('zoomSlider'); if(zs) zs.value = view.zoom;
      return;
    }
    const d = (a,b) => Math.hypot(L[a].x-L[b].x, L[a].y-L[b].y, (L[a].z-L[b].z)*0.5);
    const palm = d(0,9) || 0.1;
    const open = ([4,8,12,16,20].reduce((s,i)=>s+d(0,i),0)/5) / palm;
    const target = clamp((open-1.0)/0.9, 0, 1);
    setExpand(view.expand + (target - view.expand)*0.35);
    const cx = 1 - (L[0].x + L[9].x)/2;
    view.yaw += ((cx-0.5)*Math.PI*1.4 - view.yaw)*0.12;
  }
  return function cleanup(){ stopped = true; stopHands(true); };
}
function project3(view, W, H, K, p){
  const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const x = p[0]*cy + p[2]*sy, z = -p[0]*sy + p[2]*cy, y = p[1];
  const y2 = y*cp - z*sp, z2 = y*sp + z*cp, sc = 5/(5+z2);
  return {x:W/2 + x*sc*K, y:H/2 - y2*sc*K, z:z2, s:sc};
}
function ball3(ctx, x, y, r, c1, c2){
  const g = ctx.createRadialGradient(x-r*.35, y-r*.35, r*.1, x, y, r);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
}
function drawHand3(ctx, view, W, H){
  if(!view.hand) return;
  ctx.fillStyle = 'rgba(43,214,168,0.9)';
  view.hand.forEach(p => { ctx.beginPath(); ctx.arc((1-p.x)*W, p.y*H, 3, 0, Math.PI*2); ctx.fill(); });
  if(view.hand2) view.hand2.forEach(p => { ctx.beginPath(); ctx.arc((1-p.x)*W, p.y*H, 3, 0, Math.PI*2); ctx.fill(); });
}

/* ---------- LAB 10: DNA HELIX IN 3D (hand unzips it) ---------- */
function labDNA3D(ctx, canvas, controls, lab){
  const S = lab.state, W = canvas.width, H = canvas.height, K0 = kBase(canvas); let K = K0;
  const view = {yaw:0.5, pitch:0.15, expand:0, hand:null, zoom:1};
  const NB = S.seq.length, COMP = {A:'T',T:'A',G:'C',C:'G'};
  const COL = {A:['#8fe3c6','#1f9c7a'], T:['#ffd98a','#c98a1c'], G:['#ff9a97','#c93f3c'], C:['#a9c8ff','#3a68c9']};
  let raf, t = 0;
  const rState = makeReadout(controls, 'Bonds broken', '0');
  const rLeft  = makeReadout(controls, 'Hydrogen bonds intact', '0');
  const rPairs = makeReadout(controls, 'Unzipped base pairs', '0');
  const slider = makeSlider(controls, {label:'Unzip (helicase)', min:0, max:100, step:1, value:0, unit:' %', onChange:v=>{ view.expand = v/100; }});
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or two-finger pinch to unzip · or use your hand with the camera.',
    'Show one hand. Open your fingers wide = unzip the DNA · make a fist = zip it back · move left/right to rotate.');
  const hb = b => (b==='A'||b==='T') ? 2 : 3;
  function frame(){
    t += 0.01; if(!view.still) view.yaw += 0.003; K = K0*(view.zoom||1);
    const k = Math.round(view.expand*NB);                // pairs unzipped from the top
    const bag = [];
    for(let i=0;i<NB;i++){
      const y = (NB/2 - i)*0.19, ang = i*0.62 + t*0.6;
      const open = i < k ? 1 + (k-i)*0.0 : 0;           // unzipped?
      const sep = i < k ? 0.55 + 0.18*(1 - i/Math.max(k,1)) : 0;
      const r = 0.62 + sep;
      const a1 = [Math.cos(ang)*r, y, Math.sin(ang)*r], a2 = [-Math.cos(ang)*r, y, -Math.sin(ang)*r];
      const b1 = S.seq[i], b2 = COMP[b1];
      bag.push({p:a1, b:b1, i, strand:1, open}); bag.push({p:a2, b:b2, i, strand:2, open});
    }
    ctx.clearRect(0,0,W,H); drawFloor(ctx,view,W,H,K);
    bag.forEach(a => a.q = project3(view, W, H, K, a.p));
    // rungs + backbone
    for(let i=0;i<NB;i++){
      const A = bag[i*2], B = bag[i*2+1];
      if(!A.open){ ctx.strokeStyle='rgba(240,185,74,0.7)'; ctx.setLineDash([3,3]); ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(A.q.x,A.q.y); ctx.lineTo(B.q.x,B.q.y); ctx.stroke(); ctx.setLineDash([]); }
      if(i>0){ [0,1].forEach(s => { const P = bag[(i-1)*2+s], Q = bag[i*2+s];
        ctx.strokeStyle = s? 'rgba(94,184,255,0.7)':'rgba(43,214,168,0.7)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(P.q.x,P.q.y); ctx.lineTo(Q.q.x,Q.q.y); ctx.stroke(); }); }
    }
    bag.slice().sort((a,b)=>b.q.z-a.q.z).forEach(a => {
      const c = COL[a.b];
      ball3(ctx, a.q.x, a.q.y, 0.11*K*a.q.s, c[0], c[1]);
      ctx.fillStyle = '#04100c'; ctx.font = 'bold ' + Math.round(9*a.q.s+2) + 'px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center'; ctx.fillText(a.b, a.q.x, a.q.y + 3*a.q.s + 1);
    });
    ctx.textAlign = 'left';
    drawHand3(ctx, view, W, H);
    ctx.font = '12px "IBM Plex Mono", monospace'; ctx.fillStyle = 'rgba(232,245,238,0.75)';
    ctx.textAlign='center'; ctx.fillText('A–T: 2 H-bonds   G–C: 3 H-bonds   (top strand read from the top)', W/2, H-128); ctx.textAlign='left';
    let broken = 0, total = 0;
    for(let i=0;i<NB;i++){ total += hb(S.seq[i]); if(i<k) broken += hb(S.seq[i]); }
    rState.textContent = String(broken); rLeft.textContent = String(total-broken); rPairs.textContent = String(k);
    raf = requestAnimationFrame(frame);
  }
  frame();
  return function(){ cancelAnimationFrame(raf); cleanupIn(); };
}

/* ---------- LAB 11: ANIMAL CELL IN 3D (hand explodes it) ---------- */
const ORG_INFO = {
  'Nucleus':       'Holds the DNA and controls the cell.',
  'Mitochondrion': 'Site of aerobic respiration — makes ATP.',
  'Ribosome':      'Makes proteins from mRNA.',
  'Rough ER':      'Folds proteins made by attached ribosomes.',
  'Golgi':         'Modifies, sorts and packages proteins into vesicles.',
  'Lysosome':      'Digests waste and worn-out organelles.',
};
function labCell3D(ctx, canvas, controls, lab){
  const S = lab.state, W = canvas.width, H = canvas.height, K0 = kBase(canvas); let K = K0;
  const view = {yaw:0.4, pitch:0.25, expand:0, hand:null, zoom:1};
  let raf, sel = null;
  const rSel = makeReadout(controls, 'Selected', 'Tap a button below');
  const rInfo = document.createElement('div');
  rInfo.style.cssText = 'font-size:12.5px;color:var(--text-dim);line-height:1.5;margin:-4px 0 8px;min-height:36px';
  controls.appendChild(rInfo);
  const slider = makeSlider(controls, {label:'Explode view', min:0, max:100, step:1, value:0, unit:' %', onChange:v=>{ view.expand = v/100; }});
  const names = Object.keys(ORG_INFO);
  makeToggle(controls, ['None'].concat(names), (o,i) => {
    sel = i===0 ? null : o;
    rSel.textContent = sel || 'Tap a button below'; rInfo.textContent = sel ? ORG_INFO[sel] : '';
  });
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or two-finger pinch to explode / collapse · or use your hand with the camera.',
    'Show one hand. Open your fingers wide = explode the cell apart · make a fist = put it back together · move left/right to rotate.');

  // deterministic positions per organelle set, rebuilt when counts change
  function rng(seed){ let x = seed; return () => (x = (x*16807) % 2147483647) / 2147483647; }
  let items = [], sig = '';
  function add(type, n, seed, rad, size, c1, c2){
    const r = rng(seed);
    for(let i=0;i<n;i++){
      const th = r()*Math.PI*2, ph = Math.acos(2*r()-1), d = rad*(0.5 + 0.5*r());
      items.push({type, base:[d*Math.sin(ph)*Math.cos(th), d*Math.cos(ph), d*Math.sin(ph)*Math.sin(th)], size, c1, c2});
    }
  }
  function build(){
    sig = [S.mito,S.lyso,S.golgi].join(',');
    items = [{type:'Nucleus', base:[0,0,0], size:0.42, c1:'#c9a8ff', c2:'#6a45c9'}];
    add('Mitochondrion', S.mito, 11, 1.05, 0.17, '#ffb18a', '#c9531e');
    add('Lysosome',      S.lyso, 23, 1.0,  0.1,  '#f6e27a', '#b99a12');
    add('Golgi',         S.golgi, 37, 0.95, 0.14, '#9fe0ff', '#2b88b8');
    add('Rough ER',      6, 41, 0.62, 0.09, '#b7f0c2', '#3a9a54');
    add('Ribosome',      14, 53, 1.1, 0.05, '#ffffff', '#8aa0a8');
  }
  build();

  function frame(){
    if(sig !== [S.mito,S.lyso,S.golgi].join(',')) build();
    if(!view.still) view.yaw += 0.002; K = K0*(view.zoom||1);
    ctx.clearRect(0,0,W,H); drawFloor(ctx,view,W,H,K);
    const f = 1 + 1.3*view.expand;
    const R = 1.5*(0.6 + 0.4*f);
    const c = project3(view, W, H, K, [0,0,0]);
    ctx.strokeStyle = 'rgba(94,184,255,0.55)'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(94,184,255,0.07)';
    ctx.beginPath(); ctx.arc(c.x, c.y, R*K*c.s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    const list = items.map(it => ({it, q: project3(view, W, H, K, it.base.map(v=>v*f))}));
    list.sort((a,b)=>b.q.z-a.q.z);
    const labelled = {};
    list.forEach(({it,q}) => {
      const hi = sel === it.type, r = it.size*K*q.s*(hi ? 1.35 : 1);
      if(hi){ ctx.strokeStyle = '#f0b94a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(q.x,q.y,r+4,0,Math.PI*2); ctx.stroke(); }
      if(it.type === 'Mitochondrion'){
        ball3(ctx, q.x-r*0.5, q.y, r*0.8, it.c1, it.c2); ball3(ctx, q.x+r*0.5, q.y, r*0.8, it.c1, it.c2);
      } else if(it.type === 'Golgi'){
        for(let k=-1;k<=1;k++) ball3(ctx, q.x, q.y + k*r*0.7, r*0.7, it.c1, it.c2);
      } else ball3(ctx, q.x, q.y, r, it.c1, it.c2);
      if((view.expand > 0.45 || hi) && !labelled[it.type] && it.type !== 'Ribosome'){
        labelled[it.type] = 1;
        ctx.font = '11px "IBM Plex Mono", monospace'; ctx.fillStyle = 'rgba(232,245,238,0.9)';
        ctx.fillText(it.type, q.x + r + 5, q.y + 4);
      }
    });
    drawHand3(ctx, view, W, H);
    ctx.font = '12px "IBM Plex Mono", monospace'; ctx.fillStyle = 'rgba(232,245,238,0.75)';
    ctx.textAlign='center'; ctx.fillText('Explode the cell to count and label every organelle', W/2, H-128); ctx.textAlign='left';
    raf = requestAnimationFrame(frame);
  }
  frame();
  return function(){ cancelAnimationFrame(raf); cleanupIn(); };
}

function reshuffleHiddenParams(lab){
  // labs whose live simulation has a hidden parameter the challenge depends on
  if(!lab.state) return;
  if(lab.id === 'membrane'){
    lab.state.isotonicPoint = randInt(40,60);
  }
  if(lab.id === 'enzyme'){
    lab.state.optTemp = randInt(22,58);
    lab.state.optPH = randInt(3,10);
  }
  if(lab.id === 'dna3d'){
    lab.state.seq = Array.from({length:20}, () => pick(['A','T','G','C']));
  }
  if(lab.id === 'cell3d'){
    lab.state.mito = randInt(3,9); lab.state.lyso = randInt(2,7); lab.state.golgi = randInt(1,4);
  }
  if(lab.id === 'water'){
    lab.state.meltPoint = randInt(-6,3);
    lab.state.boilPoint = randInt(88,115);
  }
  if(lab.id === 'photosynthesis'){

function normalizeText(s, caseSensitive){
  let t = String(s).replace(/\s+/g,'').replace(/[×✕✖]/g,'x').replace(/-/g,'');
  return caseSensitive ? t : t.toUpperCase();
}
document.getElementById('cmCheck').addEventListener('click', () => {
  const raw = cmInput.value.trim();
  if(!raw){ cmFeedback.textContent = 'Enter an answer first.'; cmFeedback.className = 'cm-feedback incorrect'; return; }
  let correct;
  if(cmData.isText){
    const accepted = [].concat(cmData.answer).map(a => normalizeText(a, cmData.caseSensitive));
    correct = accepted.includes(normalizeText(raw, cmData.caseSensitive));
  } else {
    const val = parseFloat(raw.replace(',', '.'));
    correct = !isNaN(val) && Math.abs(val - cmData.answer) <= cmData.tolerance;
  }
  if(correct){
    cmFeedback.textContent = 'Correct! Well done.';
    cmFeedback.className = 'cm-feedback correct';
    if(window.SFX){ SFX.ok(); confetti(50); }
  } else {
    if(window.SFX) SFX.bad();
    cmFeedback.textContent = 'Not quite — use the simulation, then check again.';
    cmFeedback.className = 'cm-feedback incorrect';
  }
});

/* ---------- LAB: pH & BUFFERS (BIO41 1.2.5 – 1.2.7) ---------- */
const PH_STOPS = [[0,[232,33,44]],[2,[240,69,43]],[4,[247,148,29]],[5.5,[249,215,28]],[7,[60,180,75]],[8.5,[26,154,138]],[10,[45,106,201]],[12,[90,63,181]],[14,[107,42,154]]];
function phColor(p){
  p = Math.max(0, Math.min(14, p));
  for(let i = 1; i < PH_STOPS.length; i++){
    if(p <= PH_STOPS[i][0]){
      const [p0, c0] = PH_STOPS[i-1], [p1, c1] = PH_STOPS[i], t = (p - p0) / (p1 - p0);
      return c0.map((v, k) => Math.round(lerp(v, c1[k], t)));
    }
  }
  return PH_STOPS[PH_STOPS.length - 1][1];
}
function labPH(ctx, canvas, controls, lab){
  const S = lab.state, W = canvas.width, H = canvas.height;
  const view = {yaw:0.5, pitch:0.28, expand:0.5, hand:null, zoom:1};
  const PKA = 7.4, DROP = 0.002;
  let mode = 'Water', a = 0, raf, shownPH = 7;
  const half = () => S.cap / 2, aMax = () => half() * 0.996;
  const HH_LO = PKA + Math.log10(0.004/1.996), HH_HI = PKA - Math.log10(0.004/1.996);   // about 4.7 .. 10.1
  const phWater = x => { const h = (x + Math.sqrt(x*x + 4e-14)) / 2; return -Math.log10(h); };
  function phOf(x){
    if(mode === 'Water') return phWater(x);
    const am = aMax();
    if(Math.abs(x) < am) return PKA + Math.log10((half() - x) / (half() + x));
    const e = Math.abs(x) - am;
    return x > 0 ? -Math.log10(e + Math.pow(10, -HH_LO)) : 14 + Math.log10(e + Math.pow(10, HH_HI - 14));
  }
  function aOf(p){
    if(mode === 'Water') return Math.pow(10, -p) - Math.pow(10, p - 14);
    if(p >= HH_LO && p <= HH_HI){ const r = Math.pow(10, p - PKA); return half() * (1 - r) / (1 + r); }
    if(p < HH_LO) return aMax() + Math.max(0, Math.pow(10, -p) - Math.pow(10, -HH_LO));
    return -(aMax() + Math.max(0, Math.pow(10, p - 14) - Math.pow(10, HH_HI - 14)));
  }

  const slider = makeSlider(controls, {label:'pH', min:0, max:14, step:0.1, value:7, unit:'', onChange:v => { a = aOf(v); view.expand = v/14; refresh(false); }});
  makeToggle(controls, ['Water','Buffer'], opt => { mode = opt; a = 0; refresh(true); });
  const dr = document.createElement('div'); dr.style.cssText = 'display:flex; gap:6px;'; controls.appendChild(dr);
  const bA = makeButton(dr, '+ Acid drop', () => { a += DROP; refresh(true); }); bA.style.background = '#ef8a86'; bA.title = 'Add 1 drop of HCl (0.002 mol/L of strong acid)';
  const bB = makeButton(dr, '+ Base drop', () => { a -= DROP; refresh(true); }); bB.style.background = '#7fb6f0'; bB.title = 'Add 1 drop of NaOH (0.002 mol/L of strong base)';
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or pinch to change the pH · use the drop buttons to add acid or base · or use your hand with the camera.',
    'Show one hand. Open fingers wide = HIGHER pH (more basic) · fist = LOWER pH (more acidic) · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  const gcSlider = () => slider.parentNode.querySelector('.val');
  function refresh(setSlider){
    const p = phOf(a); shownPH = p;
    if(setSlider){ slider.value = Math.max(0, Math.min(14, p)).toFixed(1); const v = gcSlider(); if(v) v.textContent = slider.value; view.expand = p/14; }
    rPH.textContent = p.toFixed(2);
    rH.textContent = Math.pow(10, -p).toExponential(1);
    rOH.textContent = Math.pow(10, p - 14).toExponential(1);
    rType.textContent = p < 6.95 ? 'Acidic' : p > 7.05 ? 'Basic' : 'Neutral';
    rBuf.textContent = mode === 'Buffer' ? Math.min(100, Math.round(Math.abs(a) / half() * 100)) + ' %' : '—';
  }
  refresh(true);
  // particles
  const hp = [], op = [];
  const mk = () => ({p:[(Math.random()*2-1)*0.8, -1.2 + Math.random()*1.9, (Math.random()*2-1)*0.8], v:[rnd3()*0.012, rnd3()*0.012, rnd3()*0.012]});
  const step = o => {
    for(let k = 0; k < 3; k++){ o.p[k] += o.v[k]; o.v[k] += rnd3()*0.0035; o.v[k] = Math.max(-0.02, Math.min(0.02, o.v[k])); }
    const r = Math.hypot(o.p[0], o.p[2]); if(r > 0.88){ o.v[0] *= -1; o.v[2] *= -1; o.p[0] *= 0.97; o.p[2] *= 0.97; }
    if(o.p[1] > 0.75 || o.p[1] < -1.25){ o.v[1] *= -1; o.p[1] = Math.max(-1.25, Math.min(0.75, o.p[1])); }
  };
  const bm = Array.from({length:12}, () => mk());
  function loop(){
    if(!view.still) view.yaw += 0.003;
    const p = shownPH, a2 = Math.max(-1, Math.min(1, (7 - p) / 7));
    const nH = Math.max(0, Math.round(10 + 22 * a2)), nO = Math.max(0, Math.round(10 - 22 * a2));
    if(hp.length < nH) hp.push(mk()); else if(hp.length > nH) hp.pop();
    if(op.length < nO) op.push(mk()); else if(op.length > nO) op.pop();
    const col = phColor(p), rgba = al => 'rgba(' + col.join(',') + ',' + al + ')';
    sc.begin();
    // beaker
    const R = 1.0, yB = -1.4, yT = 1.15, yL = 0.85, N = 22;
    const ang = i => i / N * Math.PI * 2;
    for(let i = 0; i < N; i++){
      const a0 = ang(i), a1 = ang(i + 1);
      sc.poly([[R*Math.cos(a0), yB, R*Math.sin(a0)], [R*Math.cos(a1), yB, R*Math.sin(a1)], [R*Math.cos(a1), yL, R*Math.sin(a1)], [R*Math.cos(a0), yL, R*Math.sin(a0)]], {fill:rgba(0.2), stroke:'rgba(232,245,238,0.10)', close:true, w:1});
    }
    const disk = y => Array.from({length:N}, (_, i) => [R*Math.cos(ang(i)), y, R*Math.sin(ang(i))]);
    sc.poly(disk(yL), {fill:rgba(0.28), stroke:'rgba(232,245,238,0.45)', close:true, w:2});
    sc.poly(disk(yB), {fill:rgba(0.2), stroke:'rgba(232,245,238,0.25)', close:true, w:1.5});
    sc.poly(disk(yT), {stroke:'rgba(232,245,238,0.55)', close:true, w:2.5});
    [0, 1.6, 3.2, 4.8].forEach(t => sc.line([R*Math.cos(t), yB, R*Math.sin(t)], [R*Math.cos(t), yT, R*Math.sin(t)], 'rgba(232,245,238,0.28)', 1.5));
    // ions
    hp.forEach(o => { step(o); sc.sphere(o.p, 0.085, '#ffb3ad', '#d8453f'); });
    op.forEach(o => { step(o); sc.sphere(o.p, 0.085, '#b6dcff', '#2f78c4'); });
    if(mode === 'Buffer'){
      const fA = 1 / (1 + Math.pow(10, PKA - p)), nA = Math.round(12 * fA);
      bm.forEach((o, i) => { step(o); const isA = i < nA; sc.sphere(o.p, 0.13, isA ? '#d9ccff' : '#ffe9a6', isA ? '#7a62d6' : '#d29a14'); });
    }
    // probe
    sc.line([0.45, 2.1, 0.1], [0.3, -0.7, 0.05], 'rgba(200,210,205,0.9)', 5);
    sc.sphere([0.3, -0.7, 0.05], 0.07, '#e8f5ee', '#8aa0a8');
    sc.text([0.45, 2.35, 0.1], 'pH ' + p.toFixed(1), '#' + col.map(v => Math.min(255, v + 60).toString(16).padStart(2, '0')).join(''), 18);
    sc.text([-1.25, -1.0, 0], mode === 'Buffer' ? 'BUFFER' : 'WATER', '#85a396', 11);
    sc.caption(mode === 'Buffer' ? 'Coral = H⁺ · blue = OH⁻ · gold = weak acid HA · violet = its base A⁻ · counts exaggerated, each pH step is 10×' : 'Coral = H⁺ · blue = OH⁻ · particle counts are exaggerated, each pH step is really a 10× change');
    sc.end();
    // pH colour strip (in the Measurements panel)
    { const sw = strip.width - 40, sx = 20, sy = 26, g = sx2.createLinearGradient(sx, 0, sx + sw, 0);
      sx2.clearRect(0, 0, strip.width, strip.height);
      PH_STOPS.forEach(([pp, c]) => g.addColorStop(pp / 14, 'rgb(' + c.join(',') + ')'));
      sx2.fillStyle = g; sx2.fillRect(sx, sy, sw, 14); sx2.strokeStyle = 'rgba(232,245,238,.5)'; sx2.strokeRect(sx, sy, sw, 14);
      const mx = sx + Math.max(0, Math.min(14, p)) / 14 * sw;
      sx2.fillStyle = '#fff'; sx2.beginPath(); sx2.moveTo(mx, sy); sx2.lineTo(mx - 7, sy - 12); sx2.lineTo(mx + 7, sy - 12); sx2.fill();
      sx2.font = '12px "IBM Plex Mono", monospace'; sx2.fillStyle = 'rgba(232,245,238,.75)'; sx2.textAlign = 'center';
      [0, 7, 14].forEach(t => sx2.fillText(String(t), sx + t / 14 * sw, sy + 32)); sx2.fillText('acid', sx + sw * 0.17, sy + 32); sx2.fillText('base', sx + sw * 0.83, sy + 32); sx2.textAlign = 'left'; }
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* ---------- LAB: CELL SIZE & SURFACE AREA : VOLUME (BIO41 3.1.1 – 3.1.2) ---------- */
function labCellSize(ctx, canvas, controls, lab){
  const S = lab.state;
  const view = {yaw:0.6, pitch:0.32, expand:0.27, hand:null, zoom:1};
  let side = 4, split = false, raf;
  const rSide = makeReadout(controls, 'Side length', '4 µm');
  const rSA = makeReadout(controls, 'Surface area', '96 µm²');
  const rV = makeReadout(controls, 'Volume', '64 µm³');
  const rR = makeReadout(controls, 'SA : V ratio', '1.50 : 1');
  const rReach = makeReadout(controls, 'Reached by diffusion', '—');
  const slider = makeSlider(controls, {label:'Cell side length', min:1, max:12, step:1, value:4, unit:' µm', onChange:v => { side = v; view.expand = (v - 1) / 11; refresh(); }});
  makeToggle(controls, ['1 cell','Divide into 8'], (o, i) => { split = i === 1; refresh(); });
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or pinch to grow the cell · press "Divide into 8" to cut it into 8 small cells · or use your hand with the camera.',
    'Show one hand. Open fingers wide = BIGGER cell · fist = smaller cell · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  function refresh(){
    const s = side, n = split ? 8 : 1, cs = split ? s / 2 : s;
    const SA = n * 6 * cs * cs, V = n * cs * cs * cs, d = S.depth;
    const reach = cs <= 2 * d ? 100 : (1 - Math.pow((cs - 2 * d) / cs, 3)) * 100;
    rSide.textContent = split ? s + ' µm → 8 cells of ' + cs + ' µm' : s + ' µm';
    rSA.textContent = SA + ' µm²'; rV.textContent = V + ' µm³';
    rR.textContent = (SA / V).toFixed(2) + ' : 1';
    rReach.textContent = Math.round(reach) + ' %';
  }
  refresh();
  const U = 0.25;   // world units per µm
  const dye = Array.from({length:42}, () => ({t:Math.random(), f:Math.floor(Math.random()*6), u:Math.random()*2-1, v:Math.random()*2-1, c:Math.floor(Math.random()*8)}));
  function loop(){
    if(!view.still) view.yaw += 0.003;
    const cs = split ? side / 2 : side, w = cs * U, d = lab.state.depth * U;
    const cubes = [];
    if(split){ const o = w / 2 + 0.12; for(let i = 0; i < 8; i++) cubes.push([(i & 1 ? o : -o), (i & 2 ? o : -o), (i & 4 ? o : -o)]); } else cubes.push([0, 0, 0]);
    sc.begin();
    cubes.forEach(c => {
      sc.box(c, w, w, w, 'rgba(94,184,255,0.10)', 'rgba(94,184,255,0.85)');
      const inner = w - 2 * d;
      if(inner > 0.02) sc.box(c, inner, inner, inner, 'rgba(239,100,97,0.55)', 'rgba(239,100,97,0.9)');
    });
    // nutrient particles diffusing in through the surface (stop at the diffusion depth)
    dye.forEach(p => {
      p.t += 0.006; if(p.t > 1) p.t -= 1;
      const c = cubes[p.c % cubes.length], h = w / 2, inn = p.t * d, ax = p.f >> 1, sg = (p.f & 1) ? 1 : -1;
      const pos = [0, 0, 0], other = [0, 1, 2].filter(k => k !== ax);
      pos[ax] = sg * (h - inn); pos[other[0]] = p.u * (h - 0.01); pos[other[1]] = p.v * (h - 0.01);
      sc.sphere([c[0] + pos[0], c[1] + pos[1], c[2] + pos[2]], 0.035, '#ffeab0', '#f0b94a');
    });
    const top = cubes.length > 1 ? w + 0.28 : w / 2 + 0.2;
    sc.text([0, top + 0.25, 0], split ? '8 cells · each ' + cs + ' µm' : side + ' µm', '#e8f5ee', 14);
    sc.caption('Blue = cell surface · red core = beyond reach of diffusion · gold = nutrients entering');
    sc.end();
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* ---------- LAB: MITOSIS & THE CELL CYCLE (BIO41 3.1.4 – 3.1.8) ---------- */
const MIT_PHASES = [[0,0.07,'Interphase (G1)'],[0.07,0.14,'Interphase (S: DNA copied)'],[0.14,0.2,'Interphase (G2)'],[0.2,0.35,'Prophase'],[0.35,0.5,'Metaphase'],[0.5,0.65,'Anaphase'],[0.65,0.8,'Telophase'],[0.8,1.0001,'Cytokinesis']];
function mitPhase(s){ return (MIT_PHASES.find(p => s >= p[0] && s < p[1]) || MIT_PHASES[7])[2]; }
function labMitosis(ctx, canvas, controls, lab){
  const view = {yaw:0.45, pitch:0.22, expand:0, hand:null, zoom:1};
  let s = 0, plant = false, playing = false, raf;
  const rPh = makeReadout(controls, 'Phase', 'Interphase (G1)');
  const rCh = makeReadout(controls, 'Chromosomes', '4');
  const rCd = makeReadout(controls, 'Chromatids', '4');
  const slider = makeSlider(controls, {label:'Cell cycle stage', min:0, max:100, step:1, value:0, unit:' %', onChange:v => { s = v / 100; view.expand = s; refresh(); }});
  makeToggle(controls, ['Animal cell','Plant cell'], (o, i) => { plant = i === 1; });
  const playBtn = makeButton(controls, '▶ Play the cell cycle', () => { playing = !playing; playBtn.textContent = playing ? '⏸ Pause' : '▶ Play the cell cycle'; if(playing && s >= 0.999){ s = 0; setSlider(0); } });
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or pinch to move through the cell cycle · or press Play · or use your hand with the camera.',
    'Show one hand. Open fingers wide = move FORWARD through the cell cycle · fist = go back to interphase · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  const vl = slider.parentNode.querySelector('.val');
  function setSlider(v){ slider.value = Math.round(v * 100); if(vl) vl.textContent = slider.value + ' %'; view.expand = v; }
  function refresh(){
    rPh.textContent = mitPhase(s);
    const post = s >= 0.5;
    rCh.textContent = post ? (s >= 0.8 ? '4 in each daughter cell' : '8 (4 + 4)') : '4';
    const dbl = s >= 0.07 && s < 0.5;
    rCd.textContent = post ? (s >= 0.8 ? '4 in each daughter cell' : '8 (one each)') : dbl ? '8 (two per chromosome)' : '4 (one per chromosome)';
  }
  refresh();
  // 4 chromosomes: two homologous pairs (teal / amber)
  const CH = [
    {col:['#8fe3c6','#1f9c7a'], P:[-0.2, 0.25, 0.1], Q:[0, 0.5, 0.15], dir:[0.5, 0.8, 0.3]},
    {col:['#8fe3c6','#1f9c7a'], P:[0.15, -0.2, 0.3], Q:[0, -0.35, 0.4], dir:[0.2, 0.6, 0.77]},
    {col:['#ffd98a','#c98a1c'], P:[0.1, 0.1, -0.3], Q:[0, 0.2, -0.45], dir:[0.7, 0.2, 0.6]},
    {col:['#ffd98a','#c98a1c'], P:[-0.2, -0.15, -0.15], Q:[0, -0.5, -0.1], dir:[0.3, 0.9, 0.2]},
  ];
  const norm = v => { const m = Math.hypot(v[0], v[1], v[2]); return v.map(x => x / m); };
  CH.forEach(c => { c.dir = norm(c.dir); c.seed = Math.random() * 6; });
  function loop(){
    if(playing){ s = Math.min(1, s + 0.0016); setSlider(s); refresh(); if(s >= 1){ playing = false; playBtn.textContent = '▶ Play the cell cycle'; } }
    if(!view.still) view.yaw += 0.002;
    const t = performance.now() * 0.002;
    const cond = s < 0.2 ? ramp(s, 0.14, 0.2) * 0.15 : s < 0.35 ? lerp(0.15, 1, ramp(s, 0.2, 0.35)) : s < 0.65 ? 1 : 1 - ramp(s, 0.65, 0.8);
    const plate = ramp(s, 0.28, 0.45) * (1 - ramp(s, 0.5, 0.52));          // how far chromosomes are towards the metaphase plate
    const ana = ramp(s, 0.5, 0.65), tel = ramp(s, 0.65, 0.8), fur = ramp(s, 0.78, 1);
    const second = ramp(s, 0.07, 0.14);                                      // sister chromatid appears during S phase
    const shift = fur * 0.6;                                                // daughter cells drift apart
    sc.begin();
    // cell outline
    if(!plant && s >= 0.78){
      const sp = lerp(0.6, 1.2, fur);
      [-1, 1].forEach(sg => { sc.glass([sg * sp, 0, 0], 1.0, 'rgba(94,184,255,0.06)', 'rgba(94,184,255,0.6)'); sc.wire([sg * sp, 0, 0], 1.0, 1.0, 1.0, 'rgba(94,184,255,0.18)', 3); });
    } else {
      sc.wire([0, 0, 0], 1.6, 1.15, 1.15, 'rgba(94,184,255,0.28)', 5);
      if(plant){
        const r = ramp(s, 0.8, 1) * 1.15;
        if(r > 0.02){ const pts = Array.from({length:26}, (_, i) => [0, r * Math.cos(i / 26 * 6.2832), r * Math.sin(i / 26 * 6.2832)]); sc.poly(pts, {fill:'rgba(176,132,70,0.45)', stroke:'#c9a063', close:true, w:2}); }
        if(s >= 1) sc.text([0, 1.45, 0], 'cell plate → new cell wall', '#c9a063', 11);
      }
    }
    // nuclear envelope(s)
    const env1 = (1 - ramp(s, 0.2, 0.34)) * (s < 0.5 ? 1 : 0);
    if(env1 > 0.02) sc.wire([0, 0, 0], 0.62, 0.62, 0.62, 'rgba(201,168,255,' + (0.55 * env1).toFixed(2) + ')', 4);
    if(tel > 0.02) [-1, 1].forEach(sg => sc.wire([sg * (0.85 + shift), 0, 0], 0.5, 0.5, 0.5, 'rgba(201,168,255,' + (0.6 * tel).toFixed(2) + ')', 4));
    // centrioles + spindle
    const cp = lerp(0.3, 1.38, ramp(s, 0.2, 0.35)) + (s > 0.78 ? shift : 0);
    const cen = s >= 0.07 ? 2 : 1;
    [-1, 1].forEach(sg => { sc.sphere([sg * cp, 0, 0], 0.07, '#ffffff', '#8aa0a8'); if(cen > 1) sc.sphere([sg * cp, 0.07, 0.02], 0.05, '#ffffff', '#8aa0a8'); });
    const spin = ramp(s, 0.3, 0.38) * (1 - ramp(s, 0.66, 0.78));
    // chromosomes
    CH.forEach(c => {
      const base = c.P.map((v, k) => lerp(v, c.Q[k], plate));
      const fade = 1 - tel * 0.5;
      [-1, 1].forEach(sgn => {
        // sister chromatids separate along x in anaphase
        if(sgn === 1 && second < 0.02) return;
        const sister = sgn === 1;
        const off = (sister ? 1 : 0) * 0.05 * second * (1 - ana);
        const poleX = ana * (sister ? 0.95 : -0.95) + (ana > 0 ? (sister ? shift : -shift) : 0);
        const cx = base[0] + poleX, cy = base[1] * (1 - tel * 0.35) + off, cz = base[2];
        const len = lerp(0.9, 0.5, cond), amp = (1 - cond) * 0.07;
        const pts = [], n = 9, dirv = ana > 0 ? [0.25 * (sister ? 1 : -1), 1, 0.2] : c.dir, dn = norm(dirv);
        for(let k = 0; k <= n; k++){
          const u = k / n - 0.5;
          pts.push([cx + dn[0] * u * len + Math.sin(t + c.seed + k) * amp, cy + dn[1] * u * len + Math.cos(t * 1.2 + c.seed + k * 1.3) * amp, cz + dn[2] * u * len + Math.sin(t * 0.8 + k) * amp]);
        }
        sc.poly(pts, {stroke: c.col[sister ? 0 : 1], w: lerp(1.6, 8, cond) * fade});
        if(cond > 0.5) sc.sphere([cx, cy, cz], 0.06, '#ffffff', '#cfd8d4');
        // spindle fibre from the pole to the centromere
        if(spin > 0.05) sc.line([(sister ? 1 : -1) * cp, 0, 0], [cx, cy, cz], 'rgba(232,245,238,' + (0.35 * spin).toFixed(2) + ')', 1);
      });
    });
    // phase label + progress dots
    sc.text([0, -1.65, 0], mitPhase(s).replace(' (S: DNA copied)', ' · S').toUpperCase(), '#f0b94a', 14);
    sc.caption(plant ? 'Plant cell: a cell plate forms across the middle (no cleavage furrow)' : 'Animal cell: the membrane pinches in (cleavage furrow) · white = centrioles');
    sc.end();
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* =============== LAB: THE NEPHRON (BIO41 7.3.2 – 7.3.7) =============== */
const NEPH_SEGS = [[0, 0.12, 'Glomerulus & Bowman’s capsule', 'Ultrafiltration'], [0.12, 0.40, 'Proximal convoluted tubule', 'Selective reabsorption'], [0.40, 0.60, 'Loop of Henle (descending)', 'Water reabsorption'], [0.60, 0.75, 'Loop of Henle (ascending)', 'Salt reabsorption'], [0.75, 0.88, 'Distal convoluted tubule', 'Fine adjustment'], [0.88, 1.0001, 'Collecting duct', 'Water reabsorbed (ADH) → urine']];
const NEPH_END = {Hydrated:[14, 6], Normal:[8, 2], Dehydrated:[6, 1]};
function nephSeg(p){ return NEPH_SEGS.find(s => p > s[0] && p <= s[1]) || NEPH_SEGS[0]; }
function nephWater(hyd, p){
  const e = NEPH_END[hyd] || NEPH_END.Normal;
  const K = [[0, 0], [0.12, 100], [0.40, 35], [0.60, 20], [0.75, 20], [0.88, e[0]], [1, e[1]]];
  for(let i = 1; i < K.length; i++) if(p <= K[i][0]) return lerp(K[i-1][1], K[i][1], (p - K[i-1][0]) / (K[i][0] - K[i-1][0]));
  return K[K.length - 1][1];
}
function nephState(cond, hyd, thr, p){
  const water = nephWater(hyd, p);
  const load = cond === 'Diabetes' ? 200 : 100, left = cond === 'Diabetes' ? load - thr : 0;
  const glu = p < 0.12 ? load * ramp(p, 0, 0.12) : load - (load - left) * ramp(p, 0.12, 0.40);
  const ureaAmt = p < 0.12 ? 100 * ramp(p, 0, 0.12) : 100 - 50 * ramp(p, 0.12, 1);
  const urea = p < 0.03 ? 0 : ureaAmt / Math.max(water, 0.5);
  return {water, glu, ureaAmt, urea, prot: cond === 'Nephritis'};
}
function labNephron(ctx, canvas, controls, lab){
  const S = lab.state;
  const view = {yaw:0.25, pitch:0.15, expand:0.5, hand:null, zoom:0.95};
  let cond = 'Healthy', hyd = 'Normal', pos = 0.5, play = false, raf;
  const rSeg = makeReadout(controls, 'Part of nephron', 'Proximal convoluted tubule');
  const rProc = makeReadout(controls, 'Process here', 'Selective reabsorption');
  const rW = makeReadout(controls, 'Water left (% of filtrate)', '100');
  const rG = makeReadout(controls, 'Glucose in tubule (units)', '0');
  const rU = makeReadout(controls, 'Urea concentration (× filtrate)', '1.0');
  const rP = makeReadout(controls, 'Protein / blood cells', 'None');
  const slider = makeSlider(controls, {label:'Position along nephron', min:0, max:100, step:1, value:50, unit:' %', onChange:v => { pos = v / 100; view.expand = pos; refresh(); }});
  makeToggle(controls, ['Healthy','Diabetes','Nephritis'], o => { cond = o; refresh(); });
  makeToggle(controls, ['Hydrated','Normal','Dehydrated'], o => { hyd = o; refresh(); }).querySelectorAll('button').forEach((b, i) => { b.classList.toggle('on', i === 1); });
  const bPlay = makeButton(controls, '▶ Follow a drop of filtrate', () => { play = !play; if(play && pos >= 0.99) setPos(0); bPlay.textContent = play ? '⏸ Pause' : '▶ Follow a drop of filtrate'; });
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or pinch to move along the nephron · or press Follow to ride a drop of filtrate · or use your hand with the camera.',
    'Show one hand. Open fingers wide = further along the nephron · fist = back to the glomerulus · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  function setPos(p){ pos = p; view.expand = p; slider.value = String(Math.round(p * 100)); const v = slider.parentNode.querySelector('.val'); if(v) v.textContent = Math.round(p * 100) + ' %'; refresh(); }
  function refresh(){
    const st = nephState(cond, hyd, S.thr, pos), sg = nephSeg(pos);
    rSeg.textContent = sg[2]; rProc.textContent = sg[3];
    rW.textContent = Math.round(st.water);
    rG.textContent = Math.round(st.glu);
    rU.textContent = pos < 0.12 ? '1.0' : st.urea.toFixed(1);
    rP.textContent = st.prot ? (pos < 0.03 ? 'None yet' : 'PRESENT (leaks through)') : 'None (too big to filter)';
  }
  refresh();
  /* path of the nephron in 3D */
  const zig = (x0, x1, y, n, a, z) => Array.from({length:n + 1}, (_, i) => [lerp(x0, x1, i / n), y + (i % 2 ? a : -a), i % 2 ? z : -z]);
  const PATH = [
    [[-2.1, 0.95, 0], [-1.75, 0.95, 0], [-1.55, 0.9, 0]],
    zig(-1.55, -0.55, 0.9, 10, 0.2, 0.22),
    [[-0.55, 0.9, 0], [-0.2, 0.9, 0], [-0.2, 0.3, 0], [-0.2, -1.2, 0]],
    [[-0.2, -1.2, 0], [0.1, -1.55, 0], [0.4, -1.2, 0], [0.5, -0.5, 0], [0.5, 0.2, 0]],
    [[0.5, 0.2, 0], [0.5, 0.7, 0], [0.75, 0.9, 0]],
    [[0.75, 0.9, 0], ...zig(0.75, 1.5, 0.75, 8, 0.15, 0.2).slice(1), [1.75, 0.7, 0], [1.75, -0.2, 0], [1.75, -1.7, 0]]
  ];
  const BOUNDS = [0, 0.12, 0.40, 0.60, 0.75, 0.88, 1];
  const SEGCOL = ['#ff7b7b', '#2bd6a8', '#5eb8ff', '#8f8cff', '#f0b94a', '#c58cff'];
  const lens = PATH.map(pl => { let L = 0; for(let i = 1; i < pl.length; i++) L += Math.hypot(pl[i][0] - pl[i-1][0], pl[i][1] - pl[i-1][1], pl[i][2] - pl[i-1][2]); return L; });
  function along(pl, L, u){
    let d = u * L;
    for(let i = 1; i < pl.length; i++){
      const a = pl[i-1], b = pl[i], l = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
      if(d <= l || i === pl.length - 1) { const t = l ? Math.min(1, d / l) : 0; return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
      d -= l;
    }
    return pl[pl.length - 1];
  }
  function pathAt(p){
    let k = BOUNDS.findIndex((b, i) => p >= b && p < BOUNDS[i + 1]); if(k < 0) k = 5;
    return along(PATH[k], lens[k], (p - BOUNDS[k]) / (BOUNDS[k + 1] - BOUNDS[k]));
  }
  const KINDS = [['water', '#7fc4ff'], ['glucose', '#ffd24a'], ['urea', '#8bd36b'], ['protein', '#c58cff'], ['cell', '#ff5a5a']];
  const parts = Array.from({length:120}, (_, i) => ({u:Math.random(), k:i % 5 < 2 ? 0 : (i % 5), r:Math.random(), j:[Math.random() - 0.5, Math.random() - 0.5]}));
  function loop(){
    if(!view.still) view.yaw += 0.002;
    if(play){ pos += 0.0022; if(pos >= 1){ pos = 1; play = false; bPlay.textContent = '▶ Follow a drop of filtrate'; } setPos(pos); }
    sc.begin();
    PATH.forEach((pl, k) => {
      for(let i = 1; i < pl.length; i++){ sc.line(pl[i-1], pl[i], SEGCOL[k] + '55', 12); sc.line(pl[i-1], pl[i], SEGCOL[k], 2.2); }
    });
    /* capillary network (blood) */
    const cap = [[-2.6, 1.6, -0.1], [-2.1, 1.35, 0], [-1.6, 1.3, -0.5], [-0.6, 1.35, -0.5], [0.3, 1.4, -0.5], [0.6, 1.25, -0.5], [1.5, 1.25, -0.5], [2.1, 1.2, -0.5]];
    for(let i = 1; i < cap.length; i++) sc.line(cap[i-1], cap[i], 'rgba(255,90,90,0.55)', 3, [6, 5]);
    sc.glass([-2.1, 0.95, 0], 0.5, 'rgba(255,123,123,0.10)', 'rgba(255,123,123,0.85)');
    for(let i = 0; i < 7; i++){ const a = i * 0.9 + performance.now() / 4000; sc.sphere([-2.1 + Math.cos(a) * 0.22, 0.95 + Math.sin(a * 1.3) * 0.2, Math.sin(a) * 0.2], 0.07, '#ff6b6b', '#b02e2e'); }
    sc.text([-2.1, 0.25, 0], 'Glomerulus + Bowman’s capsule', '#ff9b9b', 11);
    sc.text([-1.05, 0.5, 0], 'PCT', SEGCOL[1], 12);
    sc.text([0.15, -1.95, 0], 'Loop of Henle', SEGCOL[2], 12);
    sc.text([1.1, 1.35, 0], 'DCT', SEGCOL[4], 12);
    sc.text([1.75, -2.0, 0], 'Collecting duct', SEGCOL[5], 11);
    sc.text([-2.75, 1.5, -0.1], 'blood in', '#ff8c8c', 10);
    /* filtrate particles drift along the tubule; their number follows the model */
    const st = n => nephState(cond, hyd, S.thr, n);
    parts.forEach(p => {
      p.u += 0.0016; if(p.u > 1) p.u = 0.02;
      const s = st(p.u); let vis;
      if(p.k === 0) vis = p.r < s.water / 100;
      else if(p.k === 1) vis = p.r < s.glu / 200;
      else if(p.k === 2) vis = p.r < s.ureaAmt / 100 * 0.9;
      else vis = s.prot && p.u > 0.04;
      if(!vis) return;
      const q = pathAt(p.u);
      sc.sphere([q[0] + p.j[0] * 0.07, q[1] + p.j[1] * 0.07, q[2] + p.j[0] * 0.05], p.k >= 3 ? 0.06 : 0.04, KINDS[p.k][1], KINDS[p.k][1]);
    });
    const m = pathAt(pos);
    sc.sphere(m, 0.1, '#ffffff', '#2bd6a8');
    sc.text([m[0], m[1] + 0.3, m[2]], Math.round(pos * 100) + ' %', '#ffffff', 12);
    sc.caption('Blue = water · gold = glucose · green = urea · purple = protein · red = blood cells', null, canvas.height - 120);
    sc.end();
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* =============== LAB: DIHYBRID CROSS (BIO61 2.1.6) =============== */
const DH_PH = ['Round yellow', 'Round green', 'Wrinkled yellow', 'Wrinkled green'];
const DH_COL = ['#f6d34a', '#7fcf5a', '#e0b23a', '#5f9a3e'];
function dhGametes(g){ return [g[0] + g[2], g[0] + g[3], g[1] + g[2], g[1] + g[3]]; }
function dhPair(a, b){ return [a, b].sort((x, y) => (x === x.toUpperCase() ? 0 : 1) - (y === y.toUpperCase() ? 0 : 1)).join(''); }
function dhChild(a, b){ return dhPair(a[0], b[0]) + dhPair(a[1], b[1]); }
function dhPheno(c){ const round = /R/.test(c.slice(0, 2)), yel = /Y/.test(c.slice(2)); return round ? (yel ? 0 : 1) : (yel ? 2 : 3); }
function dhExact(p1, p2){
  const c = [0, 0, 0, 0]; dhGametes(p1).forEach(a => dhGametes(p2).forEach(b => c[dhPheno(dhChild(a, b))]++)); return c;
}
function labDihybrid(ctx, canvas, controls, lab){
  const S = lab.state;
  const view = {yaw:0.3, pitch:0.45, expand:0, hand:null, zoom:1.2};
  let mode = 0, n = 16, counts = [0, 0, 0, 0], raf;
  const P = () => mode === 0 ? ['RrYy', 'RrYy'] : mode === 1 ? ['RrYy', 'rryy'] : [S.unk, 'rryy'];
  const rPar = makeReadout(controls, 'Parents', 'RrYy × RrYy');
  const rGam = makeReadout(controls, 'Gamete types (parent 1)', '4');
  const rC = DH_PH.map(t => makeReadout(controls, t, '0'));
  const rRat = makeReadout(controls, 'Ratio (÷ smallest)', '9 : 3 : 3 : 1');
  const slider = makeSlider(controls, {label:'Offspring sample', min:16, max:320, step:16, value:16, unit:'', onChange:v => { n = v; view.expand = (v - 16) / 304; refresh(true); }});
  makeToggle(controls, ['Dihybrid F1','Test cross','Unknown parent'], (o, i) => { mode = i; refresh(true); });
  makeButton(controls, 'Resample', () => refresh(true));
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or pinch to change the sample size · press Resample to draw new offspring · or use your hand with the camera.',
    'Show one hand. Open fingers wide = BIGGER sample · fist = 16 (the exact Punnett square) · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  function refresh(draw){
    const [p1, p2] = P(), ex = dhExact(p1, p2);
    if(draw){
      if(n === 16) counts = ex.slice();
      else { counts = [0, 0, 0, 0]; const bag = []; ex.forEach((c, k) => { for(let i = 0; i < c; i++) bag.push(k); }); for(let i = 0; i < n; i++) counts[bag[Math.floor(Math.random() * 16)]]++; }
    }
    rPar.textContent = (mode === 2 ? '??? ' : p1) + ' × ' + p2;
    rGam.textContent = new Set(dhGametes(p1)).size;
    counts.forEach((c, k) => rC[k].textContent = c);
    const nz = counts.filter(c => c > 0), mn = nz.length ? Math.min(...nz) : 1;
    rRat.textContent = counts.map(c => { const r = c / mn; return Math.abs(r - Math.round(r)) < 0.05 ? Math.round(r) : r.toFixed(1); }).join(' : ');
  }
  refresh(true);
  function loop(){
    if(!view.still) view.yaw += 0.0025;
    const [p1, p2] = P(), g1 = dhGametes(p1), g2 = dhGametes(p2), ex = dhExact(p1, p2);
    sc.begin();
    const cs = 0.42, gx = -1.15;
    for(let i = 0; i < 4; i++) for(let j = 0; j < 4; j++){
      const x = (j - 1.5) * cs + gx, z = (i - 1.5) * cs, ph = dhPheno(dhChild(g1[j], g2[i]));
      sc.box([x, -0.04, z], cs * 0.94, 0.08, cs * 0.94, 'rgba(255,255,255,0.05)', 'rgba(232,245,238,0.35)');
      const round = ph < 2, r = round ? 0.13 : 0.085;
      sc.sphere([x, 0.12, z], r, DH_COL[ph], '#3a3a1a');
      if(!round) sc.sphere([x + 0.04, 0.15, z - 0.03], 0.05, DH_COL[ph], '#3a3a1a');
    }
    g1.forEach((g, j) => sc.text([(j - 1.5) * cs + gx, 0, -1.2], g, '#9fe8c6', 12));
    g2.forEach((g, i) => sc.text([gx - 1.2, 0, (i - 1.5) * cs], g, '#ffd98a', 12));
    sc.text([gx, 0, -1.55], 'gametes of parent 1', '#9fe8c6', 10);
    sc.text([gx - 1.2, 0, -1.2], 'parent 2', '#ffd98a', 10);
    /* bar chart of the sample */
    const tot = Math.max(1, counts.reduce((a, b) => a + b, 0));
    DH_PH.forEach((nm, k) => {
      const x = 0.55 + k * 0.42, h = Math.max(0.02, counts[k] / tot * 2.0), eh = ex[k] / 16 * 2.0;
      sc.box([x, h / 2, 0], 0.28, h, 0.28, DH_COL[k] + 'cc', DH_COL[k]);
      sc.line([x - 0.2, eh, 0], [x + 0.2, eh, 0], '#ffffff', 2, [4, 3]);
      sc.text([x, h + 0.2, 0], String(counts[k]), '#ffffff', 12);
      sc.text([x, -0.25, 0], ['Rd Yl', 'Rd Gr', 'Wr Yl', 'Wr Gr'][k], '#e8f5ee', 10);
    });
    sc.text([1.15, 2.45, 0], 'offspring sample (dashes = expected)', '#e8f5ee', 10);
    sc.caption('Round = sphere · wrinkled = lumpy · yellow / green seeds · white dashes = expected from the Punnett square');
    sc.end();
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* =============== LAB: CHEMIOSMOSIS & ATP SYNTHASE (BIO61 1.1.4, 1.2.7, 1.3.6) =============== */
function chemState(loc, cond, flow, eta){

  const G = cond === 'Uncoupler' ? 0.15 * F : F;
  const atp = Math.round(eta * G);
  return {F, G, atp, heat: Math.round(F - atp), o2: F};
}
function labChemi(ctx, canvas, controls, lab){

  let loc = 'Mitochondrion', cond = 'Normal', flow = 60, G = 0, raf, rot = 0;
  const rWhere = makeReadout(controls, 'Membrane', 'Mitochondrion');
  const rLoc = makeReadout(controls, 'Compartments', 'Intermembrane space (top) · Matrix (bottom)');

  const rH = makeReadout(controls, 'Heat released (units)', '0');
  const slider = makeSlider(controls, {label:'Electron flow', min:0, max:100, step:5, value:60, unit:'', onChange:v => { flow = v; view.expand = v / 100; refresh(); }});
  makeToggle(controls, ['Mitochondrion','Chloroplast'], o => { loc = o; refresh(); });
  makeToggle(controls, ['Normal','Block flow','Uncoupler'], o => { cond = o; refresh(); });
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or pinch to change the electron flow · try Block flow and Uncoupler · or use your hand with the camera.',
    'Show one hand. Open fingers wide = MORE electron flow · fist = less · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  function refresh(){
    const st = chemState(loc, cond, flow, S.eta);
    rWhere.textContent = loc === 'Mitochondrion' ? 'Inner mitochondrial' : 'Thylakoid';
    rLoc.textContent = loc === 'Mitochondrion' ? 'Intermembrane space (top) · Matrix (bottom)' : 'Thylakoid lumen (top) · Stroma (bottom)';
    rG.textContent = Math.round(st.G); rATP.textContent = st.atp;
    rO.textContent = loc === 'Mitochondrion' ? Math.round(st.o2) : 'n/a (light drives it)';
    rH.textContent = st.heat;
  }
  refresh();
  const hp = Array.from({length:60}, () => ({x:Math.random() * 4.0 - 2.0, z:Math.random() * 1.3 - 0.65, y:Math.random(), s:0.2 + Math.random() * 0.8}));
  const atps = [];
  function loop(){
    if(!view.still) view.yaw += 0.002;
    const st = chemState(loc, cond, flow, S.eta);
    G += (st.G - G) * 0.04; rot += st.atp * 0.0016;
    const frac = G / 100;
    sc.begin();
    /* membrane */
    sc.box([0, 0, 0], 4.6, 0.22, 1.6, 'rgba(240,185,74,0.28)', 'rgba(240,185,74,0.8)');
    /* three electron transport complexes + mobile carriers */
    [-1.8, -0.9, 0.0].forEach((x, i) => {
      sc.box([x, 0, 0.1], 0.5, 0.5, 0.7, 'rgba(94,184,255,0.45)', '#5eb8ff');
      sc.text([x, -0.42, 0.1], ['I', 'III', 'IV'][i], '#e8f5ee', 12);
      if(flow > 0 && cond !== 'Block flow'){ const t = (performance.now() / 600 + i) % 1; sc.sphere([x + 0.05, -0.35 + t * 0.7, 0.1], 0.06, '#8fe3c6', '#2bd6a8'); }
    });
    sc.line([-1.8, 0.4, 0.1], [0.0, 0.4, 0.1], 'rgba(143,227,198,0.5)', 1.5, [4, 4]);
    sc.text([-0.9, -1.0, 0.1], loc === 'Mitochondrion' ? 'electron transport chain' : 'photosystems + electron carriers', '#8fe3c6', 11);
    /* ATP synthase on the right */
    const sx = 1.7;
    sc.line([sx, -0.1, 0], [sx, -0.55, 0], '#ffd98a', 6);
    sc.sphere([sx, -0.75, 0], 0.26, '#ffb347', '#a8671a');
    sc.line([sx, -0.1, 0], [sx, 0.15, 0], '#ffd98a', 10);
    const ang = rot;
    sc.line([sx - Math.cos(ang) * 0.24, -0.75, -Math.sin(ang) * 0.24], [sx + Math.cos(ang) * 0.24, -0.75, Math.sin(ang) * 0.24], '#fff3d0', 3);
    sc.text([sx, -1.4, 0], 'ATP synthase', '#ffd98a', 11);
    /* H+ ions: crowd on top scales with the gradient */
    hp.forEach(p => {
      const topShow = p.s < 0.15 + frac * 0.85;
      if(topShow) sc.sphere([p.x, 0.25 + p.y * 1.25, p.z], 0.045, '#ff7b6b', '#b02e2e');
      if(p.s < 0.9 - frac * 0.55) sc.sphere([p.x, -0.3 - p.y * 1.0, p.z], 0.045, '#ff7b6b', '#b02e2e');
    });
    /* protons passing through the synthase, and ATP released below */
    if(st.atp > 0 && Math.random() < st.atp / 220){ atps.push({x:sx + (Math.random() - 0.5) * 0.15, y:-1.0, z:0, v:0}); }
    for(let i = atps.length - 1; i >= 0; i--){ const a = atps[i]; a.y -= 0.012; a.x += 0.004; a.v++; if(a.v > 50) { atps.splice(i, 1); continue; } sc.sphere([a.x, a.y, a.z], 0.07, '#ffe27a', '#e0a21a'); }
    if(st.G > 5) sc.sphere([sx, 0.5 + ((performance.now() / 500) % 1) * -0.55, 0], 0.05, '#ff7b6b', '#b02e2e');
    sc.text([-2.2, 1.6, 0], loc === 'Mitochondrion' ? 'INTERMEMBRANE SPACE' : 'THYLAKOID LUMEN', '#ff9b8b', 11);
    sc.text([-2.2, -1.7, 0], loc === 'Mitochondrion' ? 'MATRIX' : 'STROMA', '#9fb8c8', 11);
    sc.text([-0.3, 2.0, 0], 'H⁺ gradient: ' + Math.round(G), '#ffffff', 12);
    if(cond === 'Uncoupler') sc.text([-0.3, 2.2, 0], 'H⁺ leaks through the membrane → HEAT', '#ffb08a', 12);
    sc.caption('Red = H⁺ · gold = ATP made · orange rotor = ATP synthase · blue = electron transport complexes');
    sc.end();
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}
