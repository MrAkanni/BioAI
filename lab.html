 ['2.3.3','The sodium-potassium pump…',['Moves ions down their gradient without energy','Uses ATP to move ions against their gradients','Only moves water','Is a form of osmosis'],1,'It is a protein pump: active transport powered by ATP.'],
 ['2.3.4','Which statement is true of active transport but NOT passive transport?',['It moves substances from low to high concentration','It happens across membranes','It involves proteins','It helps maintain homeostasis'],0,'Only active transport moves substances against the concentration gradient, using energy.'],
 ['2.2.5','Why is the plasma membrane described as selectively permeable?',['It lets everything through','It lets only some substances cross','It is completely waterproof','It is made only of protein'],1,'It controls what enters and leaves, which maintains stable internal conditions.'],
 ['2.3.2','An animal cell neither swells nor shrinks. The outside solution is…',['Hypotonic','Hypertonic','Isotonic','Pure water'],2,'Equal solute concentration means no net water movement.'],
 ['2.3.1','At dynamic equilibrium…',['All movement stops','Molecules move equally in both directions','Water only moves in','Solute is pumped out'],1,'Movement continues, but there is no net change in concentration.'],
 ['2.3.2','Why do lettuce leaves go crisp in plain water but limp in salty water?',['Salt water is hypotonic, so water enters','Plain water is hypotonic, so cells become turgid','Plain water is hypertonic','Both are isotonic'],1,'Plain water is hypotonic to the cells, so water enters and the cells become turgid. Salty water is hypertonic, so water leaves.'],
]},

dna3d: { course:'BIO50A', unit:'1.6 The Structure of DNA · 1.7 DNA Replication', tabs:[
 { kpi:'1.6.1', t:'Nucleotides & bonds', set:{'Unzip':0}, ch:5,
   x:`A DNA strand is a chain of <b>nucleotides</b>. Each has a <b>phosphate</b>, a <b>deoxyribose sugar</b> and one of four <b>nitrogen bases</b>: <b>A, T, G, C</b>. Nucleotides join by <b>covalent</b> bonds between the sugar of one and the phosphate of the next (the <b>sugar–phosphate backbone</b>). The two strands are held together by <b>hydrogen bonds</b> between bases.`,
   go:`Rotate the helix. The two outer spirals are the backbones; the coloured rungs are base pairs.`,
   ask:[`Which bond joins neighbouring nucleotides in the SAME strand?`,`A covalent (phosphodiester) bond between the sugar of one nucleotide and the phosphate of the next.`] },
 { kpi:'1.6.2', t:'Chargaff\'s rules', set:{'Unzip':0}, ch:4,
   x:`Chargaff found that in any DNA sample <b>A = T</b> and <b>G = C</b>. This is because A always pairs with T (<b>2 hydrogen bonds</b>) and G always pairs with C (<b>3 hydrogen bonds</b>). If a sample is 30 % A it is 30 % T, leaving 40 % for G + C, which is 20 % each.`,
   go:`Count the rungs. Every A is opposite a T and every G opposite a C, so the totals match.`,
   ask:[`A DNA sample is 22 % guanine. What percentage is adenine?`,`G = C = 22 %, so G + C = 44 %. The rest, 56 %, is A + T, so A = 28 %.`] },
 { kpi:'1.6.4', t:'Double helix', set:{'Unzip':0}, ch:0,
   x:`The <b>Watson and Crick</b> model: two strands twist into a <b>double helix</b>. They run <b>antiparallel</b> (one 5′→3′, the other 3′→5′). <b>Hydrogen bonds</b> between complementary bases are weak one at a time but strong together, so DNA is <b>stable</b> yet can still be <b>unzipped</b> for copying.`,
   go:`Use the View buttons (Front, Side) to see the twist and the evenly spaced rungs.`,
   ask:[`Why are hydrogen bonds a good choice for holding the two strands together?`,`They are weak enough to be separated by enzymes for replication and transcription, but numerous enough to keep the molecule stable.`] },
 { kpi:'1.7.3', t:'Helicase unzips', set:{'Unzip':55}, ch:1,
   x:`<b>DNA helicase</b> breaks the hydrogen bonds between base pairs and unwinds the helix, creating a <b>replication fork</b>. <b>DNA polymerase</b> then adds new nucleotides, and <b>DNA ligase</b> seals gaps in the new strands.`,
   go:`Drag the Unzip slider (or open your hand) to about 55 % and read "Bonds broken".`,
   ask:[`Which enzyme breaks the hydrogen bonds between the strands?`,`DNA helicase.`] },
 { kpi:'1.7.1', t:'Semiconservative', set:{'Unzip':100}, ch:3,
   x:`Once the helix is fully unzipped each old strand becomes a <b>template</b> for a new complementary strand. Each daughter DNA molecule has <b>one old strand and one new strand</b>: this is <b>semiconservative replication</b>. It copies information accurately from cell to cell.`,
   go:`Unzip to 100 %. Each separated strand is a template. Count the broken bonds and compare with your calculation.`,
   ask:[`Each daughter molecule contains how much "old" DNA?`,`Exactly one of its two strands.`] },
],
quiz:[
 ['1.6.2','A DNA sample contains 20 % thymine. What percentage is guanine?',['20 %','30 %','40 %','60 %'],1,'T = A = 20 %, so A + T = 40 %. The other 60 % is G + C, so G = 30 %.'],
 ['1.6.1','Which bonds hold the two DNA strands together?',['Covalent bonds','Hydrogen bonds','Ionic bonds','Peptide bonds'],1,'Hydrogen bonds link complementary bases.'],
 ['1.6.4','How many hydrogen bonds are between G and C?',['1','2','3','4'],2,'G–C has three, A–T has two.'],
 ['1.6.1','A nucleotide consists of…',['Amino acid, sugar, base','Phosphate, sugar, nitrogen base','Phosphate, protein, base','Sugar, lipid, base'],1,'Phosphate + deoxyribose sugar + nitrogen base.'],
 ['1.6.4','"Antiparallel" means the two strands…',['Are identical','Run in opposite directions','Are the same length only','Do not touch'],1,'One strand runs 5′→3′, the other 3′→5′.'],
 ['1.7.3','Which enzyme unwinds and unzips the double helix?',['DNA ligase','DNA polymerase','DNA helicase','RNA polymerase'],2,'Helicase breaks the hydrogen bonds.'],
 ['1.7.1','Why is DNA replication called semiconservative?',['Half the DNA is destroyed','Each new molecule keeps one old strand','Only half the genome is copied','Two new strands form one molecule'],1,'Each daughter has one parental strand and one new strand.'],
 ['1.6.1','Which bases are purines? (two-ring)',['A and G','C and T','A and T','G and C'],0,'Adenine and guanine are purines; cytosine and thymine are pyrimidines.'],
 ['1.6.2','The template strand reads 3′-ATGC-5′. The complementary strand is…',['5′-TACG-3′','5′-ATGC-3′','5′-UACG-3′','5′-TAGC-3′'],0,'A↔T, T↔A, G↔C, C↔G.'],
]},

cell3d: { course:'BIO41', unit:'2.4 Structures and Organelles', tabs:[
 { kpi:'2.4.1', t:'Eukaryotic cell', set:{'Explode':0}, click:['None'], ch:4,
   x:`A <b>eukaryotic</b> cell has a nucleus and membrane-bound organelles, each with a job. <b>Animal</b> cells lack a cell wall and chloroplasts; <b>plant</b> cells have both, plus a large vacuole. <b>Prokaryotes</b> have no nucleus and no membrane-bound organelles. Organisation into compartments lets many reactions run at once without interfering.`,
   go:`Slowly drag the Explode slider to separate the organelles, then count each type.`,
   ask:[`Name two structures found in plant cells but not animal cells.`,`Cell wall and chloroplasts (and a large central vacuole).`] },
 { kpi:'2.4.3', t:'Nucleus', set:{'Explode':65}, click:['Nucleus'], ch:3,
   x:`The <b>nucleus</b> is the cell's <b>control centre</b>. It stores the DNA and regulates which genes are used, so it controls protein production and the activities of the cell.`,
   go:`The nucleus (purple) is highlighted. It sits at the centre, with the other organelles arranged around it.`,
   ask:[`What does the nucleus contain that makes it the control centre?`,`The cell's DNA, which carries the instructions for making proteins.`] },
 { kpi:'2.4.4', t:'Mitochondria', set:{'Explode':65}, click:['Mitochondrion'], ch:0,
   x:`<b>Mitochondria</b> carry out <b>aerobic respiration</b>, converting the energy in glucose into <b>ATP</b>. They are bean-shaped, with two membranes. <b>Chloroplasts</b> (plant cells only) capture light energy and build glucose by photosynthesis.`,
   go:`Mitochondria are highlighted. Count them, then compare with how many a muscle cell would need.`,
   ask:[`Why do muscle cells contain more mitochondria than skin cells?`,`They use much more ATP, so they need more organelles making it.`] },
 { kpi:'2.4.5', t:'Ribosomes & ER', set:{'Explode':65}, click:['Rough ER'], ch:5,
   x:`<b>Ribosomes</b> build proteins. Those on the <b>rough ER</b> make proteins that are folded and processed inside it. The <b>smooth ER</b> (no ribosomes) makes lipids and detoxifies substances. Together they form a <b>production line</b> for the cell.`,
   go:`Rough ER is highlighted. The small white dots are ribosomes.`,
   ask:[`Why does the rough ER look "rough"?`,`Ribosomes are attached to its surface.`] },
 { kpi:'2.4.6', t:'Golgi & vesicles', set:{'Explode':65}, click:['Golgi'], ch:2,
   x:`The <b>Golgi apparatus</b> receives proteins and lipids in <b>vesicles</b> from the ER, modifies, sorts and packages them, and sends them to where they are needed (or out of the cell). <b>Vacuoles</b> store materials.`,
   go:`The stacked Golgi bodies are highlighted. Count how many there are.`,
   ask:[`Describe the route of a protein that will be secreted.`,`Ribosome on rough ER → vesicle → Golgi (modified and packaged) → vesicle → plasma membrane → out of the cell.`] },
 { kpi:'2.4.6', t:'Lysosomes', set:{'Explode':65}, click:['Lysosome'], ch:1,
   x:`<b>Lysosomes</b> contain digestive enzymes. They break down worn-out organelles, food particles and invaders, recycling the raw materials.`,
   go:`Lysosomes are highlighted. Count them.`,
   ask:[`What would happen if lysosomes burst open inside a cell?`,`Their enzymes would digest the cell from the inside.`] },
],
quiz:[
 ['2.4.3','Which organelle is the control centre of the cell?',['Mitochondrion','Nucleus','Lysosome','Golgi'],1,'It stores DNA and regulates gene activity.'],
 ['2.4.4','Where does aerobic respiration take place?',['Ribosomes','Lysosomes','Mitochondria','Golgi'],2,'Mitochondria produce most of the cell\'s ATP.'],
 ['2.4.5','Which organelle makes proteins?',['Ribosome','Lysosome','Vacuole','Centriole'],0,'Ribosomes assemble amino acids into proteins.'],
 ['2.4.6','Which organelle modifies, sorts and packages proteins?',['Nucleus','Golgi apparatus','Lysosome','Chloroplast'],1,'The Golgi is the "post office" of the cell.'],
 ['2.4.6','What is the role of lysosomes?',['Make ATP','Store DNA','Digest waste and worn organelles','Make lipids'],2,'They contain digestive enzymes.'],
 ['2.4.1','Which structure is found in plant cells but NOT animal cells?',['Mitochondria','Ribosomes','Cell wall','Nucleus'],2,'Plant cells also have chloroplasts and a large vacuole.'],
 ['2.4.5','What distinguishes rough ER from smooth ER?',['Ribosomes are attached to rough ER','Rough ER has no membrane','Smooth ER makes proteins','Rough ER is only in plants'],0,'Ribosomes on its surface give rough ER its name.'],
 ['2.4.1','Which cell type has no nucleus?',['Plant','Animal','Prokaryotic','Fungal'],2,'Prokaryotes (bacteria, archaea) have no nucleus or membrane-bound organelles.'],
 ['2.4.4','Which organelle captures light energy for photosynthesis?',['Mitochondrion','Chloroplast','Golgi','Ribosome'],1,'Chloroplasts are found in plant cells and some protists.'],
 ['2.4.6','Vesicles carry proteins from the rough ER to…',['The nucleus','The Golgi apparatus','The ribosome','The mitochondrion'],1,'ER → vesicle → Golgi for processing.'],
]},

water: { course:'BIO41', unit:'1.2 Water and Its Solutions', tabs:[
 { kpi:'1.2.1', t:'Polarity', set:{'Temperature':25}, click:['Show H-bonds'], ch:2,
   x:`A water molecule (H₂O) is <b>polar</b>: oxygen pulls the shared electrons more strongly, giving it a slightly <b>negative (δ⁻)</b> end, and the two hydrogens a slightly <b>positive (δ⁺)</b> end. The bent shape stops the charges cancelling. This polarity explains almost everything water does in living things.`,
   go:`Rotate the box. Large spheres are oxygen, small spheres hydrogen. Notice the bent molecule shape.`,
   ask:[`Which atom carries the partial negative charge in water?`,`Oxygen.`] },
 { kpi:'1.2.2', t:'Hydrogen bonds', set:{'Temperature':25}, click:['Show H-bonds'], ch:2,
   x:`The δ⁺ hydrogen of one molecule is attracted to the δ⁻ oxygen of another: a <b>hydrogen bond</b>. Each bond is weak and constantly breaking and reforming, but millions together give water a <b>high boiling point</b>, <b>high specific heat</b> (so it stabilises temperature) and <b>cohesion</b>.`,
   go:`Dashed lines are hydrogen bonds. Read the "Hydrogen bonds" counter at 25 °C.`,
   ask:[`Do hydrogen bonds form between atoms inside the SAME water molecule?`,`No. Inside a molecule the bonds are covalent; hydrogen bonds form BETWEEN molecules.`] },
 { kpi:'1.2.2', t:'Ice (−10 °C)', set:{'Temperature':-10}, click:['Show H-bonds'], ch:1,
   x:`In <b>ice</b> each molecule is locked into a fixed lattice by hydrogen bonds, holding molecules slightly <b>further apart</b> than in liquid water. So ice is <b>less dense</b> and floats, insulating the water below and letting aquatic life survive winter.`,
   go:`Set −10 °C. The molecules form a rigid lattice and the bond count rises.`,
   ask:[`Why is it important for life that ice floats?`,`A layer of ice insulates the liquid water beneath, so organisms can survive in lakes and seas in winter.`] },
 { kpi:'1.2.2', t:'Boiling (110 °C)', set:{'Temperature':110}, click:['Show H-bonds'], ch:0,
   x:`At high temperature molecules gain enough kinetic energy to <b>break every hydrogen bond</b> and escape as steam. The large amount of energy needed to do this is why water has a <b>high boiling point</b> and why sweating cools us so effectively.`,
   go:`Set 110 °C and watch the bond count fall to almost zero as the molecules spread out.`,
   ask:[`Why does evaporating sweat cool the skin?`,`The fastest molecules, which break their hydrogen bonds, leave as vapour, carrying energy away.`] },
 { kpi:'1.2.3', t:'Cohesion & adhesion', set:{'Temperature':20,'Container':60}, click:['Show H-bonds'], ch:3,
   x:`<b>Cohesion</b> is attraction between water molecules (hydrogen bonds); it causes <b>surface tension</b>. <b>Adhesion</b> is attraction between water and other polar surfaces. Together they allow <b>capillary action</b>, pulling water up narrow xylem tubes to the top of tall trees.`,
   go:`Notice how bonded molecules cluster together: that clustering is cohesion.`,
   ask:[`How do cohesion and adhesion help water climb a tree?`,`Cohesion keeps the water column joined; adhesion attaches it to xylem walls so it climbs without breaking.`] },
 { kpi:'1.2.4', t:'Solvent', set:{'Temperature':25}, click:['Show H-bonds'], ch:2,
   x:`Water is the <b>universal solvent</b> of life. Its polar molecules surround ions and polar substances (such as salt and glucose) and pull them apart, forming a <b>solution</b>. This allows nutrients and wastes to be transported in blood and cytoplasm, and metabolic reactions to happen in solution.`,
   go:`Picture the water molecules surrounding a sodium or chloride ion: δ⁻ oxygen to Na⁺, δ⁺ hydrogen to Cl⁻.`,
   ask:[`Why does oil NOT dissolve in water?`,`Oil is non-polar; water molecules prefer to bond with each other than with oil.`] },
],
quiz:[
 ['1.2.1','Why is water a polar molecule?',['It has no charge','Electrons are shared unequally, giving partial charges','It has ionic bonds','It contains carbon'],1,'Oxygen attracts the shared electrons more strongly, giving δ⁻ and δ⁺ regions.'],
 ['1.2.2','A hydrogen bond forms between…',['Two atoms in one molecule','The δ⁺ hydrogen of one molecule and the δ⁻ oxygen of another','Two oxygen atoms','Two hydrogens'],1,'It is an attraction between molecules, not within them.'],
 ['1.2.2','Why does ice float on liquid water?',['It is denser','Hydrogen bonds hold molecules in a lattice with more space','It contains air','It is colder'],1,'The lattice is less dense than liquid water.'],
 ['1.2.3','The attraction between water molecules is called…',['Adhesion','Cohesion','Capillarity','Osmosis'],1,'Adhesion is the attraction between water and other surfaces.'],
 ['1.2.3','Which property lets water rise in the xylem of tall trees?',['Cohesion and adhesion','High density','Low specific heat','Non-polarity'],0,'Together they produce capillary action and an unbroken water column.'],
 ['1.2.4','Why is water such a good solvent?',['It is non-polar','Its polar molecules surround and separate ions and polar molecules','It is acidic','It has a low boiling point'],1,'Partial charges attract solutes.'],
 ['1.2.2','What happens to hydrogen bonds as water is heated to boiling?',['More form','They are all broken','They become covalent','Nothing changes'],1,'Added kinetic energy overcomes the attraction between molecules.'],
 ['1.2.1','The shape of a water molecule is…',['Linear','Bent','Tetrahedral','Flat ring'],1,'The bent shape means the charges do not cancel.'],
 ['1.2.2','Water\'s high specific heat helps living things because it…',['Lets temperature change quickly','Resists rapid temperature changes','Makes water boil easily','Makes water float'],1,'Lots of energy is needed to raise its temperature, helping stabilise conditions.'],
]},

enzyme: { course:'BIO41', unit:'1.1 Chemical Reactions', tabs:[
 { kpi:'1.1.1', t:'Activation energy', set:{'Temperature':37,'pH':7}, fig:'ea', ch:3,
   x:`<b>Activation energy (Eₐ)</b> is the minimum energy reactants need to start a reaction. It is the "hill" on the energy graph. Even reactions that release energy will not start until this barrier is crossed.`,
   go:`Watch the dot climb the hill on the graph above. The height of the hill is Eₐ.`,
   ask:[`On the graph, what does the height of the peak above the reactants represent?`,`The activation energy.`] },
 { kpi:'1.1.3', t:'Enzyme vs none', set:{'Temperature':37,'pH':7}, fig:'both', ch:5,
   x:`An <b>enzyme lowers the activation energy</b>, so more molecules have enough energy to react and the reaction runs faster. It does <b>not</b> change the energy of reactants or products, and the enzyme is <b>not used up</b>. Exothermic reactions release energy (products lower than reactants); endothermic reactions absorb it.`,
   go:`Compare the two curves: same start and end, but the enzyme curve has a much lower peak.`,
   ask:[`Does an enzyme change the overall energy released by a reaction?`,`No. It only lowers the activation energy.`] },
 { kpi:'1.1.4', t:'Active site', set:{'Temperature':37,'pH':7}, ch:5,
   x:`Each enzyme has an <b>active site</b> whose shape matches only certain <b>substrates</b> (<b>specificity</b>). The substrate binds to form an <b>enzyme–substrate complex</b>; the enzyme then helps convert it into <b>products</b>, which are released so the enzyme can be reused.`,
   go:`Rotate the model. Find the dark notch (active site). Blue substrates enter it; green products leave.`,
   ask:[`Why can't a starch-digesting enzyme digest protein?`,`The protein's shape does not fit the enzyme's active site; enzymes are specific.`] },
 { kpi:'1.1.5', t:'Temperature', set:{'Temperature':20,'pH':7}, ch:0,
   x:`Raising temperature increases particle movement, so collisions happen more often and with more energy: the rate rises up to the <b>optimum</b> (about 37 °C for human enzymes). Past the optimum the rate falls fast. At low temperatures enzymes are <b>inactive but not damaged</b>.`,
   go:`Drag Temperature from 0 up to 37 °C and watch the rate graph climb.`,
   ask:[`Why is the rate so low at 5 °C?`,`Molecules move slowly, so there are few collisions between enzyme and substrate. The enzyme is not damaged and works again when warmed.`] },
 { kpi:'1.1.5', t:'pH', set:{'Temperature':37,'pH':3}, ch:1,
   x:`Each enzyme has an <b>optimum pH</b>. Pepsin in the stomach works at about pH 2, most enzymes near pH 7. A big change in pH disrupts the charges in the active site and changes its shape, reducing the rate or <b>denaturing</b> the enzyme.`,
   go:`Set pH to 3, then slide through 5–9. Read the rate for each.`,
   ask:[`Why is the enzyme pepsin useless in the small intestine (pH about 8)?`,`pH 8 is far from its optimum, so its active site changes shape and it can no longer bind substrate.`] },
 { kpi:'1.1.5', t:'Denaturation', set:{'Temperature':85,'pH':7}, ch:2,
   x:`High temperatures or extreme pH <b>denature</b> an enzyme: bonds holding its 3D shape break, the active site changes and the substrate no longer fits. Denaturation is usually <b>irreversible</b>. <b>Inhibitors</b> can also reduce activity by blocking or distorting the active site.`,
   go:`Set 85 °C. The enzyme turns grey, loses its shape and the notch shrinks.`,
   ask:[`Why does cooking an egg turn it solid and keep it solid?`,`Heat denatures the egg proteins; their shape changes permanently.`] },
],
quiz:[
 ['1.1.2','Enzymes are biological catalysts because they…',['Are used up in the reaction','Speed up reactions without being used up','Supply energy','Change the products'],1,'They lower activation energy and are recycled.'],
 ['1.1.1','Activation energy is…',['Energy released by a reaction','The minimum energy to start a reaction','The energy of the products','Heat from the surroundings'],1,'It is the energy barrier reactants must overcome.'],
 ['1.1.3','On an energy graph, adding an enzyme…',['Raises the reactants','Lowers the activation energy peak','Lowers the products','Removes the peak'],1,'The enzyme provides an easier route.'],
 ['1.1.4','The part of an enzyme where the substrate binds is the…',['Active site','Product','Inhibitor','Coenzyme'],0,'The active site\'s shape matches the substrate.'],
 ['1.1.5','What is the likely cause of low enzyme activity at 0 °C?',['Denaturation','Slow molecular movement','High pH','Too many products'],1,'Cold slows collisions; the enzyme is not denatured.'],
 ['1.1.5','What happens to an enzyme at 80 °C?',['Works faster','Becomes denatured','Is unaffected','Becomes the substrate'],1,'Heat breaks bonds that hold its shape.'],
 ['1.1.4','The "lock and key" idea explains…',['Why enzymes are specific','Why temperature matters','How ATP is made','Osmosis'],0,'Only a substrate with the matching shape fits the active site.'],
 ['1.1.5','A competitive inhibitor reduces enzyme activity by…',['Heating the enzyme','Blocking the active site','Adding energy','Changing the pH'],1,'It competes with the substrate for the active site.'],
 ['1.1.5','Which is most likely to affect enzyme activity?',['Temperature','pH','Inhibitors','All of these'],3,'All three change the rate of enzyme-controlled reactions.'],
 ['1.1.3','An exothermic reaction…',['Absorbs energy so products have more energy','Releases energy so products have less energy','Needs no activation energy','Cannot be catalysed'],1,'Products end lower in energy than reactants.'],
]},

};

Object.assign(KPI_LABS, {

punnett: { course:'BIO50A', unit:'1.1 Mendel · 1.2 Applying Mendel\'s Principles', tabs:[
 { kpi:'1.1.3', t:'Dominant & recessive', set:{'Parent 1':'Aa','Parent 2':'Aa','Spread':30}, ch:2,
   x:`A <b>dominant</b> allele (capital letter, <b>A</b>) is expressed when present; a <b>recessive</b> allele (<b>a</b>) is expressed only when two copies are present (<b>aa</b>). So <b>AA</b> and <b>Aa</b> both look dominant. Crossing two heterozygotes gives a <b>3 : 1</b> dominant : recessive phenotype ratio.`,
   go:`Parents Aa × Aa are loaded. Count the dominant and recessive offspring cards. Read the ratio.`,
   ask:[`A recessive trait disappears in the F1 generation. Where is the allele?`,`Hidden in the heterozygous (Aa) individuals: the dominant allele masks it.`] },
 { kpi:'1.2.1', t:'Homo- vs heterozygous', set:{'Parent 1':'AA','Parent 2':'aa','Spread':40}, ch:1,
   x:`<b>Homozygous</b> = two identical alleles (<b>AA</b> or <b>aa</b>); <b>heterozygous</b> = two different alleles (<b>Aa</b>). A homozygous dominant parent can only pass on <b>A</b>; a heterozygote passes on <b>A</b> or <b>a</b> with equal chance. This explains how variation is produced.`,
   go:`AA × aa is loaded: every offspring is Aa, so all four cards are heterozygous.`,
   ask:[`Can two homozygous parents have a heterozygous child?`,`Yes: AA × aa gives all Aa.`] },
 { kpi:'1.2.2', t:'Genotype vs phenotype', set:{'Parent 1':'Aa','Parent 2':'Aa','Spread':55}, ch:2,
   x:`<b>Genotype</b> is the allele combination (e.g. <b>Aa</b>). <b>Phenotype</b> is the observable trait it produces. Different genotypes (AA, Aa) can give the <b>same phenotype</b>, so genotype ratio (1 : 2 : 1) and phenotype ratio (3 : 1) differ.`,
   go:`Spread the cards. Count genotypes (AA, Aa, aa) and phenotypes (dominant, recessive).`,
   ask:[`Give a cross where the genotype and phenotype ratios are the same.`,`Aa × aa gives 1 Aa : 1 aa and 1 dominant : 1 recessive.`] },
 { kpi:'1.2.4', t:'F1 generation', set:{'Parent 1':'AA','Parent 2':'aa','Spread':35}, ch:3,
   x:`Mendel crossed two <b>true-breeding</b> parents (<b>P generation</b>, e.g. tall AA × short aa). All of their offspring, the <b>F1 generation</b>, were heterozygous <b>Aa</b> and showed the dominant trait.`,
   go:`With AA × aa loaded, confirm that 4/4 offspring are Aa.`,
   ask:[`What fraction of the F1 show the recessive phenotype?`,`None (0 %), because every F1 plant carries a dominant A allele.`] },
 { kpi:'1.2.4', t:'F2 generation', set:{'Parent 1':'Aa','Parent 2':'Aa','Spread':45}, ch:4,
   x:`Crossing two F1 plants (<b>Aa × Aa</b>) gives the <b>F2 generation</b>: <b>¼ AA, ½ Aa, ¼ aa</b>, i.e. a <b>3 : 1</b> phenotype ratio. The recessive trait reappears: evidence that alleles <b>segregate</b> during gamete formation.`,
   go:`Load Aa × Aa. Look for the single aa card, the recessive that reappeared.`,
   ask:[`In 400 F2 offspring, about how many should show the recessive trait?`,`About 100 (¼ of 400).`] },
 { kpi:'1.2.5', t:'Test cross', set:{'Parent 1':'Aa','Parent 2':'aa','Spread':40}, ch:5,
   x:`To find out whether a dominant-looking organism is <b>AA</b> or <b>Aa</b>, cross it with a <b>homozygous recessive (aa)</b>. If <b>any offspring are recessive</b>, the unknown is <b>Aa</b> (ratio 1 : 1). If <b>all are dominant</b>, it is <b>AA</b>. Probability reasoning supports the prediction.`,
   go:`Aa × aa is loaded: two Aa cards and two aa cards. Now try AA × aa and compare.`,
   ask:[`A test cross gives all dominant offspring. What was the unknown genotype?`,`Homozygous dominant (AA).`] },
],
quiz:[

photosynthesis: { course:'BIO61', unit:'1.2 Photosynthesis', tabs:[

   ask:[`How many molecules of O₂ come out for each glucose made?`,`Six.`] },
 { kpi:'1.2.1', t:'Low light', set:{'Light':15}, ch:1,

   go:`Set light to 15 % and read the O₂ rate. Increase to 30 % and compare.`,
   ask:[`If light is the limiting factor, what happens to the rate if you double the light?`,`It roughly doubles (while light is still the limiting factor).`] },
 { kpi:'1.2.1', t:'Saturation', set:{'Light':100}, ch:0,

 { kpi:'1.2.3', t:'Pigments', set:{'Light':60}, ch:5,
   x:`<b>Chlorophyll a and b</b> absorb mainly <b>red and blue</b> light and reflect <b>green</b>, which is why leaves look green. <b>Carotenoids</b> absorb other blues/greens and protect the leaf. Different pigment mixtures help plants capture energy in different light environments.`,

],

respiration: { course:'BIO61', unit:'1.3 Cellular Respiration', tabs:[
 { kpi:'1.3.1', t:'The equation', set:{'Spread':50}, click:['Aerobic','Run One Glucose'], ch:0,
   x:`Cellular respiration transfers energy stored in glucose into usable <b>ATP</b>:<br><b>C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + ATP</b><br>It is the reverse of photosynthesis in terms of matter, but energy is <b>released</b> and about 36 ATP per glucose are captured.`,
   go:`Press "Run One Glucose" and follow the glucose through each stage. Watch the ATP counter.`,
   ask:[`Which gas is consumed and which is released?`,`O₂ consumed; CO₂ released.`] },
 { kpi:'1.3.4', t:'Glycolysis', set:{'Spread':80}, click:['Aerobic','Run One Glucose'], ch:2,
   x:`<b>Glycolysis</b> takes place in the <b>cytoplasm</b>. One glucose (6C) is split into two pyruvate (3C), giving a net <b>2 ATP</b> and 2 NADH. It needs <b>no oxygen</b>, so it works in all conditions.`,
   go:`Spread the stages and follow glucose into the first box.`,
   ask:[`Why can glycolysis keep running even when oxygen is absent?`,`It does not need oxygen; it only needs glucose and a way to regenerate NAD⁺.`] },
 { kpi:'1.3.5', t:'Krebs cycle', set:{'Spread':80}, click:['Aerobic','Run One Glucose'], ch:2,
   x:`The <b>Krebs cycle</b> (mitochondrial matrix) completes the breakdown of pyruvate, releasing <b>CO₂</b> and producing <b>2 ATP</b> plus many <b>high-energy electron carriers (NADH, FADH₂)</b> that carry energy to the next stage.`,
   go:`Watch the second box: modest ATP, but it loads the electron carriers.`,
   ask:[`Why is the Krebs cycle important even though it makes little ATP directly?`,`It produces NADH and FADH₂, which drive the electron transport chain that makes most ATP.`] },
 { kpi:'1.3.6', t:'Electron transport', set:{'Spread':80}, click:['Aerobic','Run One Glucose'], ch:2,
   x:`The <b>electron transport chain</b> (inner mitochondrial membrane) passes electrons along protein complexes, pumping H⁺ across the membrane. The proton gradient drives <b>ATP synthase</b> (<b>chemiosmosis</b>). <b>Oxygen</b> is the final electron acceptor, forming water. This stage makes about <b>32 ATP</b>.`,
   go:`Watch the third box: by far the biggest ATP gain.`,
   ask:[`What happens to the ETC if there is no oxygen?`,`Electrons have nowhere to go, the chain stops and most ATP production ceases.`] },
 { kpi:'1.3.2', t:'Aerobic vs anaerobic', set:{'Spread':50}, click:['Anaerobic','Run One Glucose'], ch:3,
   x:`<b>Aerobic</b> respiration (with oxygen) yields about <b>36 ATP</b>. <b>Anaerobic</b> respiration (no oxygen) yields only <b>2 ATP</b> from glycolysis, because the Krebs cycle and ETC cannot run. Anaerobic pathways are fast but very inefficient.`,
   go:`Toggle between Aerobic and Anaerobic and compare the total ATP after each run.`,
   ask:[`How much more ATP does aerobic respiration yield per glucose?`,`About 34 more (36 vs 2).`] },
 { kpi:'1.3.8', t:'Fermentation', set:{'Spread':50}, click:['Anaerobic','Run One Glucose'], ch:5,
   x:`When oxygen is limited, <b>fermentation</b> regenerates NAD⁺ so glycolysis can continue. <b>Lactic acid fermentation</b> (muscle cells) produces lactate. <b>Alcohol fermentation</b> (yeast) produces ethanol and CO₂. Neither makes extra ATP.`,
   go:`Run anaerobic and read the red byproduct caption.`,
   ask:[`Why do muscles burn during very intense exercise?`,`They run out of oxygen, switch to lactic acid fermentation, and lactate builds up.`] },
],
quiz:[
 ['1.3.1','Which is the equation for aerobic respiration?',['6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂','C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ATP','C₆H₁₂O₆ → 2 ethanol + 2CO₂','O₂ + H₂O → ATP'],1,'Glucose is oxidised and ATP is produced.'],
 ['1.3.7','Approximately how much ATP does the ETC produce per glucose?',['2','4','32','36 only'],2,'It is the biggest producer (about 32 of 36).'],
 ['1.3.4','Where does glycolysis occur?',['Mitochondrial matrix','Cytoplasm','Inner mitochondrial membrane','Nucleus'],1,'It occurs in the cytoplasm.'],
 ['1.3.2','Anaerobic respiration yields about…',['36 ATP','2 ATP','0 ATP','100 ATP'],1,'Only glycolysis makes ATP.'],
 ['1.3.6','What is the final electron acceptor in the ETC?',['Glucose','Oxygen','CO₂','NADH'],1,'Oxygen combines with electrons and H⁺ to form water.'],
 ['1.3.8','Yeast fermentation produces…',['Lactic acid','Ethanol and CO₂','Water only','Glucose'],1,'This is alcohol fermentation.'],
 ['1.3.8','Muscle cells low on oxygen produce…',['Ethanol','Lactic acid','Starch','Oxygen'],1,'Lactic acid fermentation.'],
 ['1.3.5','The Krebs cycle takes place in…',['Cytoplasm','Mitochondrial matrix','Thylakoid','Golgi'],1,'It is in the mitochondrial matrix.'],

circulatory: { course:'BIO70', unit:'1.1 Circulatory System', tabs:[
 { kpi:'1.1.2', t:'Heart as a pump', set:{'Heart Rate':72}, ch:5,
   x:`The heart is a muscular <b>double pump</b> with four chambers: two <b>atria</b> (receive blood) and two <b>ventricles</b> (pump blood out). <b>Valves</b> keep blood flowing one way. The right side sends blood to the lungs; the left side (thicker wall) sends it round the body.`,
   go:`Rotate the heart. Identify RA, LA, RV and LV. Which ventricle looks bigger?`,
   ask:[`Why is the wall of the left ventricle thicker?`,`It pumps blood to the whole body at high pressure, while the right ventricle only pumps to nearby lungs.`] },
 { kpi:'1.1.3', t:'Pacemaker', set:{'Heart Rate':72}, ch:0,
   x:`The <b>SA node</b> (pacemaker) in the right atrium sets the heart rate by sending an electrical signal that makes both atria contract. The signal reaches the <b>AV node</b>, which delays it briefly and passes it to the ventricles, so they contract <b>after</b> the atria.`,
   go:`Watch the rhythm: atria contract, then ventricles.`,
   ask:[`Why is the AV node's short delay useful?`,`It lets the ventricles fill completely before they contract.`] },
 { kpi:'1.1.6', t:'Pulmonary & systemic', set:{'Heart Rate':45}, ch:5,
   x:`<b>Pulmonary circulation:</b> right ventricle → lungs → left atrium (blood picks up O₂). <b>Systemic circulation:</b> left ventricle → body → right atrium (blood delivers O₂). In the model red = oxygenated, blue = deoxygenated.`,
   go:`Slow the heart to ~45 bpm and trace one blood cell round the full figure-of-eight.`,
   ask:[`Which blood vessel carries deoxygenated blood to the lungs?`,`The pulmonary artery (an exception: an artery carrying deoxygenated blood).`] },
 { kpi:'1.1.4', t:'Pulse', set:{'Heart Rate':72}, ch:4,
   x:`A <b>pulse</b> is the wave of pressure that travels along an artery each time the left ventricle contracts. Counting pulses per minute gives the <b>heart rate</b>, a quick indicator of circulatory activity and fitness. Normal resting range for adults: about 60–100 bpm.`,
   go:`Set the heart rate and count beats over 15 seconds, then multiply by 4.`,
   ask:[`You count 18 pulses in 15 seconds. What is the heart rate?`,`18 × 4 = 72 bpm.`] },
 { kpi:'1.1.4', t:'Exercise', set:{'Heart Rate':150}, ch:0,
   x:`During exercise, muscles need more O₂ and glucose and produce more CO₂. The heart rate rises, so <b>cardiac output (heart rate × stroke volume)</b> increases and blood is delivered faster. The rate then returns to resting after recovery.`,
   go:`Set about 150 bpm and compare blood movement with resting.`,
   ask:[`Why is cardiac output higher during running?`,`Heart rate (and stroke volume) increases to supply more oxygen and remove CO₂.`] },
 { kpi:'1.1.5', t:'Blood pressure', set:{'Heart Rate':72}, ch:2,
   x:`<b>Blood pressure</b> is the force of blood on vessel walls. Written as <b>systolic / diastolic</b> (e.g. 120/80 mmHg). <b>Systolic</b> = pressure when the ventricles contract; <b>diastolic</b> = pressure when the heart relaxes and refills. Persistently high pressure strains the heart and vessels.`,
   go:`Notice the pumping rhythm: contraction (systole) then relaxation (diastole).`,
   ask:[`Which of 120/80 is the systolic value?`,`120, the pressure during ventricular contraction.`] },
],

 ['1.1.4','Why does the heart rate increase during exercise?',['To cool the heart','To deliver more O₂ to muscles','To slow circulation','To reduce CO₂ production'],1,'Muscles need more oxygen and glucose.'],

 { kpi:'1.2.7', t:'Buffers', set:{'pH':7.4}, click:['Buffer'], ch:5,

cellsize: { course:'BIO41', unit:'3.1 Cellular Reproduction', tabs:[
 { kpi:'3.1.1', t:'Why cells stay small', set:{'Cell side':4}, click:['1 cell'], ch:2,
   x:`Materials (O₂, nutrients, wastes) cross the <b>cell surface</b>, but are used by the whole <b>volume</b>. As a cell grows, its <b>volume increases faster than its surface area</b> (V = s³ but SA = 6s²), so the <b>SA : V ratio falls</b>. A big cell cannot get materials in, or wastes out, fast enough. Transport and communication also take longer over long distances.`,
   go:`Drag the side length from 1 to 12 µm. Watch the SA : V ratio fall from 6 to 0.5.`,
   ask:[`Why can't a single cell grow to the size of a football?`,`Its SA : V ratio would be far too small: the surface could not supply the huge volume.`] },
 { kpi:'3.1.2', t:'Calculate SA : V', set:{'Cell side':6}, click:['1 cell'], ch:0,
   x:`<b>Formulas for a cube of side s:</b><br>Surface area = <b>6 × s²</b><br>Volume = <b>s³</b><br><b>SA : V = 6 ÷ s</b><br>Example: s = 3 µm → SA = 54 µm², V = 27 µm³, ratio = 2 : 1. Doubling the side <b>halves</b> the ratio.`,
   go:`Set the side to 6 µm and check: SA = 216, V = 216, ratio 1 : 1. Press Record for several sizes and plot ratio against side length.`,
   ask:[`A cell has a side of 5 µm. What is its SA : V ratio?`,`SA = 6 × 25 = 150; V = 125; ratio = 1.2 : 1.`] },
 { kpi:'3.1.1', t:'Diffusion limit', set:{'Cell side':10}, click:['1 cell'], ch:5,
   x:`Diffusion is fast over short distances and very slow over long ones. In the model, nutrients only reach a fixed depth. The <b>red core</b> is the part of the cell that diffusion cannot supply. Larger cells have a larger starved core, so <b>"Reached by diffusion" falls</b>.`,
   go:`Set the side to 10 µm: much of the cell is starved. Reduce to 2 µm: the core vanishes.`,
   ask:[`What happens to organelles in the red core of a very large cell?`,`They run short of nutrients and cannot get rid of wastes, so the cell cannot work properly.`] },
 { kpi:'3.1.1', t:'Why cells divide', set:{'Cell side':8}, click:['Divide into 8'], ch:4,
   x:`Dividing one large cell into <b>8 smaller cells</b> keeps the <b>same total volume</b> but <b>doubles the total surface area</b>. The SA : V ratio doubles, so every part of each cell is within reach of diffusion. This is one reason cells divide and why organisms grow by making <b>more cells</b>, not bigger ones.`,
   go:`Click "Divide into 8". The total surface area doubles and the red cores disappear.`,
   ask:[`A cell of side 8 µm divides into eight cubes. What is the SA : V of each small cell?`,`Side 4 µm gives 6 ÷ 4 = 1.5 : 1, double the original 0.75 : 1.`] },
],
quiz:[
 ['3.1.1','As a cell grows larger, its SA : V ratio…',['Increases','Decreases','Stays the same','Becomes zero'],1,'Volume increases faster than surface area.'],
 ['3.1.2','A cube-shaped cell has a side of 2 µm. Its volume is…',['4 µm³','6 µm³','8 µm³','24 µm³'],2,'V = s³ = 8.'],
 ['3.1.2','A cube-shaped cell has a side of 2 µm. Its surface area is…',['8 µm²','12 µm²','24 µm²','48 µm²'],2,'SA = 6 × 2² = 24.'],
 ['3.1.2','What is the SA : V ratio of a cube with a side of 3 µm?',['1 : 1','2 : 1','3 : 1','6 : 1'],1,'SA 54, V 27, ratio 2 : 1.'],
 ['3.1.1','Why is a small cell better at exchanging materials?',['It has more organelles','It has a higher SA : V ratio','It has thicker walls','It has less water'],1,'The surface supplies a small volume efficiently.'],
 ['3.1.1','Dividing a cell into 8 equal parts (same total volume) makes the total surface area…',['Halve','Stay the same','Double','Quadruple'],2,'Eight cubes of side s/2 have SA = 12 s², twice the original 6 s².'],
 ['3.1.1','Which of these limits cell size?',['Transport efficiency','Cell colour','Nucleus shape','Number of ribosomes only'],0,'Materials must reach the whole cell fast enough.'],
 ['3.1.2','Doubling the side length of a cube cell changes the SA : V ratio to…',['Double','Half','The same','Quarter'],1,'Ratio = 6 ÷ s, so doubling s halves it.'],
 ['3.1.1','Which cell structure is adapted to increase surface area?',['Microvilli on intestinal cells','Cell wall','Nucleus','Ribosome'],0,'Folds and microvilli increase absorption surface area.'],
]},

mitosis: { course:'BIO41', unit:'3.1 Cell Cycle and Mitosis', tabs:[
 { kpi:'3.1.4', t:'Why the cycle matters', set:{'Cell cycle':0}, click:['Animal cell'], ch:3,
   x:`The <b>cell cycle</b> is the ordered series of events by which a cell grows, copies its DNA and divides. It produces new cells for <b>growth</b>, <b>repair</b> and (in some organisms) <b>reproduction</b>, and ensures each daughter cell gets an <b>identical</b> set of chromosomes, which keeps tissues stable.`,
   go:`Press Play to watch the whole cycle in about 10 seconds, then step through it with the slider.`,
   ask:[`Name two reasons your body needs mitosis.`,`Growth and repair (replacing damaged cells).`] },
 { kpi:'3.1.5', t:'Interphase', set:{'Cell cycle':10}, click:['Animal cell'], ch:5,
   x:`<b>Interphase</b> is the longest phase. <b>G1:</b> the cell grows and does its normal job. <b>S:</b> DNA is <b>replicated</b>, so each chromosome gains an identical sister chromatid. <b>G2:</b> the cell prepares to divide. The chromosomes are loose, thread-like <b>chromatin</b>, and the nuclear envelope is intact.`,
   go:`At about 10 % (S phase) watch a second thin thread appear next to each one: DNA copying.`,
   ask:[`In which stage of interphase is DNA copied?`,`S phase (synthesis).`] },
 { kpi:'3.1.7', t:'Prophase', set:{'Cell cycle':28}, click:['Animal cell'], ch:0,
   x:`<b>Prophase:</b> chromatin <b>condenses</b> into visible chromosomes, each made of <b>two sister chromatids</b> joined at the centromere. The <b>nuclear envelope breaks down</b>, <b>centrioles move to opposite poles</b> and spindle fibres begin to form.`,
   go:`Slide from 20 % to 35 % and watch the threads shorten and thicken while the purple envelope fades.`,
   ask:[`Why is it useful for chromosomes to condense before they are moved?`,`Short, compact chromosomes are easier to move and are less likely to tangle or break.`] },
 { kpi:'3.1.7', t:'Metaphase', set:{'Cell cycle':43}, click:['Animal cell'], ch:1,
   x:`<b>Metaphase:</b> chromosomes line up along the <b>equator (metaphase plate)</b>. Spindle fibres from <b>both poles</b> attach to each centromere. Chromosomes are at their most condensed, which is the best time to count them (karyotype).`,
   go:`Set about 43 %. Look along the equator: all four chromosomes line up in one plane. Use the Side view.`,
   ask:[`How many chromatids are in a cell with 4 chromosomes at metaphase?`,`8 (each chromosome has two sister chromatids).`] },
 { kpi:'3.1.7', t:'Anaphase', set:{'Cell cycle':58}, click:['Animal cell'], ch:2,
   x:`<b>Anaphase:</b> the centromeres split and the spindle fibres <b>shorten</b>, pulling the <b>sister chromatids to opposite poles</b>. Each separated chromatid is now a chromosome, so the chromosome number <b>doubles</b> temporarily (4 → 8).`,
   go:`Set 58 %. Count the V-shaped chromosomes moving to each pole. Read the Chromosomes readout.`,
   ask:[`Why do the chromatids look V-shaped as they move?`,`The spindle fibres pull on the centromere, and the arms trail behind.`] },
 { kpi:'3.1.7', t:'Telophase', set:{'Cell cycle':72}, click:['Animal cell'], ch:5,
   x:`<b>Telophase:</b> chromosomes arrive at the poles and <b>decondense</b> back to chromatin, the spindle breaks down and a <b>new nuclear envelope</b> forms around each set. This is the reverse of prophase.`,
   go:`Set 72 %. Two purple nuclear envelopes reform, one at each pole.`,
   ask:[`Which phase is the reverse of telophase?`,`Prophase.`] },
 { kpi:'3.1.6', t:'Cytokinesis (animal)', set:{'Cell cycle':92}, click:['Animal cell'], ch:4,
   x:`<b>Cytokinesis</b> divides the <b>cytoplasm</b>. In an animal cell a ring of protein fibres contracts and forms a <b>cleavage furrow</b> that pinches the cell in two. The result: <b>two genetically identical diploid daughter cells</b>.`,
   go:`Set 92 % with Animal cell selected. Watch the cell pinch in the middle.`,
   ask:[`Is mitosis the same as cell division?`,`No. Mitosis is nuclear division; cytokinesis divides the cytoplasm.`] },
 { kpi:'3.1.8', t:'Cytokinesis (plant)', set:{'Cell cycle':92}, click:['Plant cell'], ch:4,
   x:`A <b>plant cell</b> has a rigid cell wall, so it cannot pinch in. Instead vesicles form a <b>cell plate</b> across the middle that grows outward and becomes a new <b>cell wall</b> between the daughter cells.`,
   go:`Switch to Plant cell at 92 %: the brown cell plate grows across the cell.`,
   ask:[`Why can't a plant cell form a cleavage furrow?`,`Its rigid cell wall prevents the cell from pinching inward.`] },
],
quiz:[
 ['3.1.7','During which phase do chromosomes line up at the equator?',['Prophase','Metaphase','Anaphase','Telophase'],1,'Metaphase: lined up on the metaphase plate.'],
 ['3.1.7','Sister chromatids separate during…',['Prophase','Metaphase','Anaphase','Interphase'],2,'Anaphase: centromeres split and chromatids move to the poles.'],
 ['3.1.5','DNA is replicated during…',['G1','S phase','Metaphase','Telophase'],1,'S stands for synthesis of DNA.'],
 ['3.1.6','The correct order of mitosis is…',['Prophase, metaphase, anaphase, telophase','Metaphase, prophase, anaphase, telophase','Prophase, anaphase, metaphase, telophase','Telophase, anaphase, metaphase, prophase'],0,'PMAT, followed by cytokinesis.'],
 ['3.1.6','A cell has 10 chromosomes. After mitosis and cytokinesis each daughter cell has…',['5','10','20','2'],1,'Mitosis produces identical daughter cells with the same number.'],
 ['3.1.8','Plant cytokinesis involves…',['A cleavage furrow','A cell plate','Cell lysis','Centrioles only'],1,'A cell plate becomes the new cell wall.'],
 ['3.1.7','The nuclear envelope reforms during…',['Prophase','Anaphase','Telophase','Metaphase'],2,'Telophase reverses prophase.'],
 ['3.1.7','How many chromatids are in a cell with 6 chromosomes at metaphase?',['6','12','3','24'],1,'Each replicated chromosome has two sister chromatids.'],
 ['3.1.4','Which is NOT a role of mitosis?',['Growth','Repair','Making gametes with half the chromosomes','Replacing old cells'],2,'Making haploid gametes is meiosis.'],
 ['3.1.6','Which structure moves the chromosomes?',['Spindle fibres','Cell wall','Golgi','Lysosome'],0,'Spindle fibres pull chromosomes and chromatids.'],
]},

nephron: { course:'BIO41', unit:'7.3 The Excretory System', tabs:[
 { kpi:'7.3.2', t:'Excretory organs', set:{'Position':50}, click:['Healthy','Normal'], ch:0,
   x:`<b>Excretion</b> is the removal of the waste products of metabolism. <b>Skin</b> (sweat): water, salts and a little urea. <b>Lungs</b>: carbon dioxide and water vapour. <b>Kidneys</b>: urea, excess water and excess salts, which leave as urine. The kidneys also keep the blood composition steady, which is part of <b>homeostasis</b>.`,
   go:`This lab zooms into one of the million tiny filters in each kidney, a <b>nephron</b>.`,
   ask:[`Which organ removes carbon dioxide from the body?`,`The lungs (breathed out).`] },
 { kpi:'7.3.4', t:'Nephron structure', set:{'Position':6}, click:['Healthy','Normal'], ch:0,
   x:`The nephron has: <b>glomerulus</b> (knot of capillaries) inside <b>Bowman’s capsule</b>, the <b>proximal convoluted tubule (PCT)</b>, the <b>loop of Henle</b> (dipping into the medulla), the <b>distal convoluted tubule (DCT)</b> and the <b>collecting duct</b>. Blood arrives in the afferent arteriole and leaves in the efferent arteriole.`,
   go:`Drag the position slider from 0 to 100 % and read the name of each part as the white marker moves.`,
   ask:[`Which part of the nephron contains the filter?`,`The glomerulus inside Bowman’s capsule.`] },
 { kpi:'7.3.5', t:'Ultrafiltration', set:{'Position':10}, click:['Healthy','Normal'], ch:0,
   x:`The glomerulus is a ball of capillaries. The <b>afferent arteriole is wider than the efferent one</b>, so the blood pressure is high and forces small molecules out into Bowman’s capsule: <b>water, glucose, amino acids, salts and urea</b>. <b>Proteins and blood cells are too big</b> and stay in the blood. This is <b>ultrafiltration</b>.`,
   go:`Position 10 %. Glucose and water fill the filtrate. In the Protein / blood cells box it says none: they are too big to filter.`,
   ask:[`Why do blood cells not leave the glomerulus?`,`They are too large to pass through the filter.`] },
 { kpi:'7.3.5', t:'Selective reabsorption', set:{'Position':40}, click:['Healthy','Normal'], ch:1,
   x:`In the <b>PCT</b> the cells have <b>microvilli</b> (large surface area) and many <b>mitochondria</b>. They reabsorb <b>all the glucose and amino acids</b> by active transport, plus most of the salts and about <b>65 % of the water</b>. By 40 % along, only 35 % of the water is left and the glucose is zero.`,
   go:`Move from 12 % to 40 % and watch the gold glucose particles vanish. Read Water left and Glucose.`,
   ask:[`Why do PCT cells have so many mitochondria?`,`Active transport of glucose and ions needs ATP from respiration.`] },
 { kpi:'7.3.5', t:'Loop of Henle', set:{'Position':60}, click:['Healthy','Normal'], ch:1,
   x:`The <b>loop of Henle</b> makes the <b>medulla very salty</b>. In the descending limb, water leaves the tubule by osmosis into the salty tissue. In the ascending limb, salt is pumped out. A long loop lets an animal make very <b>concentrated urine</b>.`,
   go:`Move to 60 %: only about 20 % of the water is left in the tubule.`,
   ask:[`Why is the medulla kept salty?`,`So water can be drawn out of the filtrate by osmosis as it passes, giving concentrated urine.`] },
 { kpi:'7.3.5', t:'Urine formation', set:{'Position':100}, click:['Healthy','Normal'], ch:3,
   x:`The <b>DCT</b> fine-tunes the salts, then the <b>collecting duct</b> reabsorbs more water. What is left is <b>urine</b>: water, urea and excess salts. Only about <b>1–2 % of the filtrate</b> leaves as urine, and <b>urea is about 25 times more concentrated</b> than in the filtrate.`,
   go:`Move to 100 %. Read Urea concentration and Water left.`,
   ask:[`Where does urine collect after it leaves the collecting duct?`,`It drains to the renal pelvis, then down the ureter to the bladder.`] },
 { kpi:'7.3.5', t:'ADH and water balance', set:{'Position':100}, click:['Dehydrated'], ch:5,
   x:`<b>ADH</b> (from the pituitary gland) makes the <b>collecting duct more permeable to water</b>. When you are <b>dehydrated</b> the blood is too concentrated, more ADH is released, more water is reabsorbed and you make a <b>small volume of dark, concentrated urine</b>. When well <b>hydrated</b>, little ADH is released and the urine is dilute. This is <b>negative feedback</b>.`,
   go:`Click Dehydrated, then Hydrated, with the marker at 100 %. Compare the water left in the urine.`,
   ask:[`What happens to urine volume when ADH rises?`,`Less urine, more concentrated, because more water is reabsorbed.`] },
 { kpi:'7.3.5', t:'Glucose in urine', set:{'Position':100}, click:['Diabetes'], ch:2,
   x:`Normally <b>all glucose is reabsorbed</b>. In <b>diabetes</b> the blood glucose is so high that the PCT transport proteins are <b>saturated</b> and cannot take it all back. Glucose then stays in the tubule and appears in the <b>urine</b>, which is used as a first test.`,
   go:`Click Diabetes and move to 100 %. Read Glucose in tubule: it is not zero.`,
   ask:[`Why does the PCT fail to reabsorb all the glucose in diabetes?`,`Its carrier proteins are all in use: there is a maximum reabsorption rate.`] },
 { kpi:'7.3.6', t:'Nephritis', set:{'Position':100}, click:['Nephritis'], ch:4,
   x:`<b>Nephritis</b> is inflammation of the nephrons, often of the <b>glomeruli</b>. The damaged filter lets <b>protein and blood cells</b> into the filtrate, so they appear in the urine. Low blood protein can cause swelling (oedema), and the person may have high blood pressure. Severe nephritis can lead to kidney failure.`,
   go:`Click Nephritis: purple and red particles flow through the whole nephron.`,
   ask:[`Why is protein in the urine a sign of kidney damage?`,`Healthy glomeruli are too fine to let proteins through.`] },
 { kpi:'7.3.6', t:'Stones and cancer', set:{'Position':100}, click:['Healthy','Normal'], ch:5,
   x:`<b>Kidney stones</b> are hard crystals of calcium salts or uric acid that form when urine is very concentrated. They can block the ureter and cause severe pain, so drinking water helps prevent them. <b>Kidney cancer</b> is uncontrolled cell division in the kidney, forming a tumour. Blood in the urine can be a sign. Treatment may involve surgery to remove the tumour or kidney.`,
   go:`Compare Hydrated and Dehydrated at 100 %: concentrated urine is what lets crystals form.`,
   ask:[`Why does drinking more water lower the risk of kidney stones?`,`It makes the urine more dilute, so crystals are less likely to form.`] },
 { kpi:'7.3.7', t:'Dialysis and transplant', set:{'Position':100}, click:['Nephritis'], ch:4,
   x:`If the kidneys fail, waste builds up. <b>Haemodialysis</b> passes the blood through a machine where a <b>partially permeable membrane</b> lets urea diffuse into dialysis fluid (which has no urea but normal glucose and salt levels). It is needed several times a week. A <b>kidney transplant</b> gives a healthy donor kidney: it frees the patient from dialysis, but needs <b>tissue matching</b> and <b>immunosuppressant drugs</b> to prevent rejection.`,
   go:`Use the damaged nephron view to see why filtering fails, then think about how a machine replaces it.`,
   ask:[`Why does dialysis fluid contain no urea?`,`So urea diffuses from the blood into the fluid down its concentration gradient.`] },
],

dihybrid: { course:'BIO61', unit:'2.1 Patterns of Inheritance', tabs:[
 { kpi:'2.1.6', t:'Two traits at once', set:{'Offspring sample':16}, click:['Dihybrid F1'], ch:3,
   x:`A <b>dihybrid cross</b> follows <b>two genes</b> at once. In Mendel’s peas, <b>R</b> = round (dominant), <b>r</b> = wrinkled; <b>Y</b> = yellow (dominant), <b>y</b> = green. A plant <b>RrYy</b> is heterozygous for both traits and has the phenotype <b>round yellow</b>.`,

 { kpi:'2.1.6', t:'Making gametes', set:{'Offspring sample':16}, click:['Dihybrid F1'], ch:0,
   x:`Because the two genes sit on different chromosomes, they <b>assort independently</b> when gametes form. An <b>RrYy</b> parent makes <b>four</b> types: <b>RY, Ry, rY, ry</b>, each equally likely. Each heterozygous gene <b>doubles</b> the number of gamete types.`,

 { kpi:'2.1.6', t:'The 4 × 4 Punnett square', set:{'Offspring sample':16}, click:['Dihybrid F1'], ch:1,

 { kpi:'2.1.6', t:'The 9 : 3 : 3 : 1 ratio', set:{'Offspring sample':16}, click:['Dihybrid F1'], ch:4,

 { kpi:'1.1.4', t:'ATP: the energy currency', set:{'Electron flow':60}, click:['Mitochondrion','Normal'], ch:1,
   x:`<b>ATP</b> (adenosine triphosphate) stores energy in its <b>third phosphate bond</b>. When it is hydrolysed to <b>ADP + P<sub>i</sub></b> the energy is released for work (muscle contraction, active transport, making molecules). Respiration and photosynthesis use energy to rejoin <b>ADP + P<sub>i</sub> → ATP</b>: the <b>ATP cycle</b>. ATP links energy-releasing and energy-using processes.`,
   go:`Gold ATP spheres leave the synthase. The rate shown in ATP production depends on the electron flow.`,
   ask:[`What does ATP turn into when it releases energy?`,`ADP and inorganic phosphate (Pᵢ).`] },
 { kpi:'1.3.6', t:'Electron transport chain', set:{'Electron flow':80}, click:['Mitochondrion','Normal'], ch:3,
   x:`NADH and FADH₂ from earlier stages donate <b>electrons</b> to protein complexes in the <b>inner mitochondrial membrane</b>. As electrons pass along, energy is released and used to <b>pump H⁺</b> into the intermembrane space. At the end, electrons, H⁺ and <b>oxygen</b> form <b>water</b>. Oxygen is the <b>final electron acceptor</b>.`,

   x:`Pumping builds a <b>higher H⁺ concentration</b> in the intermembrane space than in the matrix. This <b>proton gradient</b> is stored energy, like water behind a dam. It is made at the expense of the energy from the electrons.`,
   go:`Compare the crowd of H⁺ above and below. Read the H⁺ gradient box.`,
   ask:[`Why can H⁺ not simply diffuse back across the membrane?`,`The lipid bilayer is impermeable to ions: they can only pass through channels such as ATP synthase.`] },

   x:`<b>Chemiosmosis</b>: H⁺ flow back down their gradient through <b>ATP synthase</b>. The flow turns a rotor, which changes the enzyme shape so that <b>ADP + P<sub>i</sub> is joined to make ATP</b>. This mechanism makes most of the ATP in aerobic respiration and keeps the cell’s energy supply going.`,
   go:`Watch the orange rotor spin while gold ATP spheres appear below the enzyme.`,

/* ---------- KPI LESSON ENGINE: tab bar, lesson panel, figures, Test Yourself ---------- */
const KPI = (function(){
  const $ = id => document.getElementById(id);
  let lab = null, data = null, tabs = [], cur = 0, seen = {}, qs = [], qi = 0, score = 0, perKpi = {}, figRaf = 0, pending = null, lastLab = null;
  try{ const p = parseInt(new URLSearchParams(window.location.search).get('tab'), 10); if(p > 0) pending = p - 1; }catch(e){}
  const tabsEl = $('kTabs');
  const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bestKey = () => 'biolab-best-' + (lab ? lab.id : '');
  function getBest(){ try{ return localStorage.getItem(bestKey()); }catch(e){ return null; } }
  function setBest(s, n){ try{ const old = parseFloat(localStorage.getItem(bestKey()) || '-1'); if(s/n > old) localStorage.setItem(bestKey(), (s/n).toFixed(3) + '|' + s + '/' + n); }catch(e){} }
  function bestLabel(){ const b = getBest(); return b && b.indexOf('|') > 0 ? 'best ' + b.split('|')[1] : 'Test Yourself'; }

  function build(){
    tabsEl.innerHTML = '';
    tabs.forEach((t, i) => {
      const b = document.createElement('button'); b.className = 'ktab'; b.dataset.i = i; b.setAttribute('role', 'tab');
      b.innerHTML = '<b></b><span></span>'; b.firstChild.textContent = t.kpi; b.lastChild.textContent = t.t;
      b.addEventListener('click', () => setTab(i));
      tabsEl.appendChild(b);
    });
    const q = document.createElement('button'); q.className = 'ktab special'; q.id = 'kQuiz';
    q.innerHTML = '<b>🧠 QUIZ</b><span id="kQuizSub"></span>'; q.addEventListener('click', openQuiz); tabsEl.appendChild(q);
    const a = document.createElement('button'); a.className = 'ktab special'; a.id = 'kAR';
    a.innerHTML = '<b>📷 AR</b><span>See it in 3D</span>'; a.addEventListener('click', () => pillAR.click()); tabsEl.appendChild(a);
    $('kQuizSub').textContent = bestLabel();
  }
  function mark(){
    Array.from(tabsEl.children).forEach((b, i) => {
      if(i < tabs.length){ b.classList.toggle('on', i === cur && !$('quizPanel').classList.contains('open')); b.classList.toggle('seen', !!seen[i]); }
    });
    $('kQuiz').classList.toggle('on', $('quizPanel').classList.contains('open'));
    $('kQuizSub').textContent = bestLabel();
    const on = tabsEl.querySelector('.ktab.on');
    if(on && on.scrollIntoView){ try{ const l = on.offsetLeft - tabsEl.clientWidth/2 + on.clientWidth/2; tabsEl.scrollTo ? tabsEl.scrollTo({left:l, behavior:'smooth'}) : (tabsEl.scrollLeft = l); }catch(e){} }
  }

  /* apply the slider / selector / button presets for a tab */
  function preset(t){
    const wc = $('wsControls');
    (t.click || []).forEach(txt => {
      const b = Array.from(wc.querySelectorAll('button')).find(x => x.textContent.trim() === txt);
      if(b) b.click();
    });
    Object.keys(t.set || {}).forEach(k => {
      const g = Array.from(wc.querySelectorAll('.control-group')).find(g => {
        const l = g.querySelector('label'); return l && l.firstChild && l.firstChild.textContent.trim().toLowerCase().indexOf(k.toLowerCase()) === 0;
      });
      if(!g) return;
      const sel = g.querySelector('select'), inp = g.querySelector('input[type=range]'), v = t.set[k];
      if(sel){ sel.value = v; sel.dispatchEvent(new Event('change')); }
      else if(inp){ inp.value = v; inp.dispatchEvent(new Event('input')); }
    });
  }

  /* energy-profile diagram for the enzyme lab */
  function figLoop(type){
    cancelAnimationFrame(figRaf);
    const c = $('lsFig'); let g = null; try{ g = c.getContext('2d'); }catch(e){}
    if(!g) return;
    const ss = x => x*x*(3-2*x), R = 0.42, P = 0.22;
    const E = (x, h) => R + (P-R)*ss(Math.min(1, Math.max(0, (x-0.42)/0.34))) + h*Math.exp(-Math.pow((x-0.4)/0.13, 2));
    function frame(ts){
      const W = c.width, H = c.height, L = 84, T = 30, gw = W - L - 20, gh = H - T - 66;
      const X = x => L + x*gw, Y = e => T + gh*(1 - e);
      g.clearRect(0, 0, W, H);
      g.strokeStyle = 'rgba(232,245,238,.4)'; g.lineWidth = 2; g.beginPath(); g.moveTo(L, T-6); g.lineTo(L, T+gh); g.lineTo(L+gw+6, T+gh); g.stroke();
      g.fillStyle = '#85a396'; g.font = '22px "IBM Plex Mono", monospace'; g.textAlign = 'center';
      g.fillText('Reaction progress →', L + gw/2, H - 12);
      g.save(); g.translate(26, T + gh/2); g.rotate(-Math.PI/2); g.fillText('Energy →', 0, 0); g.restore();
      function curve(h, col, dash){
        g.beginPath(); for(let i = 0; i <= 120; i++){ const x = i/120; const px = X(x), py = Y(E(x, h)); i ? g.lineTo(px, py) : g.moveTo(px, py); }
        g.strokeStyle = col; g.lineWidth = 5; g.setLineDash(dash || []); g.stroke(); g.setLineDash([]);
      }
      const hNo = 0.40, hEn = 0.17;
      curve(hNo, '#ef6461', type === 'both' ? [8, 6] : null);
      if(type === 'both') curve(hEn, '#2bd6a8');
      const peak = type === 'both' ? hEn : hNo, peakCol = type === 'both' ? '#2bd6a8' : '#ef6461';
      // Ea arrow
      const px = X(0.4), y0 = Y(R), y1 = Y(E(0.4, peak));
      g.strokeStyle = '#f0b94a'; g.lineWidth = 4; g.beginPath(); g.moveTo(px, y0); g.lineTo(px, y1 + 4); g.stroke();
      g.fillStyle = '#f0b94a'; g.beginPath(); g.moveTo(px, y1); g.lineTo(px-6, y1+10); g.lineTo(px+6, y1+10); g.fill();
      g.textAlign = 'left'; g.font = '600 27px "IBM Plex Mono", monospace'; g.fillText('Eₐ', px + 12, (y0 + y1)/2 + 10);
      g.fillStyle = '#e8f5ee'; g.font = '22px "IBM Plex Mono", monospace'; g.textAlign = 'center';
      g.fillText('Reactants', X(0.12), Y(R) + 34); g.fillText('Products', X(0.86), Y(P) + 34);
      // travelling molecule
      const x = ((ts || 0)/3200) % 1.1, xx = Math.min(1, x);

  function render(t){

  /* ----- Test Yourself ----- */
  const FIXED_LAST = /^(all|both|none|neither)\b/i;
  function startQuiz(){
    const pool = shuffle(data.quiz.slice()).slice(0, Math.min(7, data.quiz.length));
    qs = pool.map(r => {
      const opts = r[2].map((o, i) => ({o, ok: i === r[3]}));

  function showQ(){

    const back = document.createElement('button'); back.textContent = '‹ Back to the lesson'; back.addEventListener('click', () => setTab(cur));
    row.appendChild(again); row.appendChild(back); body.appendChild(row);
    mark();
  }
  function openQuiz(){
    if(!data) return;
    closeChallengeModal();
    $('quizPanel').classList.add('open'); cancelAnimationFrame(figRaf); startQuiz(); mark();
  }
  function closeQuiz(silent){ $('quizPanel').classList.remove('open'); if(!silent) { mark(); const t = tabs[cur]; if(t && t.fig) figLoop(t.fig); } }

  function init(l){
    lab = l; data = KPI_LABS[l.id]; cancelAnimationFrame(figRaf);
    document.body.classList.toggle('no-kpi', !data);
    if(!data){ tabs = []; $('kpiBar').style.display = 'none'; $('panelLesson').style.display = 'none'; return; }
    $('kpiBar').style.display = ''; $('panelLesson').style.display = '';
    const same = lastLab === l.id; lastLab = l.id;
    tabs = data.tabs;

  $('kL').addEventListener('click', () => tabsEl.scrollBy ? tabsEl.scrollBy({left: -260, behavior: 'smooth'}) : (tabsEl.scrollLeft -= 260));
  $('kR').addEventListener('click', () => tabsEl.scrollBy ? tabsEl.scrollBy({left: 260, behavior: 'smooth'}) : (tabsEl.scrollLeft += 260));

  $('qzClose').addEventListener('click', () => { closeQuiz(); setTab(cur); });
  document.addEventListener('keydown', e => {
    const tg = (e.target && e.target.tagName) || '';
    if(/INPUT|SELECT|TEXTAREA/.test(tg) && e.target.type !== 'range') return;
    if($('quizPanel').classList.contains('open') || !tabs.length) return;

})();

/* ---------- DATA PANEL: record readings, table, graph, CSV (for lab-report investigations) ---------- */
const DATA = (function(){
  const $ = id => document.getElementById(id);
  let lab = null, cols = [], rows = [];
  const cv = $('dtGraph'), gx = (()=>{ try{ return cv.getContext('2d'); }catch(e){ return null; } })();
  const numOf = s => { const m = String(s).replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
  function snapshot(){
    const cells = [];
    Array.from($('wsControls').querySelectorAll('.control-group')).forEach(g => {
      const l = g.querySelector('label'), sel = g.querySelector('select'), inp = g.querySelector('input[type=range]'), val = g.querySelector('.val');
      if(!l) return;
      const name = l.firstChild.textContent.trim();
      if(sel) cells.push({k: name, v: sel.value, n: NaN});
      else if(inp) cells.push({k: name + ((val && val.textContent.replace(inp.value, '').trim()) ? ' (' + val.textContent.replace(inp.value, '').trim() + ')' : ''), v: inp.value, n: parseFloat(inp.value)});
    });
    Array.from($('measureBody').querySelectorAll('.readout-box')).forEach(b => {
      const l = b.querySelector('.r-label'), v = b.querySelector('.r-value'); if(!l || !v) return;
      cells.push({k: l.textContent.trim(), v: v.textContent.trim(), n: numOf(v.textContent)});
    });
    return cells;
  }
  function record(){
    const s = snapshot(); if(!s.length) return;
    if(!cols.length) cols = s.map(c => c.k);
    rows.push(cols.map(k => { const c = s.find(x => x.k === k); return c ? c : {k, v: '', n: NaN}; }));
    if(rows.length > 60) rows.shift();
    render();
  }
  function render(){
    const tb = $('dtTable'); tb.innerHTML = '';
    if(!rows.length){ tb.innerHTML = '<tr><td style="color:var(--text-dim);padding:8px 0">Press <b>Record</b> to save the current reading. Move a slider, record again, and build up your results.</td></tr>'; draw(); fillSel(); return; }
    const h = document.createElement('tr'); h.innerHTML = '<th>#</th>' + cols.map(c => '<th></th>').join(''); Array.from(h.children).slice(1).forEach((th, i) => th.textContent = cols[i]); tb.appendChild(h);
    rows.forEach((r, i) => { const tr = document.createElement('tr'); tr.innerHTML = '<td>' + (i + 1) + '</td>' + r.map(() => '<td></td>').join(''); Array.from(tr.children).slice(1).forEach((td, j) => td.textContent = r[j].v); tb.appendChild(tr); });
    fillSel(); draw();
    const box = $('dtScroll'); box.scrollTop = box.scrollHeight;
  }
  function numericCols(){ return cols.map((c, j) => ({c, j})).filter(o => rows.some(r => !isNaN(r[o.j].n))); }
  function fillSel(){
    const nc = numericCols(), sx = $('dtX'), sy = $('dtY'), px = sx.value, py = sy.value;
    [sx, sy].forEach(s => { s.innerHTML = ''; nc.forEach(o => { const op = document.createElement('option'); op.value = o.j; op.textContent = o.c; s.appendChild(op); }); });
    if(nc.length){
      sx.value = (px !== '' && nc.some(o => String(o.j) === px)) ? px : String(nc[0].j);
      sy.value = (py !== '' && nc.some(o => String(o.j) === py)) ? py : String(nc[nc.length - 1].j);
    }
  }
  function draw(){
    if(!gx) return;
    const W = cv.width, H = cv.height; gx.clearRect(0, 0, W, H);
    const nc = numericCols(); if(rows.length < 1 || nc.length < 2){ cv.style.display = 'none'; return; } cv.style.display = 'block';
    const xj = +$('dtX').value, yj = +$('dtY').value;
    const pts = rows.map(r => ({x: r[xj].n, y: r[yj].n})).filter(p => !isNaN(p.x) && !isNaN(p.y));
    const L = 44, T = 14, R = 12, B = 32, gw = W - L - R, gh = H - T - B;
    gx.strokeStyle = 'rgba(232,245,238,.35)'; gx.lineWidth = 1.5; gx.beginPath(); gx.moveTo(L, T); gx.lineTo(L, T + gh); gx.lineTo(L + gw, T + gh); gx.stroke();
    gx.fillStyle = '#85a396'; gx.font = '13px "IBM Plex Mono", monospace'; gx.textAlign = 'center';
    gx.fillText($('dtX').selectedOptions[0] ? $('dtX').selectedOptions[0].textContent : '', L + gw/2, H - 6);
    gx.save(); gx.translate(12, T + gh/2); gx.rotate(-Math.PI/2); gx.fillText($('dtY').selectedOptions[0] ? $('dtY').selectedOptions[0].textContent : '', 0, 0); gx.restore();
    if(!pts.length) return;
    let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x)), y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
    if(x1 === x0){ x0 -= 1; x1 += 1; } if(y1 === y0){ y0 -= 1; y1 += 1; }
    const px = v => L + (v - x0) / (x1 - x0) * gw, py = v => T + gh - (v - y0) / (y1 - y0) * gh;
    gx.textAlign = 'right'; gx.fillText(String(+y1.toFixed(1)), L - 4, T + 10); gx.fillText(String(+y0.toFixed(1)), L - 4, T + gh);
    gx.textAlign = 'center'; gx.fillText(String(+x0.toFixed(1)), L, T + gh + 14); gx.fillText(String(+x1.toFixed(1)), L + gw, T + gh + 14);
    const sorted = pts.slice().sort((a, b) => a.x - b.x);
    gx.strokeStyle = 'rgba(240,185,74,.7)'; gx.lineWidth = 2; gx.beginPath(); sorted.forEach((p, i) => i ? gx.lineTo(px(p.x), py(p.y)) : gx.moveTo(px(p.x), py(p.y))); gx.stroke();
    gx.fillStyle = '#2bd6a8'; pts.forEach(p => { gx.beginPath(); gx.arc(px(p.x), py(p.y), 5, 0, 6.2832); gx.fill(); });
  }
  function csv(){
    const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
    return [['Reading'].concat(cols).map(esc).join(',')].concat(rows.map((r, i) => [i + 1].concat(r.map(c => c.v)).map(esc).join(','))).join('\n');
  }
  function toast(t){ const m = $('dtMsg'); m.textContent = t; setTimeout(() => { if(m.textContent === t) m.textContent = ''; }, 2200); }
  $('dtRec').addEventListener('click', record);
  $('dtClear').addEventListener('click', () => { rows = []; cols = []; render(); });
  $('dtDown').addEventListener('click', () => {
    if(!rows.length){ toast('Nothing recorded yet.'); return; }
    try{ const a = document.createElement('a'); a.download = 'biolab-' + (lab ? lab.id : 'data') + '.csv'; a.href = URL.createObjectURL(new Blob([csv()], {type: 'text/csv'})); document.body.appendChild(a); a.click(); document.body.removeChild(a); toast('CSV saved.'); }catch(e){ toast('Download not available.'); }
  });
  $('dtCopy').addEventListener('click', () => {
    if(!rows.length){ toast('Nothing recorded yet.'); return; }
    const tsv = csv().split('\n').map(l => l.replace(/","/g, '\t').replace(/^"|"$/g, '')).join('\n');
    try{ navigator.clipboard.writeText(tsv).then(() => toast('Copied. Paste into Sheets or Excel.'), () => toast('Copy blocked: use CSV.')); }catch(e){ toast('Copy blocked: use CSV.'); }
  });
  $('dtX').addEventListener('change', draw); $('dtY').addEventListener('change', draw);
  return {init(l){ lab = l; cols = []; rows = []; render(); }, rows: () => rows, cols: () => cols, record};
})();

/* ---------- FEEDBACK: optional sound effects + confetti ---------- */
const SFX = (function(){
  let on = false, ac = null;
  try{ on = localStorage.getItem('biolab-sound') === '1'; }catch(e){}
  function beep(freqs, dur, type, gain){
    if(!on) return;
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ac.currentTime;
      freqs.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * dur;
        o.type = type || 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain || 0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.03);
      });
    }catch(e){}
  }
  const api = {
    ok(){ beep([523, 659, 784], 0.11, 'sine'); },
    bad(){ beep([220, 185], 0.15, 'triangle', 0.1); },
    win(){ beep([523, 659, 784, 1047], 0.12, 'sine'); },
    toggle(){ on = !on; try{ localStorage.setItem('biolab-sound', on ? '1' : '0'); }catch(e){} if(on) beep([660], 0.1); return on; },
    isOn: () => on
  };
  const btn = document.getElementById('btnSound');
  if(btn){
    const paint = () => { btn.classList.toggle('on', on); btn.title = on ? 'Sound effects: ON (click to mute)' : 'Sound effects: OFF (click to turn on)'; };
    paint(); btn.addEventListener('click', () => { api.toggle(); paint(); });
  }
  return api;
})();
function confetti(n){
  try{
    let c = document.getElementById('fx');
    if(!c){ c = document.createElement('canvas'); c.id = 'fx'; c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:950;pointer-events:none'; document.body.appendChild(c); }
    c.width = window.innerWidth; c.height = window.innerHeight;
    const g = c.getContext('2d'); if(!g) return;
    const cols = ['#2bd6a8', '#f0b94a', '#9c8ff2', '#ef6461', '#5eb8ff'];
    const ps = Array.from({length: n || 60}, () => ({x: c.width/2 + (Math.random()-0.5)*160, y: c.height*0.55, vx: (Math.random()-0.5)*14, vy: -8 - Math.random()*10, r: 3 + Math.random()*4, c: cols[Math.floor(Math.random()*cols.length)], rot: Math.random()*6}));
    const t0 = performance.now();
    (function f(t){
      const k = (t - t0) / 1800; g.clearRect(0, 0, c.width, c.height);
      if(k >= 1) return;
      ps.forEach(p => { p.vy += 0.38; p.x += p.vx; p.y += p.vy; p.rot += 0.2; g.save(); g.globalAlpha = 1 - k; g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c; g.fillRect(-p.r, -p.r/2, p.r*2, p.r); g.restore(); });
      requestAnimationFrame(f);
    })(t0);
  }catch(e){}
}
