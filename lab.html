<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BIOLAB | Simulation</title>
<meta name="theme-color" content="#071310">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071310; --panel:rgba(10,26,20,0.74); --panel-solid:#0e1f19; --panel-2:#122a22; --line:rgba(232,255,244,0.14);
    --text:#e8f5ee; --text-dim:#85a396; --lw:330px; --rw:340px; --teal:#2bd6a8; --amber:#f0b94a; --coral:#ef6461; --violet:#9c8ff2; --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{background:radial-gradient(ellipse at 50% 38%, #12352b 0%, #0a1d17 45%, #050f0c 100%); color:var(--text); font-family:'Inter',sans-serif; line-height:1.5;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--teal); color:var(--bg);}

  /* the 3D scene fills the whole screen */
  #canvasWrap{position:fixed; inset:0; z-index:0;}
  #canvasWrap canvas{width:100%; height:100%; display:block; cursor:grab;}
  #canvasWrap canvas:active{cursor:grabbing;}

  /* glass panels */
  .hud{position:fixed; z-index:20; pointer-events:none;}
  .hud > *{pointer-events:auto;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:0 18px 50px rgba(0,0,0,.35);}
  .ph{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 16px 9px; cursor:pointer; user-select:none; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--text-dim);}
  .ph svg{width:12px; height:12px; transition:transform .2s; flex:none;}
  .panel.collapsed .ph svg{transform:rotate(-90deg);}
  .panel.collapsed .pb{display:none;}
  .pb{padding:4px 16px 16px;}

  /* top-left: brand + lab switcher */
  #hudTL{top:14px; left:14px; width:var(--lw); display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 28px - 66px); overflow-y:auto; scrollbar-width:thin;}
  .brand{padding:14px 18px; display:flex; flex-direction:column; gap:8px;}
  .back{display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber);}
  .back:hover{color:var(--teal);}
  .back .dot{width:8px; height:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px var(--teal);}
  .ws-title{font-size:21px; font-weight:700; letter-spacing:-0.01em; line-height:1.15;}
  .status-pill{display:inline-flex; align-items:center; gap:7px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); align-self:flex-start;}
  .status-pill .led{width:7px; height:7px; border-radius:50%; background:var(--text-dim);}
  .status-pill.on{color:var(--teal);} .status-pill.on .led{background:var(--teal); box-shadow:0 0 6px var(--teal);}
  .switch{display:flex; gap:8px; align-items:center; margin-top:2px;}
  .switch select{flex:1; min-width:0; background:rgba(0,0,0,.25); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .icon-btn{width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s; flex:none;}
  .icon-btn:hover{color:var(--amber); border-color:var(--amber);}
  .icon-btn svg{width:15px; height:15px;}

  /* top-centre: toolbar */
  #hudTC{top:14px; left:calc(var(--lw) + 42px); right:calc(var(--rw) + 34px); display:flex; flex-direction:column; align-items:center; gap:10px;}
  .ws-toolbar{display:flex; gap:8px; align-items:center; justify-content:center; padding:10px 12px; flex-wrap:wrap;}
  .pill{display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.07em; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--text-dim); cursor:pointer; transition:.2s; white-space:nowrap;}
  .pill svg{width:14px; height:14px; flex:none;}
  .pill:hover{color:var(--text); border-color:rgba(232,255,244,.35);}
  .pill-status{cursor:default; color:var(--teal); border-color:rgba(43,214,168,.5); max-width:240px; overflow:hidden; text-overflow:ellipsis;}
  .pill-status .pill-dot{width:8px; height:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 6px var(--teal); flex:none;}
  .pill-challenge{background:var(--amber); color:#1a1304; border-color:var(--amber); font-weight:600;} .pill-challenge:hover{filter:brightness(1.08); color:#1a1304;}
  .pill-challenge.on{box-shadow:0 0 0 3px rgba(240,185,74,.3);}
  .pill-ar{color:#c7beff; border-color:rgba(156,143,242,.6);} .pill-ar:hover{background:rgba(156,143,242,.16); color:#fff;}
  .pill-reset:hover{color:var(--teal); border-color:var(--teal);}

  /* top-right: measurements + challenge */
  #hudRight{top:14px; right:14px; width:var(--rw); max-height:calc(100vh - 28px); display:flex; flex-direction:column; gap:12px; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; padding-bottom:2px;}
  #measureBody{display:flex; flex-direction:column; gap:8px;}
  #measureBody .readout-box{background:rgba(255,255,255,.045); border:1px solid transparent; border-radius:10px; padding:9px 12px; display:flex; flex-direction:row; justify-content:space-between; align-items:center; gap:12px;}
  #measureBody .r-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; color:var(--text-dim); letter-spacing:.06em;}
  #measureBody .r-value{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; color:var(--amber); text-align:right;}
  #measureBody canvas{display:block;}

  /* challenge drawer (inside the right column, never over the scene centre) */
  .challenge-panel{display:none; padding:14px 16px 16px;}
  .cm-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cm-title{display:flex; align-items:center; gap:9px; font-family:'IBM Plex Mono',monospace; letter-spacing:.16em; text-transform:uppercase; font-size:11px; color:var(--amber); font-weight:600;}
  .cm-title svg{width:16px; height:16px;}
  .cm-close{background:none; border:none; color:var(--text-dim); font-size:24px; cursor:pointer; line-height:1; padding:0;} .cm-close:hover{color:var(--text);}
  .cm-nav{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .cm-arrow{background:transparent; border:1px solid var(--line); color:var(--text-dim); width:34px; height:34px; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s; flex-shrink:0;}
  .cm-arrow:hover{border-color:var(--amber); color:var(--amber);}
  .cm-variant{flex:1; text-align:center; border:1px solid var(--line); border-radius:9px; padding:6px 10px; display:flex; flex-direction:column; gap:1px; min-width:0;}
  .cm-variant #cmVariantTitle{font-weight:600; font-size:13px; color:var(--amber); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cm-variant #cmCounter{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-dim); letter-spacing:.06em;}
  .cm-body{background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--text-dim); line-height:1.65; margin-bottom:12px;}
  .cm-body b{color:var(--text);}
  .cm-answer-row{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .cm-answer-row label{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim); width:100%;}
  .cm-answer-row input{flex:1; min-width:100px; background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:9px; padding:9px 11px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:14px;}
  .cm-answer-row input:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .cm-check{background:var(--teal); color:#04100c; border:none; border-radius:9px; padding:9px 16px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; cursor:pointer;} .cm-check:hover{filter:brightness(1.1);}
  .cm-feedback{font-family:'IBM Plex Mono',monospace; font-size:12.5px; min-height:16px; margin-bottom:10px;}
  .cm-feedback.correct{color:var(--teal);} .cm-feedback.incorrect{color:var(--coral);}
  .cm-footer{display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding-top:12px; flex-wrap:wrap;}
  .cm-reroll{display:inline-flex; align-items:center; gap:7px; background:transparent; border:1px solid var(--amber); color:var(--amber); border-radius:999px; padding:8px 14px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; cursor:pointer; transition:.2s;} .cm-reroll:hover{background:var(--amber); color:#04100c;}
  .cm-qr{display:flex; flex-direction:column; align-items:center; gap:3px;}
  .cm-qr img{background:#fff; padding:4px; border-radius:6px; cursor:zoom-in; transition:transform .15s;} .cm-qr img:hover{transform:scale(1.06);}
  .cm-qr span{font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--text-dim); text-transform:uppercase;}

  /* bottom: controls + view/hand */
  #hudBottom{left:calc(var(--lw) + 42px); right:calc(var(--rw) + 34px); bottom:14px; display:flex; justify-content:center;}
  #panelControls{flex:1 1 auto; max-width:760px; min-width:0;}
  #wsControls{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px 22px; align-items:end;}
  .control-group label{display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .control-group label .val{color:var(--teal);}
  input[type=range]{width:100%; accent-color:var(--teal); background:transparent; margin:2px 0;}
  select{width:100%; background:rgba(0,0,0,.3); color:var(--text); border:1px solid var(--line); padding:8px 10px; border-radius:9px; font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .toggle-btns{display:flex; gap:6px;}
  .toggle-btns button{flex:1; background:rgba(0,0,0,.28); color:var(--text-dim); border:1px solid var(--line); padding:8px 6px; border-radius:9px; cursor:pointer; transition:.2s; font-family:'IBM Plex Mono',monospace; font-size:11.5px;}
  .toggle-btns button.on{background:var(--teal); color:#04100c; border-color:var(--teal); font-weight:600;}
  .btn-primary{font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; background:var(--teal); color:#04100c; border:none; padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:600; transition:filter .2s; width:100%;}
  .btn-primary:hover{filter:brightness(1.1);}
  .vrow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .vbtn{flex:1; background:rgba(0,0,0,.28); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:7px 10px; font-family:'IBM Plex Mono',monospace; font-size:11px; cursor:pointer; transition:.2s; white-space:nowrap;}
  .vbtn:hover{border-color:var(--teal); color:var(--teal);}
  .vctl{display:grid; grid-template-columns:1fr auto; gap:8px 14px; align-items:center; margin-bottom:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); text-transform:uppercase;}
  .vctl input[type=checkbox]{accent-color:var(--teal); width:16px; height:16px;}
  #viewExtra{display:flex; flex-direction:column; gap:8px;}
  #viewExtra .readout-box{background:transparent; border:none; padding:0;}
  #viewExtra .readout-box .r-label{display:none;}
  #viewExtra .readout-box .r-value{font-family:'Inter',sans-serif; font-size:11.5px; font-weight:400; line-height:1.5; color:var(--text-dim);}

  /* bottom-left QR + hide-UI buttons */
  #hudBL{left:14px; bottom:14px; display:flex; flex-direction:row; gap:10px;}
  #hudBL .icon-btn{width:42px; height:42px; background:var(--panel); backdrop-filter:blur(16px); border-radius:13px;}
  #hudBL .icon-btn svg{width:19px; height:19px;}
  #btnShowUI{display:none;}
  body.ui-hidden .hud:not(#hudBL){display:none;}
  body.ui-hidden #hudBL .icon-btn:not(#btnShowUI){display:none;}
  body.ui-hidden #btnShowUI{display:flex;}


  /* ===== KPI tab bar (lesson mode) ===== */
  .kpibar{display:flex; align-items:center; gap:6px; padding:7px 8px; max-width:100%; width:100%;}
  .ktabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; scroll-behavior:smooth; flex:1; min-width:0;}
  .ktabs::-webkit-scrollbar{display:none;}
  .ktab{flex:none; display:flex; flex-direction:column; align-items:flex-start; padding:6px 12px 7px; border-radius:12px; border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--text-dim); cursor:pointer; transition:.18s; text-align:left; line-height:1.15;}
  .ktab b{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--amber);}
  .ktab span{font-family:'Inter',sans-serif; font-size:12px; white-space:nowrap; margin-top:1px;}
  .ktab:hover{border-color:rgba(232,255,244,.4); color:var(--text);}
  .ktab.on{background:var(--amber); border-color:var(--amber); color:#1a1304; box-shadow:0 0 0 3px rgba(240,185,74,.22);}
  .ktab.on b{color:#1a1304;}
  .ktab.seen b::after{content:' \2713'; color:var(--teal);} .ktab.on.seen b::after{color:#1a1304;}
  .ktab.special b{color:#c7beff;} .ktab.special{border-color:rgba(156,143,242,.5);}
  .ktab.special.on{background:#9c8ff2; border-color:#9c8ff2; color:#10092e;} .ktab.special.on b{color:#10092e;}
  .kscroll{flex:none; width:28px; height:34px; border-radius:9px; border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--text-dim); cursor:pointer; font-size:18px; line-height:1; padding:0;} .kscroll:hover{color:var(--amber); border-color:var(--amber);}

  /* ===== lesson panel ===== */
  #panelLesson .pb{padding-top:2px;}
  .ls-top{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .ls-kpi{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:#1a1304; background:var(--amber); border-radius:8px; padding:3px 9px;}
  .ls-course{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:var(--text-dim); border:1px solid var(--line); border-radius:8px; padding:2px 8px;}
  .ls-big{margin-left:auto; border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--text-dim); border-radius:8px; padding:3px 9px; font-family:'IBM Plex Mono',monospace; font-size:11px; cursor:pointer;} .ls-big:hover,.ls-big.on{color:var(--amber); border-color:var(--amber);}
  #lsTitle{font-size:19px; font-weight:700; letter-spacing:-.01em; margin:2px 0 8px; line-height:1.2;}
  .ls-outcome{font-size:11.5px; line-height:1.5; color:var(--text-dim); border-left:3px solid var(--amber); padding:2px 0 2px 10px; margin-bottom:10px; font-style:italic;}
  .ls-outcome small{display:block; font-style:normal; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); margin-bottom:2px;}
  #lsFig{display:none; width:100%; height:auto; border-radius:10px; background:rgba(0,0,0,.28); border:1px solid var(--line); margin-bottom:10px;}
  .ls-x{font-size:13.5px; line-height:1.6; color:var(--text);}
  .ls-x b{color:var(--teal); font-weight:600;}
  .kt{border-collapse:collapse; width:100%; margin:4px 0 8px; font-size:12px;}
  .kt th,.kt td{border:1px solid var(--line); padding:4px 7px; text-align:left;} .kt th{color:var(--amber); font-weight:600; background:rgba(0,0,0,.2);}
  .ls-go,.ls-ask{margin-top:10px; border-radius:10px; padding:9px 12px; font-size:12.5px; line-height:1.55;}
  .ls-go{background:rgba(43,214,168,.09); border:1px solid rgba(43,214,168,.3); color:var(--text);}
  .ls-ask{background:rgba(156,143,242,.1); border:1px solid rgba(156,143,242,.35); color:var(--text);}
  .ls-go small,.ls-ask small{display:block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; margin-bottom:2px;}
  .ls-go small{color:var(--teal);} .ls-ask small{color:#c7beff;}
  .ls-reveal{margin-top:6px; background:transparent; border:1px solid #9c8ff2; color:#c7beff; border-radius:999px; padding:4px 12px; font-family:'IBM Plex Mono',monospace; font-size:11px; cursor:pointer;} .ls-reveal:hover{background:#9c8ff2; color:#10092e;}
  #lsAns{display:none; margin-top:6px; color:var(--teal);} #lsAns.show{display:block;}
  .ls-nav{display:flex; gap:6px; margin:2px 0 12px; align-items:center;}
  .ls-nav button{flex:1; border:1px solid var(--line); background:rgba(0,0,0,.28); color:var(--text); border-radius:999px; padding:7px 8px; font-family:'IBM Plex Mono',monospace; font-size:11px; cursor:pointer; white-space:nowrap;} .ls-nav button:hover{border-color:var(--teal); color:var(--teal);}
  .ls-nav .ls-ch{background:var(--amber); color:#1a1304; border-color:var(--amber); font-weight:600; flex:1.6;} .ls-nav .ls-ch:hover{filter:brightness(1.08); color:#1a1304;}
  /* class view: bigger text for the projector */
  body.cls{--lw:460px;}
  body.cls .ls-x{font-size:17px;} body.cls #lsTitle{font-size:25px;} body.cls .ls-outcome{font-size:14px;} body.cls .ls-go,body.cls .ls-ask{font-size:15px;} body.cls .kt{font-size:14px;}
  body.cls .ktab span{font-size:14px;} body.cls .ktab b{font-size:12.5px;}

  /* ===== Test Yourself ===== */
  #quizPanel{position:fixed; z-index:40; left:50%; top:152px; bottom:170px; width:min(780px, calc(100vw - var(--lw) - var(--rw) - 90px)); min-width:430px; transform:translateX(-50%); display:none; flex-direction:column; overflow:hidden;}
  #quizPanel.open{display:flex;}
  .qz-head{display:flex; align-items:center; gap:10px; padding:14px 18px 8px;}
  .qz-head h3{font-size:18px; flex:1;}
  .qz-x{background:none; border:none; color:var(--text-dim); font-size:26px; line-height:1; cursor:pointer;} .qz-x:hover{color:var(--text);}
  .qz-bar{height:4px; background:rgba(255,255,255,.08); margin:0 18px; border-radius:2px; overflow:hidden;} .qz-bar i{display:block; height:100%; width:0; background:#9c8ff2; transition:width .25s;}
  .qz-body{padding:14px 18px 18px; overflow-y:auto; flex:1;}
  .qz-q{font-size:17px; font-weight:600; line-height:1.4; margin:6px 0 14px;}
  .qz-tag{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--amber); color:#1a1304; border-radius:7px; padding:2px 8px; font-weight:600;}
  .qz-opt{display:flex; gap:10px; width:100%; text-align:left; margin-bottom:8px; background:rgba(0,0,0,.28); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:11px 14px; font-family:'Inter',sans-serif; font-size:14.5px; cursor:pointer; transition:.15s;}
  .qz-opt i{font-style:normal; font-family:'IBM Plex Mono',monospace; color:#c7beff; flex:none;}
  .qz-opt:hover:not(:disabled){border-color:#9c8ff2;}
  .qz-opt.ok{background:rgba(43,214,168,.18); border-color:var(--teal);} .qz-opt.bad{background:rgba(239,100,97,.16); border-color:var(--coral);}
  .qz-opt:disabled{cursor:default;}
  .qz-exp{margin-top:10px; padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.05); font-size:13.5px; line-height:1.55; display:none;} .qz-exp.show{display:block;}
  .qz-next{margin-top:12px; background:#9c8ff2; color:#10092e; border:none; border-radius:999px; padding:9px 22px; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; cursor:pointer; display:none;} .qz-next.show{display:inline-block;}
  .qz-score{font-family:'Space Grotesk',sans-serif; font-size:44px; font-weight:700; color:var(--amber); margin:4px 0;}
  .qz-chips{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 14px;}
  .qz-chip{font-family:'IBM Plex Mono',monospace; font-size:12px; border-radius:999px; padding:5px 12px; border:1px solid var(--line); background:rgba(0,0,0,.28); cursor:pointer;}
  .qz-chip.good{border-color:var(--teal); color:var(--teal);} .qz-chip.weak{border-color:var(--coral); color:var(--coral);} .qz-chip:hover{filter:brightness(1.2);}
  .qz-row{display:flex; gap:8px; flex-wrap:wrap;}
  .qz-row button{border:1px solid var(--line); background:rgba(0,0,0,.28); color:var(--text); border-radius:999px; padding:8px 16px; font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;} .qz-row button:hover{border-color:var(--teal); color:var(--teal);}

  /* QR lightbox */
  .qr-lightbox{position:fixed; inset:0; z-index:900; background:rgba(3,8,6,0.92); display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;}
  .qr-lightbox .qr-box{background:#fff; border-radius:16px; padding:26px 26px 18px; display:flex; flex-direction:column; align-items:center; gap:12px; max-width:min(90vw,520px); cursor:default;}
  .qr-lightbox img{width:min(70vw,420px); height:auto; display:block;}
  .qr-lightbox .qr-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:#0e1f19; text-align:center;}
  .qr-lightbox .qr-url{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#4a5a52; text-align:center; word-break:break-all; max-width:420px;}
  .qr-lightbox .qr-hint{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:14px;}

  /* medium screens */
  @media (max-width:1280px){
    :root{--lw:300px; --rw:300px;} .pill{padding:7px 11px;} .pill-status{display:none;}
  }
  #dock{display:none;}
  #dock > *{flex:none;}
  /* tablets / phones: everything docks at the bottom, scene stays on top */
  @media (max-width:900px){
    #hudTL{top:8px; left:8px; right:8px; width:auto; max-height:46vh;}
    .brand{padding:10px 14px; gap:5px;} .ws-title{font-size:17px;} .switch{display:none;}
    .back{font-size:9.5px;}
    #hudTC,#hudRight,#hudBottom{display:none;}
    #quizPanel{left:8px !important; right:8px !important; top:56px !important; bottom:8px !important; width:auto !important; min-width:0 !important; transform:none !important;}
    #dock .kpibar{flex:none;}
    #dock{display:flex; flex-direction:column; gap:8px; left:8px; right:8px; bottom:8px; max-height:50vh; overflow-y:auto; scrollbar-width:none;}
    #dock .ws-toolbar{flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; padding:8px 10px; scrollbar-width:none;}

    #hudTL .brand{padding-right:140px;}
    .pb{padding:2px 14px 12px;}
    #wsControls{grid-template-columns:1fr 1fr; gap:10px 16px;}
  }
</style>

<script>

/* ---------- WORKSPACE ENGINE ---------- */
const wsPanel = document.documentElement;
const wsTitle = document.getElementById('wsTitle');
const wsStatus = document.getElementById('wsStatus');
const wsStatusText = document.getElementById('wsStatusText');
const canvasWrap = document.getElementById('canvasWrap');
const wsControls = document.getElementById('wsControls');
const wsToolbar = document.getElementById('wsToolbar');
const pillStatusText = document.getElementById('pillStatusText');
const pillChallenge = document.getElementById('pillChallenge');
const pillAR = document.getElementById('pillAR');
const pillReset = document.getElementById('pillReset');
let activeCleanup = null;
let activeCard = null;
let activeLab = null;
let statusObserver = null;
let lastSize = [0,0];
function arrangePanels(){
  const meas = document.getElementById('measureBody'), extra = document.getElementById('viewExtra');
  Array.from(wsControls.children).forEach(el => {
    const role = el.dataset ? el.dataset.role : '';
    if(role === 'hint' || role === 'hand' || role === 'handmsg') extra.appendChild(el);
    else if(role === 'graph' || el.classList.contains('readout-box')) meas.appendChild(el);
  });
  const mp = document.getElementById('panelMeasure'); mp.style.display = meas.children.length ? '' : 'none';
}
function syncViewPanel(){
  const v = window.activeView, z = document.getElementById('zoomSlider');
  if(v){ z.value = v.zoom || 1; document.getElementById('autoRot').checked = !v.still; }
}

function setStatus(active, text){
  wsStatus.classList.toggle('on', active);
  wsStatusText.textContent = text;
}

function labURL(labId){
  const u = new URL(window.location.href); u.hash = ''; u.search = '?lab=' + labId;
  return u.toString();
}

function loadLab(lab, cardEl, updateHash){
  if(activeCleanup) activeCleanup();
  if(statusObserver) statusObserver.disconnect();
  if(activeCard) activeCard.classList.remove('active');
  activeCard = cardEl; if(cardEl) cardEl.classList.add('active');
  activeLab = lab;
  if(lab.defaults && lab.state) Object.assign(lab.state, lab.defaults); // textbook values outside Challenge Mode

  document.getElementById('challengeOverlay').style.display = 'none';
  pillChallenge.classList.remove('on');
  wsTitle.textContent = lab.title;
  setStatus(true, 'Active — ' + lab.tag);
  wsToolbar.style.display = 'flex';
  pillAR.classList.remove('on');
  const cw = Math.max(320, Math.min(1920, canvasWrap.clientWidth || 1280)), ch = Math.max(320, Math.min(1200, canvasWrap.clientHeight || 720));
  lastSize = [cw, ch];
  canvasWrap.innerHTML = '<canvas id="mainCanvas" width="' + cw + '" height="' + ch + '"></canvas>';
  ['wsControls','measureBody','viewExtra'].forEach(id => document.getElementById(id).innerHTML = '');
  window.activeView = null;
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');
  activeCleanup = lab.setup(ctx, canvas, wsControls, lab) || function(){};
  arrangePanels();

  // mirror the lab's readout value into the status pill
  const readoutEl = document.querySelector('#measureBody .readout-box .r-value');
  if(readoutEl){
    pillStatusText.textContent = readoutEl.textContent;
    statusObserver = new MutationObserver(() => { pillStatusText.textContent = readoutEl.textContent; });
    statusObserver.observe(readoutEl, {childList:true, characterData:true, subtree:true});
  } else {
    pillStatusText.textContent = lab.tag.split('·')[0].trim();
  }

  if(updateHash !== false){
    try { history.replaceState(null, '', '#lab-' + lab.id); } catch(e){ /* sandboxed preview: URL updates aren't allowed here */ }
  }
  syncViewPanel();
  if(window.KPI_READY) KPI.init(lab);
}

pillChallenge.addEventListener('click', () => {
  if(!activeLab) return;
  if(challengePanel.style.display === 'block'){ closeChallengeModal(); }
  else { openChallengeModal(activeLab); }
});

pillAR.addEventListener('click', () => {
  const target = 'ar.html?lab=' + encodeURIComponent(activeLab ? activeLab.id : 'dna');
  window.open(target, '_blank');
});

pillReset.addEventListener('click', () => {
  if(activeLab) loadLab(activeLab, activeCard, false);
});

document.getElementById('btnFullscreen').addEventListener('click', () => {
  if(!document.fullscreenElement){
    (wsPanel.requestFullscreen ? wsPanel.requestFullscreen() : Promise.resolve()).catch(()=>{});
  } else {
    document.exitFullscreen();
  }
});

/* Helper: build a slider control */
function makeSlider(container, {label, min, max, step, value, unit, onChange}){
  const group = document.createElement('div');
  group.className = 'control-group';
  group.innerHTML = `<label>${label}<span class="val">${value}${unit||''}</span></label>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${value}">`;
  const input = group.querySelector('input');
  const valSpan = group.querySelector('.val');
  input.addEventListener('input', () => {
    valSpan.textContent = input.value + (unit||'');
    onChange(parseFloat(input.value));
  });
  container.appendChild(group);
  return input;
}
function makeReadout(container, label, initial){
  const box = document.createElement('div');
  box.className = 'readout-box';
  box.innerHTML = `<span class="r-label">${label}</span><span class="r-value">${initial}</span>`;
  container.appendChild(box);
  return box.querySelector('.r-value');
}
function makeToggle(container, options, onChange){
  const wrap = document.createElement('div');
  wrap.className = 'toggle-btns';
  options.forEach((opt,i) => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    if(i===0) btn.classList.add('on');
    btn.addEventListener('click', () => {
      wrap.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      onChange(opt, i);
    });
    wrap.appendChild(btn);
  });
  container.appendChild(wrap);
  return wrap;
}
function makeButton(container, text, onClick){
  const btn = document.createElement('button');
  btn.className = 'btn-primary';
  btn.textContent = text;
  btn.addEventListener('click', onClick);
  container.appendChild(btn);
  return btn;
}

function kBase(canvas){ return Math.min(canvas.height*0.17, canvas.width*0.14); }
function drawFloor(ctx, view, W, H, K){
  const y = -2.15, e = 4.2, st = 0.7;
  ctx.strokeStyle = 'rgba(43,214,168,0.10)'; ctx.lineWidth = 1; ctx.beginPath();
  for(let v=-e; v<=e+0.01; v+=st){
    const a = project3(view,W,H,K,[-e,y,v]), b = project3(view,W,H,K,[e,y,v]);
    const c = project3(view,W,H,K,[v,y,-e]), d = project3(view,W,H,K,[v,y,e]);
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.moveTo(c.x,c.y); ctx.lineTo(d.x,d.y);
  }
  ctx.stroke();
}
function makeGraph(controls){
  const c = document.createElement('canvas'); c.width = 320; c.height = 130; c.dataset.role = 'graph';
  c.style.cssText = 'width:100%; height:auto; background:rgba(4,16,12,.55); border:1px solid var(--line); border-radius:10px; margin-top:6px;';
  controls.appendChild(c); return c;
}
/* ---------- tiny 3D scene toolkit (painter's algorithm on a 2D canvas) ---------- */
function make3(ctx, canvas, view, K0){
  const W = canvas.width, H = canvas.height; let q = [];
  const K = () => K0*(view.zoom||1);
  const P = p => project3(view, W, H, K(), p);
  const api = {
    P, W, H,
    begin(){ q = []; ctx.clearRect(0,0,W,H); drawFloor(ctx,view,W,H,K()); },
    sphere(p,r,c1,c2){ const s=P(p); q.push({z:s.z, f:()=>ball3(ctx,s.x,s.y,Math.max(1,r*K()*s.s),c1,c2||c1)}); },
    glass(p,r,fill,stroke){ const s=P(p); q.push({z:s.z, f(){ ctx.beginPath(); ctx.arc(s.x,s.y,r*K()*s.s,0,6.2832); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke(); }}); },
    line(a,b,col,w,dash){ const A=P(a), B=P(b); q.push({z:(A.z+B.z)/2, f(){ if(dash) ctx.setLineDash(dash); ctx.strokeStyle=col; ctx.lineWidth=w||1.5; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); if(dash) ctx.setLineDash([]); }}); },
    poly(pts,o){ const Q=pts.map(P); const z=Q.reduce((s,a)=>s+a.z,0)/Q.length; q.push({z, f(){ ctx.beginPath(); Q.forEach((a,i)=>i?ctx.lineTo(a.x,a.y):ctx.moveTo(a.x,a.y)); if(o.close) ctx.closePath(); if(o.fill){ctx.fillStyle=o.fill; ctx.fill();} if(o.stroke){ctx.strokeStyle=o.stroke; ctx.lineWidth=o.w||1.5; ctx.stroke();} }}); },
    wire(c,rx,ry,rz,col,n){ n=n||5;
      const ring=(fn)=>{ const pts=[]; for(let i=0;i<=28;i++) pts.push(fn(i/28*Math.PI*2)); api.poly(pts,{stroke:col,w:1}); };
      for(let k=1;k<=n;k++){ const ph=k/(n+1)*Math.PI, y=Math.cos(ph), rr=Math.sin(ph); ring(t=>[c[0]+rx*rr*Math.cos(t), c[1]+ry*y, c[2]+rz*rr*Math.sin(t)]); }
      for(let k=0;k<n+1;k++){ const th=k/(n+1)*Math.PI; ring(t=>[c[0]+rx*Math.sin(t)*Math.cos(th), c[1]+ry*Math.cos(t), c[2]+rz*Math.sin(t)*Math.sin(th)]); } },
    box(c,sx,sy,sz,fill,stroke){ const h=[sx/2,sy/2,sz/2], v=i=>[c[0]+(i&1?h[0]:-h[0]), c[1]+(i&2?h[1]:-h[1]), c[2]+(i&4?h[2]:-h[2])];
      [[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]].forEach(f=>api.poly(f.map(v),{fill,stroke,close:true,w:1})); },
    text(p,str,col,size){ const s=P(p); q.push({z:s.z-0.01, f(){ ctx.font=(size||12)+'px "IBM Plex Mono", monospace'; ctx.fillStyle=col||'#e8f5ee'; ctx.textAlign='center'; ctx.fillText(str,s.x,s.y); ctx.textAlign='left'; }}); },
    caption(str,col,y){ q.push({z:-99, f(){ ctx.font='12px "IBM Plex Mono", monospace'; ctx.fillStyle=col||'rgba(232,245,238,0.7)'; ctx.textAlign='center'; ctx.fillText(str,W/2,y||H-128); ctx.textAlign='left'; }}); },
    end(){ q.sort((a,b)=>b.z-a.z); q.forEach(i=>i.f()); drawHand3(ctx,view,W,H); }
  };
  return api;
}
const sph3 = (r,th,ph) => [r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(th)];
const rnd3 = () => Math.random()*2-1;

/* ---------- LAB 1: CELL MEMBRANE TRANSPORT (3D) ---------- */
function labMembrane(ctx, canvas, controls, lab){
  const view = {yaw:0.5, pitch:0.3, expand:0.5, hand:null, zoom:1};
  let tonicity = 50, radius = 100, particles = [], raf;
  const readout = makeReadout(controls, 'Cell Status', 'Stable — Isotonic');
  const slider = makeSlider(controls, {label:'External Solute Concentration', min:0, max:100, step:1, value:50, unit:'%', onChange:v=>{ tonicity=v; view.expand=v/100; }});
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or two-finger pinch to change the outside concentration · or use your hand with the camera.',
    'Show one hand. Open fingers wide = MORE solute outside · fist = LESS · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  const solutes = Array.from({length:10}, () => ({th:Math.random()*6.28, ph:Math.acos(2*Math.random()-1), w:0.3+Math.random()*0.5}));
  function spawn(){
    const ip = lab.state.isotonicPoint, inward = tonicity < ip;
    particles.push({th:Math.random()*6.283, ph:Math.acos(2*Math.random()-1), r: inward ? 1.9 : radius/100*0.6,
      speed:(0.4+Math.random()*0.5)*(Math.abs(ip-tonicity)/50+0.15), inward});
  }
  function loop(){
    const ip = lab.state.isotonicPoint, t = performance.now()*0.0003;
    if(!view.still) view.yaw += 0.003;
    const target = 100 + (ip - tonicity)*1.3;
    radius += (target - radius)*0.04; radius = Math.max(45, Math.min(165, radius));
    let st = 'Stable — Isotonic';
    if(tonicity < ip - 8) st = radius > 145 ? 'Swelling — Risk of Lysis' : 'Swelling — Water Entering';
    if(tonicity > ip + 8) st = radius < 60 ? 'Shrinking — Crenation Risk' : 'Shrinking — Water Leaving';
    readout.textContent = st;
    const R = radius/100;
    sc.begin();
    sc.wire([0,0,0],1.95,1.95,1.95,'rgba(232,245,238,0.10)',4);
    sc.glass([0,0,0],R,'rgba(43,214,168,0.07)','rgba(43,214,168,0.9)');
    sc.wire([0,0,0],R,R,R,'rgba(43,214,168,0.35)',5);
    sc.sphere([0,0,0],0.16,'#c9a8ff','#6a45c9');
    solutes.forEach(s => sc.sphere(sph3(R*0.55, s.th+t*s.w, s.ph), 0.055, '#ffe08a', '#f0b94a'));
    if(Math.random() < Math.abs(50-tonicity)/50*0.5 + 0.05) spawn();
    particles.forEach(p => { p.r += (p.inward ? -p.speed : p.speed)*0.02; sc.sphere(sph3(p.r,p.th,p.ph), 0.04, '#bfe6ff', '#5eb8ff'); });
    particles = particles.filter(p => p.r > 0.05 && p.r < 2.2);

    sc.end();
    raf = requestAnimationFrame(loop);
  }

  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* ---------- LAB 2: ENZYME ACTIVITY (3D) ---------- */
function labEnzyme(ctx, canvas, controls, lab){
  const view = {yaw:0.4, pitch:0.25, expand:0.37, hand:null, zoom:1};
  let temp = 37, ph = 7, raf;
  const readout = makeReadout(controls, 'Reaction Rate', '100%');
  const slider = makeSlider(controls, {label:'Temperature', min:0, max:100, step:1, value:37, unit:'°C', onChange:v=>{ temp=v; view.expand=v/100; }});
  makeSlider(controls, {label:'pH', min:0, max:14, step:0.5, value:7, unit:'', onChange:v=>ph=v});
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or two-finger pinch to change the temperature · or use your hand with the camera.',
    'Show one hand. Open fingers wide = HOTTER · fist = COLDER · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  const gc = makeGraph(controls), gctx = gc.getContext('2d');
  function rateAt(t, p){
    const oT = lab.state.optTemp, oP = lab.state.optPH;
    let f = Math.exp(-Math.pow(t-oT,2)/(2*15*15)); if(t > oT + 33) f *= 0.05;
    return f * Math.exp(-Math.pow(p-oP,2)/(2*1.8*1.8)) * 100;
  }
  const subs = Array.from({length:10}, () => ({p:[rnd3()*1.6,rnd3()*1.2,rnd3()*1.2], v:[rnd3(),rnd3(),rnd3()], prod:false, age:0}));
  const lumps = Array.from({length:9}, (_,i) => ({base:sph3(0.42, i*2.4, 0.5+(i%4)*0.7), j:[rnd3(),rnd3(),rnd3()]}));
  const SITE = [0.55,0.25,0];
  let tick = 0;
  function loop(){
    tick++; if(!view.still) view.yaw += 0.002;
    const cur = rateAt(temp, ph), oT = lab.state.optTemp, oP = lab.state.optPH;
    const dn = Math.max(Math.max(0, Math.min(1,(temp-(oT+25))/15)), Math.max(0, Math.min(1,(Math.abs(ph-oP)-3)/2)));
    const sp = 0.004 + 0.02*(temp+10)/110;
    sc.begin();
    sc.wire([0,0,0],1.9,1.4,1.4,'rgba(232,245,238,0.08)',3);
    // enzyme (loses shape when denatured)
    lumps.forEach(l => {
      const shake = dn*0.35 + 0.02;
      const p = [l.base[0]*(1+dn*0.9)+Math.sin(tick*0.1+l.j[0]*9)*shake*l.j[0], l.base[1]*(1+dn*0.9)+Math.sin(tick*0.12+l.j[1]*9)*shake*l.j[1], l.base[2]*(1+dn*0.9)+Math.sin(tick*0.09+l.j[2]*9)*shake*l.j[2]];
      sc.sphere(p, 0.3, dn>0.5?'#c9c9c9':'#ffd98a', dn>0.5?'#6d6d6d':'#c98a1c');
    });
    sc.sphere(SITE, dn>0.5?0.05:0.13, '#04100c', '#04100c');
    sc.text([0,0.95,0],'ENZYME'+(dn>0.5?' (denatured)':''),dn>0.5?'#ef6461':'#f0b94a',12);
    subs.forEach(s => {
      if(!s.prod){
        for(let k=0;k<3;k++){ s.p[k] += s.v[k]*sp; if(Math.abs(s.p[k])>(k===0?1.8:1.3)) s.v[k]*=-1; }
        const d = Math.hypot(s.p[0]-SITE[0], s.p[1]-SITE[1], s.p[2]-SITE[2]);
        if(d < 0.5 && Math.random() < cur/100*0.12 && dn < 0.9){ s.prod = true; s.age = 0; s.v = [Math.abs(rnd3())+0.4, rnd3(), rnd3()]; }
        sc.sphere(s.p, 0.1, '#bfe6ff', '#5eb8ff');
      } else {
        s.age++; s.p[0] += s.v[0]*0.012; s.p[1] += s.v[1]*0.012; s.p[2] += s.v[2]*0.012;
        sc.sphere(s.p, 0.075, '#b7f5d0', '#2bd6a8'); sc.sphere([s.p[0]+0.11,s.p[1]+0.04,s.p[2]], 0.075, '#b7f5d0', '#2bd6a8');
        if(s.age > 110){ s.prod = false; s.p = [-1.7, rnd3()*1.1, rnd3()*1.1]; s.v = [Math.abs(rnd3())+0.3, rnd3(), rnd3()]; }
      }
    });
    sc.caption('Blue = substrate · green = product · dark notch = active site');
    sc.end();
    gctx.clearRect(0,0,gc.width,gc.height);
    const gx = 12, gy = 10, gw = gc.width-24, gh = gc.height-34;
    gctx.strokeStyle = 'rgba(232,245,238,0.25)'; gctx.strokeRect(gx,gy,gw,gh);
    gctx.beginPath(); for(let tt=0;tt<=100;tt+=2){ const x=gx+tt/100*gw, y=gy+gh-rateAt(tt,ph)/100*gh; tt?gctx.lineTo(x,y):gctx.moveTo(x,y); }
    gctx.strokeStyle = '#f0b94a'; gctx.lineWidth = 2; gctx.stroke();
    gctx.beginPath(); gctx.arc(gx+temp/100*gw, gy+gh-cur/100*gh, 5, 0, 6.2832); gctx.fillStyle = '#2bd6a8'; gctx.fill();
    gctx.fillStyle = '#85a396'; gctx.font = '11px "IBM Plex Mono", monospace'; gctx.fillText('Rate vs temperature (\u00b0C)', gx, gy+gh+18);
    readout.textContent = cur.toFixed(0) + '%';
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

function labPunnett(ctx, canvas, controls){

  const slider = makeSlider(controls, {label:'Spread the cards', min:0, max:100, step:1, value:30, unit:'%', onChange:v=>{ view.expand=v/100; }});

  const sc = make3(ctx, canvas, view, kBase(canvas));
  const gcd = (a,b) => b===0 ? (a||1) : gcd(b,a%b);

      const c = i%2, r = Math.floor(i/2), g = [a1[c],a2[r]].sort().join(''), isDom = g[0]==='A';
      isDom ? dom++ : rec++;
      const p = pos(c,r);
      sc.box(p, cell, 0.12, cell, isDom?'rgba(43,214,168,0.35)':'rgba(239,100,97,0.35)', isDom?'#2bd6a8':'#ef6461');

    a2.forEach((a,r) => { const p = pos(0,r); sc.sphere([-step*1.05,0.1,p[2]], 0.17, '#bfe6ff', '#3a7fb8'); sc.text([-step*1.05,0.1,p[2]], a, '#04100c', 15); });
    sc.text([-step*1.05,0.1,-step*1.05], 'P1→ / P2↓', '#85a396', 11);
    // 3D phenotype bar
    const bx = step*1.6, hD = dom/4*1.6, hR = rec/4*1.6;

    if(rec) sc.box([bx, hD+hR/2-0.7, 0], 0.4, hR, 0.4, 'rgba(239,100,97,0.55)', '#ef6461');
    sc.text([bx,-0.95,0], 'Phenotype', '#85a396', 11);
    sc.text([bx,-1.15,0], dom+' dom : '+rec+' rec', '#e8f5ee', 11);
    sc.caption('Gamete spheres on the edges combine to give each offspring genotype');
    sc.end();
    const g = gcd(dom,rec);
    readout.textContent = rec===0 ? 'All Dominant' : (dom/g)+' : '+(rec/g);
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* ---------- LAB 4: DNA REPLICATION (3D) ---------- */
function labDNA(ctx, canvas, controls){
  const view = {yaw:0.5, pitch:0.15, expand:0.27, hand:null, zoom:1};
  let speed = 1, playing = true, raf, offset = 0;
  const slider = makeSlider(controls, {label:'Replication Speed', min:0.2, max:3, step:0.1, value:1, unit:'x', onChange:v=>speed=v});
  makeToggle(controls, ['Play','Pause'], (opt)=>{ playing = opt==='Play'; });
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or two-finger pinch to change the speed · or use your hand with the camera.',
    'Show one hand. Open fingers wide = FASTER replication · fist = slower · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  const colors = { A:['#8fe3c6','#1f9c7a'], T:['#a9d7ff','#3a7fb8'], G:['#ffd98a','#c98a1c'], C:['#cfc5ff','#6a5fc9'] };
  const comp = { A:'T', T:'A', G:'C', C:'G' };
  const bases = ['AT','TA','GC','CG'];
  const seq = Array.from({length:30}, () => bases[Math.floor(Math.random()*4)]);
  const SP = 0.22, SPAN = seq.length*SP, TOP = 2.0, FORK = 0.55;
  function loop(){
    if(!view.still) view.yaw += 0.002;
    if(playing) offset += speed*0.012;
    sc.begin();
    const pts = [];
    for(let i=0;i<seq.length;i++){
      const y = TOP - ((i*SP + offset) % SPAN) + (SPAN-4.2)/2*0;
      if(y < -1.85) { pts.push(null); continue; }
      const split = y < FORK, d = split ? Math.min((FORK-y)*0.55, 1.05) : 0;
      const ang = y*3.1;
      const b1 = seq[i][0], b2 = seq[i][1];
      let atoms;
      if(!split){
        const r = 0.5;
        atoms = [{p:[Math.cos(ang)*r,y,Math.sin(ang)*r], b:b1}, {p:[-Math.cos(ang)*r,y,-Math.sin(ang)*r], b:b2}];
        sc.line(atoms[0].p, atoms[1].p, 'rgba(232,245,238,0.35)', 1.5);
      } else {
        const r = 0.3, a = ang*0.7;
        const L = [-d,y,0], R = [d,y,0];
        atoms = [
          {p:[L[0]+Math.cos(a)*r,y,Math.sin(a)*r], b:b1}, {p:[L[0]-Math.cos(a)*r,y,-Math.sin(a)*r], b:comp[b1]},
          {p:[R[0]+Math.cos(a)*r,y,Math.sin(a)*r], b:b2}, {p:[R[0]-Math.cos(a)*r,y,-Math.sin(a)*r], b:comp[b2]},
        ];
        sc.line(atoms[0].p, atoms[1].p, 'rgba(232,245,238,0.35)', 1.5);
        sc.line(atoms[2].p, atoms[3].p, 'rgba(232,245,238,0.35)', 1.5);
      }
      atoms.forEach(a => { const c = colors[a.b]; sc.sphere(a.p, 0.075, c[0], c[1]); });
      pts.push({y, split, atoms});
    }
    // backbones between neighbouring rungs
    for(let i=1;i<pts.length;i++){
      const A = pts[i-1], B = pts[i];
      if(!A || !B || Math.abs(A.y-B.y) > SP*1.6 || A.split !== B.split) continue;
      for(let k=0;k<A.atoms.length;k++) sc.line(A.atoms[k].p, B.atoms[k].p, k%2?'rgba(94,184,255,0.6)':'rgba(43,214,168,0.6)', 2.5);
    }
    sc.sphere([0,FORK+0.12,0], 0.17, '#fff1c2', '#f0b94a');
    sc.text([0.55,FORK+0.18,0], 'helicase', '#f0b94a', 11);
    sc.caption('Parent DNA (top) unwinds at the fork; each strand builds a new complementary partner');
    sc.end();
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* ---------- LAB 5: PHOTOSYNTHESIS RATE (3D) ---------- */
function labPhotosynthesis(ctx, canvas, controls, lab){
  const view = {yaw:0.5, pitch:0.2, expand:0.5, hand:null, zoom:1};
  let light = 50, raf, bubbles = [], t = 0, history = [];
  const readout = makeReadout(controls, 'O₂ Bubbles / Min', '0');
  const slider = makeSlider(controls, {label:'Light Intensity', min:0, max:100, step:1, value:50, unit:'%', onChange:v=>{ light=v; view.expand=v/100; }});
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or two-finger pinch to change the light · or use your hand with the camera.',
    'Show one hand. Open fingers wide = BRIGHTER light · fist = dimmer · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  const gc = makeGraph(controls), gctx = gc.getContext('2d');
  const rate = l => Math.min(l, lab.state.satPoint)*0.5;
  const ring = (y,r,n) => { const a=[]; for(let i=0;i<=n;i++) a.push([Math.cos(i/n*6.2832)*r, y, Math.sin(i/n*6.2832)*r]); return a; };
  function loop(){
    t++; if(!view.still) view.yaw += 0.002;
    const rt = rate(light);
    sc.begin();

    sc.poly(ring(-1.3,1.0,28), {stroke:'rgba(94,184,255,0.6)', w:1.5});
    sc.poly(ring(1.0,1.0,28), {stroke:'rgba(94,184,255,0.6)', w:1.5});
    sc.poly(ring(0.75,0.97,28), {stroke:'rgba(94,184,255,0.9)', w:1.5, fill:'rgba(94,184,255,0.08)'});
    for(let k=0;k<4;k++){ const a=k*1.5708; sc.line([Math.cos(a),-1.3,Math.sin(a)],[Math.cos(a),1.0,Math.sin(a)],'rgba(94,184,255,0.35)',1.2); }
    // plant
    sc.line([0,-1.3,0],[Math.sin(t*0.02)*0.05,0.1,0],'#2bd6a8',4);
    for(let i=0;i<6;i++){
      const y = -0.8 + i*0.28, a = i*2.2 + Math.sin(t*0.02+i)*0.1;
      const c = [Math.cos(a)*0.38, y+0.1, Math.sin(a)*0.38];
      sc.line([0,y,0], c, '#2bd6a8', 2.5);
      sc.wire(c, 0.28, 0.06, 0.16, 'rgba(120,235,160,0.9)', 2);
      sc.sphere(c, 0.12, '#a8f0c2', '#27a867');
    }
    // sun and rays
    const sunR = 0.22 + light*0.0022, sunP = [-2.1, 1.6, 0.4];
    sc.sphere(sunP, sunR, '#fff3b0', '#f0b94a');
    const nR = Math.round(light/12);
    for(let k=0;k<nR;k++){ const f = ((t*0.01 + k/nR) % 1);
      sc.sphere([sunP[0]+(0.1-sunP[0])*f, sunP[1]+(0.1-sunP[1])*f, sunP[2]+(0.1-sunP[2])*f], 0.035, '#fff3b0', '#f0b94a'); }
    // bubbles
    if(Math.random() < rt/60) bubbles.push({p:[(Math.random()-0.5)*0.7, -0.6, (Math.random()-0.5)*0.7], r:0.04+Math.random()*0.04});
    bubbles.forEach(b => { b.p[1] += 0.014; b.p[0] += Math.sin(t*0.1+b.r*90)*0.002; sc.sphere(b.p, b.r, '#e6f6ff', '#5eb8ff'); });
    bubbles = bubbles.filter(b => b.p[1] < 0.75);
    sc.caption('Bubbles are oxygen released from the leaves · sun size = light intensity');
    sc.end();
    if(t % 40 === 0){ history.push(rt); if(history.length > 25) history.shift(); }
    gctx.clearRect(0,0,gc.width,gc.height);
    const gx = 12, gy = 10, gw = gc.width-24, gh = gc.height-34;
    gctx.strokeStyle = 'rgba(232,245,238,0.25)'; gctx.strokeRect(gx,gy,gw,gh);
    gctx.fillStyle = '#85a396'; gctx.font = '11px "IBM Plex Mono", monospace'; gctx.fillText('Rate over time', gx, gy+gh+18);
    gctx.beginPath(); history.forEach((h,i) => { const x=gx+i/24*gw, y=gy+gh-h/50*gh; i?gctx.lineTo(x,y):gctx.moveTo(x,y); });
    gctx.strokeStyle = '#f0b94a'; gctx.lineWidth = 2; gctx.stroke();
    readout.textContent = rt.toFixed(0);
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* ---------- LAB 6: CELLULAR RESPIRATION (3D) ---------- */
function labRespiration(ctx, canvas, controls){
  const view = {yaw:0.25, pitch:0.3, expand:0.5, hand:null, zoom:1.1};
  let mode = 'Aerobic', atp = 0, packet = null, raf, byproduct = '', tokens = [];
  const readout = makeReadout(controls, 'ATP Produced', '0');
  makeToggle(controls, ['Aerobic','Anaerobic'], (opt) => { mode = opt; reset(); });
  makeButton(controls, 'Run One Glucose', () => { reset(); packet = { x: -3.0, stageIdx: 0 }; });
  const slider = makeSlider(controls, {label:'Spread the stages', min:0, max:100, step:1, value:50, unit:'%', onChange:v=>{ view.expand=v/100; }});
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or two-finger pinch to spread the stages · or use your hand with the camera.',
    'Show one hand. Open fingers wide = spread the stages apart · fist = squeeze them together · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  const AER = [{x:-1.9,label:'Glycolysis',gain:2,loc:'cytoplasm'},{x:0,label:'Krebs Cycle',gain:2,loc:'matrix'},{x:1.9,label:'ETC',gain:32,loc:'inner membrane'}];
  const ANA = [{x:-1.3,label:'Glycolysis',gain:2,loc:'cytoplasm'},{x:1.3,label:'Fermentation',gain:0,loc:'cytoplasm'}];
  function reset(){ atp = 0; packet = null; byproduct = ''; tokens = []; readout.textContent = '0'; }
  function loop(){
    if(!view.still) view.yaw += 0.002;
    const k = 0.7 + view.expand*0.6, base = mode==='Aerobic' ? AER : ANA;
    const stages = base.map(s => ({...s, x:s.x*k}));
    const last = stages[stages.length-1].x;
    sc.begin();
    if(mode==='Aerobic') sc.wire([(stages[1].x+stages[2].x)/2, 0, 0], (stages[2].x-stages[1].x)/2+1.0, 0.85, 0.85, 'rgba(240,185,74,0.3)', 4);
    sc.line([-3,0,0],[last+1.2,0,0],'rgba(232,245,238,0.25)',1.5,[4,4]);
    stages.forEach(s => {
      sc.box([s.x,-0.05,0], 1.0, 0.7, 0.8, 'rgba(43,214,168,0.22)', '#2bd6a8');
      sc.text([s.x,-0.7,0], s.label, '#e8f5ee', 12);
      sc.text([s.x,-0.9,0], '('+s.loc+')', '#85a396', 10);
      sc.text([s.x,0.55,0], '+'+s.gain+' ATP', '#f0b94a', 11);
    });
    tokens.forEach((tk,i) => {
      const st = stages[tk.si], n = i, row = Math.floor(n/8), col = n%8;
      sc.sphere([st.x-0.45+col*0.13, 0.9+row*0.16, 0.25*((n%2)?1:-1)], 0.055, '#fff1c2', '#f0b94a');
    });
    if(packet){
      const done = packet.stageIdx >= stages.length;
      const targetX = done ? last + 1.0 : stages[packet.stageIdx].x;
      packet.x += Math.max((targetX - packet.x)*0.04, 0.012);
      sc.sphere([packet.x,0,0], 0.15, '#fff1c2', '#f0b94a');
      sc.text([packet.x,0.3,0], done ? 'done' : 'glucose', '#85a396', 10);
      if(!done && packet.x >= targetX - 0.03){
        const g = stages[packet.stageIdx].gain;
        for(let q=0;q<g;q++) tokens.push({si:packet.stageIdx});
        atp += g; readout.textContent = atp; packet.stageIdx++;
        if(packet.stageIdx >= stages.length && mode==='Anaerobic') byproduct = 'Byproduct: lactic acid (in muscle) or ethanol + CO₂ (in yeast)';
      }
      if(done && packet.x >= targetX - 0.02) packet = null;
    }
    sc.caption('Max yield: ' + (mode==='Aerobic'?36:2) + ' ATP / glucose (' + mode + ') · gold spheres = ATP');
    if(byproduct) sc.caption(byproduct, '#ef6461', canvas.height-150);
    sc.end();
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* ---------- LAB 7: CIRCULATORY SYSTEM (3D) ---------- */
function labCirculatory(ctx, canvas, controls){
  const view = {yaw:0.3, pitch:0.15, expand:0.24, hand:null, zoom:1.15};
  let bpm = 72, raf, t = 0;
  const readout = makeReadout(controls, 'Heart Rate', '72 bpm');
  const slider = makeSlider(controls, {label:'Heart Rate', min:40, max:180, step:1, value:72, unit:' bpm', onChange:v=>{ bpm=v; readout.textContent=v+' bpm'; view.expand=(v-40)/140; }});
  const cleanupIn = attach3D(canvas, controls, view, slider,
    'Drag to rotate · scroll or two-finger pinch to change the heart rate · or use your hand with the camera.',
    'Show one hand. Open fingers wide = FASTER heart rate · fist = slower · move left/right to rotate.');
  const sc = make3(ctx, canvas, view, kBase(canvas));
  const C = { RA:[-0.55,0.6,0], LA:[0.55,0.6,0], RV:[-0.5,-0.4,0], LV:[0.5,-0.4,0] };
  const PATH = [C.RA, C.RV, [-1.4,-0.2,0.3], [-2.0,0.5,0.4], [-1.4,1.2,0.3], [0,1.45,0.3], C.LA, C.LV, [1.5,-0.6,0.3], [1.9,-1.4,0.4], [0.3,-1.7,0.3], [-1.2,-1.5,0.3]];
  const segLen = PATH.map((p,i) => { const q = PATH[(i+1)%PATH.length]; return Math.hypot(q[0]-p[0],q[1]-p[1],q[2]-p[2]); });
  const total = segLen.reduce((a,b)=>a+b,0);
  const cells = Array.from({length:30}, (_,i) => i/30);
  function at(u){
    let d = u*total, i = 0; while(d > segLen[i]){ d -= segLen[i]; i++; }
    const a = PATH[i], b = PATH[(i+1)%PATH.length], f = d/segLen[i];
    return {p:[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f], i};
  }
  function loop(){
    t += bpm/3600; if(!view.still) view.yaw += 0.002;
    const beat = Math.sin(t*Math.PI*2);
    const atrial = 1 + Math.max(0,-beat)*0.12, vent = 1 + Math.max(0,beat)*0.14;
    sc.begin();
    for(let i=0;i<PATH.length;i++){
      const a = PATH[i], b = PATH[(i+1)%PATH.length], oxy = i>=3 && i<9;
      sc.line(a, b, oxy ? 'rgba(239,100,97,0.35)' : 'rgba(94,184,255,0.35)', 5);
    }
    sc.glass([-2.0,0.5,0.4], 0.35, 'rgba(255,200,200,0.12)', 'rgba(232,245,238,0.4)'); sc.text([-2.0,0.95,0.4],'lung','#85a396',10);
    sc.glass([1.9,-1.4,0.4], 0.35, 'rgba(255,200,200,0.12)', 'rgba(232,245,238,0.4)'); sc.text([1.9,-1.85,0.4],'body','#85a396',10);
    [['RA',atrial,'#5eb8ff'],['LA',atrial,'#ef6461'],['RV',vent,'#5eb8ff'],['LV',vent,'#ef6461']].forEach(([n,s,c]) => {
      sc.glass(C[n], 0.38*s, c+'30', c);
      sc.wire(C[n], 0.38*s, 0.38*s, 0.38*s, c+'66', 3);
      sc.text(C[n], n, '#e8f5ee', 13);
    });
    cells.forEach(u => {
      const {p,i} = at(((u + t*0.35) % 1 + 1) % 1);
      const oxy = i>=3 && i<9;
      sc.sphere(p, 0.055, oxy?'#ffb3b0':'#bfe6ff', oxy?'#ef6461':'#5eb8ff');
    });
    sc.caption('Red = oxygenated · Blue = deoxygenated · RA/LA = atria, RV/LV = ventricles');
    sc.end();
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}

/* ---------- LAB 8: RESPIRATORY SYSTEM (3D) ---------- */
function labRespiratory(ctx, canvas, controls){

    });
    sc.line([0,1.7,0],[0,0.95,0],'#85a396',6);
    sc.text([0.45,1.5,0],'trachea','#85a396',10);
    // diaphragm dome
    const dy = -1.15 - cycle*0.25;
    for(let k=-2;k<=2;k++){
      const pts=[]; for(let i=0;i<=16;i++){ const x=-1.7+i/16*3.4; pts.push([x, dy + 0.35*(1-Math.min(1,(x*x)/2.9))*(1-cycle*0.7) , k*0.3]); }
      sc.poly(pts, {stroke:'rgba(240,185,74,0.8)', w:1.8});
    }
    sc.text([1.45,dy-0.1,0],'diaphragm','#f0b94a',11);
    // air packets in the trachea
    air.forEach(a => {
      const f = (((t*3 + a.u) % 1) + 1) % 1, pos = inhale ? f : 1-f;
      sc.sphere([a.s*0.3, 1.7-pos*0.75, a.s*0.3], 0.045, inhale?'#bfe6ff':'#ffe08a', inhale?'#5eb8ff':'#f0b94a');
    });
    sc.text([-0.7,1.8,0], inhale ? 'O₂ in ↓' : 'CO₂ out ↑', inhale?'#5eb8ff':'#f0b94a', 12);
    sc.caption('Lungs expand as the diaphragm contracts and moves down');
    sc.end();
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => { cancelAnimationFrame(raf); cleanupIn(); };
}
