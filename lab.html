/* ---------- KPI LESSON ENGINE: tab bar, lesson panel, figures, Test Yourself ---------- */
const KPI = (function(){
  const $ = id => document.getElementById(id);
  let lab = null, data = null, tabs = [], cur = 0, seen = {}, qs = [], qi = 0, score = 0, perKpi = {}, figRaf = 0, pending = null, lastLab = null;
  try{ const p = parseInt(new URLSearchParams(window.location.search).get('tab'), 10); if(p > 0) pending = p - 1; }catch(e){}
  const tabsEl = $('kTabs');
  const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bestKey = () => 'biolab-best-' + (lab ? lab.id : '');
  function getBest(){ try{ return localStorage.getItem(bestKey()); }catch(e){ return null; } }
  function setBest(s, n){ try{ const old = parseFloat(localStorage.getItem(bestKey()) || '-1'); if(s/n > old) localStorage.setItem(bestKey(), (s/n).toFixed(3) + '|' + s + '/' + n); }catch(e){} }
  function bestLabel(){ const b = getBest(); return b && b.indexOf('|') > 0 ? 'best ' + b.split('|')[1] : 'Test Yourself'; }

  function build(){
    tabsEl.innerHTML = '';
    tabs.forEach((t, i) => {
      const b = document.createElement('button'); b.className = 'ktab'; b.dataset.i = i; b.setAttribute('role', 'tab');
      b.innerHTML = '<b></b><span></span>'; b.firstChild.textContent = t.kpi; b.lastChild.textContent = t.t;
      b.addEventListener('click', () => setTab(i));
      tabsEl.appendChild(b);
    });
    const q = document.createElement('button'); q.className = 'ktab special'; q.id = 'kQuiz';
    q.innerHTML = '<b>🧠 QUIZ</b><span id="kQuizSub"></span>'; q.addEventListener('click', openQuiz); tabsEl.appendChild(q);
    const a = document.createElement('button'); a.className = 'ktab special'; a.id = 'kAR';
    a.innerHTML = '<b>📷 AR</b><span>See it in 3D</span>'; a.addEventListener('click', () => pillAR.click()); tabsEl.appendChild(a);
    $('kQuizSub').textContent = bestLabel();
  }
  function mark(){
    Array.from(tabsEl.children).forEach((b, i) => {
      if(i < tabs.length){ b.classList.toggle('on', i === cur && !$('quizPanel').classList.contains('open')); b.classList.toggle('seen', !!seen[i]); }
    });
    $('kQuiz').classList.toggle('on', $('quizPanel').classList.contains('open'));
    $('kQuizSub').textContent = bestLabel();
    const on = tabsEl.querySelector('.ktab.on');
    if(on && on.scrollIntoView){ try{ const l = on.offsetLeft - tabsEl.clientWidth/2 + on.clientWidth/2; tabsEl.scrollTo ? tabsEl.scrollTo({left:l, behavior:'smooth'}) : (tabsEl.scrollLeft = l); }catch(e){} }
  }

  /* apply the slider / selector / button presets for a tab */
  function preset(t){
    const wc = $('wsControls');
    (t.click || []).forEach(txt => {
      const b = Array.from(wc.querySelectorAll('button')).find(x => x.textContent.trim() === txt);
      if(b) b.click();
    });
    Object.keys(t.set || {}).forEach(k => {
      const g = Array.from(wc.querySelectorAll('.control-group')).find(g => {
        const l = g.querySelector('label'); return l && l.firstChild && l.firstChild.textContent.trim().toLowerCase().indexOf(k.toLowerCase()) === 0;
      });
      if(!g) return;
      const sel = g.querySelector('select'), inp = g.querySelector('input[type=range]'), v = t.set[k];
      if(sel){ sel.value = v; sel.dispatchEvent(new Event('change')); }
      else if(inp){ inp.value = v; inp.dispatchEvent(new Event('input')); }
    });
  }

  /* energy-profile diagram for the enzyme lab */
  function figLoop(type){
    cancelAnimationFrame(figRaf);
    const c = $('lsFig'); let g = null; try{ g = c.getContext('2d'); }catch(e){}
    if(!g) return;
    const ss = x => x*x*(3-2*x), R = 0.42, P = 0.22;
    const E = (x, h) => R + (P-R)*ss(Math.min(1, Math.max(0, (x-0.42)/0.34))) + h*Math.exp(-Math.pow((x-0.4)/0.13, 2));
    function frame(ts){
      const W = c.width, H = c.height, L = 84, T = 30, gw = W - L - 20, gh = H - T - 66;
      const X = x => L + x*gw, Y = e => T + gh*(1 - e);
      g.clearRect(0, 0, W, H);
      g.strokeStyle = 'rgba(232,245,238,.4)'; g.lineWidth = 2; g.beginPath(); g.moveTo(L, T-6); g.lineTo(L, T+gh); g.lineTo(L+gw+6, T+gh); g.stroke();
      g.fillStyle = '#85a396'; g.font = '22px "IBM Plex Mono", monospace'; g.textAlign = 'center';
      g.fillText('Reaction progress →', L + gw/2, H - 12);
      g.save(); g.translate(26, T + gh/2); g.rotate(-Math.PI/2); g.fillText('Energy →', 0, 0); g.restore();
      function curve(h, col, dash){
        g.beginPath(); for(let i = 0; i <= 120; i++){ const x = i/120; const px = X(x), py = Y(E(x, h)); i ? g.lineTo(px, py) : g.moveTo(px, py); }
        g.strokeStyle = col; g.lineWidth = 5; g.setLineDash(dash || []); g.stroke(); g.setLineDash([]);
      }
      const hNo = 0.40, hEn = 0.17;
      curve(hNo, '#ef6461', type === 'both' ? [8, 6] : null);
      if(type === 'both') curve(hEn, '#2bd6a8');
      const peak = type === 'both' ? hEn : hNo, peakCol = type === 'both' ? '#2bd6a8' : '#ef6461';
      // Ea arrow
      const px = X(0.4), y0 = Y(R), y1 = Y(E(0.4, peak));
      g.strokeStyle = '#f0b94a'; g.lineWidth = 4; g.beginPath(); g.moveTo(px, y0); g.lineTo(px, y1 + 4); g.stroke();
      g.fillStyle = '#f0b94a'; g.beginPath(); g.moveTo(px, y1); g.lineTo(px-6, y1+10); g.lineTo(px+6, y1+10); g.fill();
      g.textAlign = 'left'; g.font = '600 27px "IBM Plex Mono", monospace'; g.fillText('Eₐ', px + 12, (y0 + y1)/2 + 10);
      g.fillStyle = '#e8f5ee'; g.font = '22px "IBM Plex Mono", monospace'; g.textAlign = 'center';
      g.fillText('Reactants', X(0.12), Y(R) + 34); g.fillText('Products', X(0.86), Y(P) + 34);
      // travelling molecule
      const x = ((ts || 0)/3200) % 1.1, xx = Math.min(1, x);
      g.beginPath(); g.arc(X(xx), Y(E(xx, peak)) - 2, 12, 0, 6.2832); g.fillStyle = peakCol; g.shadowColor = peakCol; g.shadowBlur = 12; g.fill(); g.shadowBlur = 0;
      if(type === 'both'){ g.textAlign = 'left'; g.font = '22px "IBM Plex Mono", monospace'; g.fillStyle = '#2bd6a8'; g.fillText('━ with enzyme: low Eₐ', X(0.5), T + 14); g.fillStyle = '#ef6461'; g.fillText('┅ no enzyme: high Eₐ', X(0.5), T + 42); }
      figRaf = requestAnimationFrame(frame);
    }
    figRaf = requestAnimationFrame(frame);
  }

  function render(t){
    $('lsHead').textContent = 'Lesson · ' + t.kpi + ' ' + t.t;
    $('lsKpi').textContent = 'KPI ' + t.kpi; $('lsCourse').textContent = data.course;
    $('lsTitle').textContent = t.t;
    const off = KPI_TEXT[data.course + ':' + t.kpi] || '';
    const oc = $('lsOutcome'); oc.innerHTML = '<small></small><span></span>';
    oc.firstChild.textContent = 'Learning outcome · ' + data.course + ' ' + t.kpi; oc.lastChild.textContent = off;
    oc.style.display = off ? '' : 'none';
    $('lsX').innerHTML = t.x;
    $('lsGo').innerHTML = '<small>Try it</small>' + t.go;
    $('lsQ').textContent = ' ' + t.ask[0]; $('lsAns').textContent = t.ask[1]; $('lsAns').classList.remove('show'); $('lsReveal').style.display = '';
    const fig = $('lsFig');
    if(t.fig){ fig.style.display = 'block'; figLoop(t.fig); } else { fig.style.display = 'none'; cancelAnimationFrame(figRaf); }
    $('lsChal').style.display = (t.ch == null) ? 'none' : '';
  }

  function setTab(i){
    if(!tabs.length) return;
    closeQuiz(true);
    cur = (i + tabs.length) % tabs.length; const t = tabs[cur]; seen[cur] = 1;
    if(lab.defaults && lab.state) Object.assign(lab.state, lab.defaults);   // textbook values for lessons
    closeChallengeModal();
    preset(t); render(t); mark();
  }

  /* ----- Test Yourself ----- */
  const FIXED_LAST = /^(all|both|none|neither)\b/i;
  function startQuiz(){
    const pool = shuffle(data.quiz.slice()).slice(0, Math.min(7, data.quiz.length));
    qs = pool.map(r => {
      const opts = r[2].map((o, i) => ({o, ok: i === r[3]}));
      const fixed = opts.filter(x => FIXED_LAST.test(x.o)), free = shuffle(opts.filter(x => !FIXED_LAST.test(x.o)));
      return {kpi: r[0], q: r[1], opts: free.concat(fixed), e: r[4]};
    });
    qi = 0; score = 0; perKpi = {}; showQ();
  }
  function showQ(){
    const q = qs[qi], body = $('qzBody');
    $('qzTitle').textContent = 'Test Yourself · ' + lab.title.replace(/ Lab$/, '');
    $('qzCount').textContent = (qi + 1) + ' / ' + qs.length;
    $('qzProg').style.width = (qi / qs.length * 100) + '%';
    body.innerHTML = '';
    const tag = document.createElement('div'); tag.innerHTML = '<span class="qz-tag"></span>'; tag.firstChild.textContent = 'KPI ' + q.kpi; body.appendChild(tag);
    const qq = document.createElement('div'); qq.className = 'qz-q'; qq.textContent = q.q; body.appendChild(qq);
    const exp = document.createElement('div'); exp.className = 'qz-exp';
    const nx = document.createElement('button'); nx.className = 'qz-next'; nx.textContent = qi === qs.length - 1 ? 'See results ›' : 'Next question ›';
    nx.addEventListener('click', () => { qi++; qi < qs.length ? showQ() : showResults(); });
    const btns = q.opts.map((op, k) => {
      const b = document.createElement('button'); b.className = 'qz-opt'; b.innerHTML = '<i>' + 'ABCDEF'[k] + '</i><span></span>'; b.lastChild.textContent = op.o;
      b.addEventListener('click', () => {
        btns.forEach((x, j) => { x.disabled = true; if(q.opts[j].ok) x.classList.add('ok'); });
        const right = op.ok; if(!right) b.classList.add('bad'); else score++;
        (perKpi[q.kpi] = perKpi[q.kpi] || {r: 0, w: 0})[right ? 'r' : 'w']++;
        exp.innerHTML = '<b style="color:' + (right ? 'var(--teal)' : 'var(--coral)') + '">' + (right ? 'Correct! ' : 'Not quite. ') + '</b>'; exp.appendChild(document.createTextNode(q.e));
        exp.classList.add('show'); nx.classList.add('show');
      });
      body.appendChild(b); return b;
    });
    body.appendChild(exp); body.appendChild(nx);
  }
  function showResults(){
    $('qzProg').style.width = '100%'; $('qzCount').textContent = 'Done';
    setBest(score, qs.length);
    const body = $('qzBody'); body.innerHTML = '';
    const pct = Math.round(score / qs.length * 100);
    const msg = pct >= 85 ? 'Excellent: secure understanding.' : pct >= 60 ? 'Good progress: review the red KPIs below.' : 'Keep going: revisit the red KPIs and try again.';
    body.innerHTML = '<div class="qz-score">' + score + ' / ' + qs.length + '</div><div style="color:var(--text-dim);margin-bottom:6px">' + msg + '</div><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--text-dim);text-transform:uppercase">KPIs in this quiz (tap to revisit)</div>';
    const chips = document.createElement('div'); chips.className = 'qz-chips';
    Object.keys(perKpi).forEach(k => {
      const c = document.createElement('button'); const weak = perKpi[k].w > 0;
      c.className = 'qz-chip ' + (weak ? 'weak' : 'good'); c.textContent = (weak ? '✗ ' : '✓ ') + k;
      const idx = tabs.findIndex(t => t.kpi === k);
      if(idx >= 0) c.addEventListener('click', () => setTab(idx)); else c.style.cursor = 'default';
      chips.appendChild(c);
    });
    body.appendChild(chips);
    const row = document.createElement('div'); row.className = 'qz-row';
    const again = document.createElement('button'); again.textContent = '↻ New questions'; again.addEventListener('click', startQuiz);
    const back = document.createElement('button'); back.textContent = '‹ Back to the lesson'; back.addEventListener('click', () => setTab(cur));
    row.appendChild(again); row.appendChild(back); body.appendChild(row);
    mark();
  }
  function openQuiz(){
    if(!data) return;
    closeChallengeModal();
    $('quizPanel').classList.add('open'); cancelAnimationFrame(figRaf); startQuiz(); mark();
  }
  function closeQuiz(silent){ $('quizPanel').classList.remove('open'); if(!silent) { mark(); const t = tabs[cur]; if(t && t.fig) figLoop(t.fig); } }

  function init(l){
    lab = l; data = KPI_LABS[l.id]; cancelAnimationFrame(figRaf);
    document.body.classList.toggle('no-kpi', !data);
    if(!data){ tabs = []; $('kpiBar').style.display = 'none'; $('panelLesson').style.display = 'none'; return; }
    $('kpiBar').style.display = ''; $('panelLesson').style.display = '';
    const same = lastLab === l.id; lastLab = l.id;
    tabs = data.tabs;
    if(!same){ seen = {}; cur = (pending != null && pending < tabs.length) ? pending : 0; pending = null; $('panelView').classList.add('collapsed'); if(mq.matches) $('panelLesson').classList.add('collapsed'); }
    build();
    $('qzBody').innerHTML = ''; $('quizPanel').classList.remove('open');
    setTab(cur);
  }
  $('kL').addEventListener('click', () => tabsEl.scrollBy ? tabsEl.scrollBy({left: -260, behavior: 'smooth'}) : (tabsEl.scrollLeft -= 260));
  $('kR').addEventListener('click', () => tabsEl.scrollBy ? tabsEl.scrollBy({left: 260, behavior: 'smooth'}) : (tabsEl.scrollLeft += 260));
  $('lsPrev').addEventListener('click', () => setTab(cur - 1));
  $('lsNext').addEventListener('click', () => setTab(cur + 1));
  $('lsReveal').addEventListener('click', () => { $('lsAns').classList.add('show'); $('lsReveal').style.display = 'none'; });
  $('lsChal').addEventListener('click', () => { const t = tabs[cur]; if(t && t.ch != null) openChallengeModal(lab, t.ch); });
  $('lsBig').addEventListener('click', e => { document.body.classList.toggle('cls'); e.currentTarget.classList.toggle('on', document.body.classList.contains('cls')); });
  $('qzClose').addEventListener('click', () => { closeQuiz(); setTab(cur); });
  document.addEventListener('keydown', e => {
    const tg = (e.target && e.target.tagName) || '';
    if(/INPUT|SELECT|TEXTAREA/.test(tg) && e.target.type !== 'range') return;
    if($('quizPanel').classList.contains('open') || !tabs.length) return;
    if(e.key === 'ArrowRight') setTab(cur + 1); else if(e.key === 'ArrowLeft') setTab(cur - 1);
  });
  return {init, setTab, tab: () => cur, count: () => tabs.length};
})();
